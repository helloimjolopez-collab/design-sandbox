<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard + Widget depth ladder — Pathway (draft v14)</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Display:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  :root{
    --cn-0:#fff;--cn-30:#ededed;--cn-40:#e1e1e1;--cn-110:#7b7b7b;--cn-130:#606060;--cn-150:#484848;--cn-190:#202020;
    --wn-0:#fefefd;--wn-100:#fbfaf8;--wn-200:#f7f5f3;--wn-250:#f3f0ec;--wn-300:#eeebe6;--wn-400:#d4cfc8;--wn-750:#87827b;--wn-950:#292724;
    --brand-10:#eef2fb;--brand-70:#6e8bd4;--brand-100:#4b6ec3;--brand-300:#3a5aaa;--brand-400:#345499;--brand-500:#2d4889;--brand-90:#5475c6;
    --red-10:#faefef;--red-100:#b03a3a;--red-130:#882727;--green-120:#1f602e;--green-10:#edf6f0;
    /* Pathway "Static/Positive" + "Static/Negative" tokens, pulled directly from the design system file's variables panel (fileKey 3sw45aVcngFAmpbP6cfrXP) rather than guessed. --red-100 already matched the design system exactly (#b03a3a); --pos-100 is the real Positive token (#36a14f) — used for the Budget widget's explicit red/green favourability coding, kept separate from --green-120/--txt-pos so nothing else in the app silently changes color. */
    --pos-100:#36a14f;--pos-10:#f0faf1;
    --txt-primary:var(--cn-190);--txt-secondary:var(--cn-150);--txt-subtle:var(--cn-130);--txt-pos:var(--green-120);
    --surface-canvas:var(--wn-250);--surface-widget:var(--wn-0);--surface-header:var(--wn-200);--stroke-widget:var(--wn-300);
    --focus:var(--brand-70);
    /* Amethyst primitives — charts & graphs only (app UI stays brand blue) */
    --am-700:#463f7f;--am-600:#4f4890;--am-500:#5951a0;--am-400:#7a72ba;--am-300:#9c95cf;--am-200:#c3bee6;--am-100:#e8e6f5;--am-50:#f4f2fa;
    --chart:var(--am-500);--chart-strong:var(--am-700);--chart-soft:var(--am-200);--chart-fill:var(--am-500);--brand-fill:var(--am-500);
    --dur:150ms;--dur2:300ms;--ease:cubic-bezier(.4,0,.2,1);--dec:cubic-bezier(0,0,.2,1);--r:12px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--surface-canvas);font-family:'Red Hat Text',sans-serif;color:var(--txt-primary);}
  .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;line-height:1;display:inline-block;vertical-align:middle;user-select:none;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:14px;font-weight:500;border:1px solid transparent;border-radius:8px;padding:9px 13px;cursor:pointer;background:transparent;color:var(--wn-950);white-space:nowrap;transition:background var(--dur),border-color var(--dur);}
  .btn .material-symbols-rounded{font-size:18px;}
  .btn.primary{background:var(--brand-100);color:#fff;}.btn.primary:hover{background:var(--brand-90);}
  .btn.outlined{border-color:var(--wn-750);}.btn.outlined:hover{background:var(--wn-200);}
  .btn.naked{color:var(--txt-secondary);}.btn.naked:hover{background:var(--wn-200);}
  .btn.secondary{background:var(--wn-200);color:var(--wn-950);border-color:var(--wn-300);}.btn.secondary:hover{background:var(--wn-300);}
  .btn.sm{padding:7px 10px;font-size:13px;}.btn.sm .material-symbols-rounded{font-size:16px;}
  .split{display:inline-flex}.split .primary.main{border-top-right-radius:0;border-bottom-right-radius:0;}
  .split .primary.more{border-top-left-radius:0;border-bottom-left-radius:0;border-left:1px solid rgba(255,255,255,.35);padding:7px 8px;}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;color:var(--txt-subtle);border-radius:8px;cursor:pointer;transition:background var(--dur),color var(--dur);}
  .iconbtn:hover{background:var(--wn-200);color:var(--wn-950);}
  .iconbtn .material-symbols-rounded{font-size:20px;}
  .iconbtn.danger:hover{background:var(--red-10);color:var(--red-100);}
  .iconbtn.on{color:var(--brand-400);}.iconbtn.on:hover{background:var(--brand-10);color:var(--brand-400);}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px;}
  /* ---- app shell (page chrome around the dashboard) ---- */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .topnav{display:flex;align-items:center;gap:14px;height:52px;padding:0 20px;background:var(--wn-0);border-bottom:1px solid var(--stroke-widget);flex:0 0 auto;}
  .tn-logo{font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:16px;color:var(--brand-500);letter-spacing:.2px;}
  .tn-div{width:1px;height:22px;background:var(--stroke-widget);}
  .tn-org{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--txt-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tn-org .material-symbols-rounded{font-size:18px;color:var(--txt-subtle);}
  .tn-spacer{flex:1;}
  .tn-ic{width:34px;height:34px;border:0;background:transparent;color:var(--txt-subtle);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .tn-ic:hover{background:var(--wn-200);color:var(--txt-primary);}
  .tn-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-100);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .appbody{flex:1;display:flex;min-height:0;}
  .sidenav{flex:0 0 216px;width:216px;background:var(--wn-100);border-right:1px solid var(--stroke-widget);padding:10px 12px 20px;display:flex;flex-direction:column;gap:1px;overflow:auto;}
  .sn-group{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-subtle);padding:14px 10px 4px;}
  .sn-item{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--txt-secondary);padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .sn-item .material-symbols-rounded{font-size:20px;color:var(--txt-subtle);}
  .sn-item:hover{background:var(--wn-200);color:var(--txt-primary);}
  .sn-item.on{background:var(--brand-10);color:var(--brand-400);font-weight:600;}
  .sn-item.on .material-symbols-rounded{color:var(--brand-400);}
  .appmain{flex:1;min-width:0;overflow:auto;}
  @media(max-width:900px){.sidenav{display:none;}}

  .shell{max-width:none;margin:0;padding:18px 28px 90px;}
  .pagetitle{font-family:'Red Hat Text',sans-serif;font-weight:500;font-size:16px;line-height:22px;color:var(--txt-primary);margin-bottom:22px;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px;flex-wrap:wrap;margin-bottom:14px;}
  .tb-left{display:flex;align-items:center;min-width:0;}
  /* dashboard selector: name (rename) + chevron (menu) as two distinct areas; text edge aligns to the page */
  .dash-select{display:inline-flex;align-items:center;gap:2px;border-radius:10px;padding:2px;margin-left:-6px;}
  .dash-select:hover{background:var(--wn-200);}
  .dash-name{font-family:'Red Hat Text',sans-serif;font-weight:500;font-size:20px;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt-primary);border-radius:6px;padding:2px 3px 2px 4px;cursor:text;}
  .dash-name:hover{background:var(--wn-300);}
  .dash-caret{display:inline-flex;align-items:center;justify-content:center;width:24px;height:28px;border:0;background:transparent;color:var(--txt-subtle);border-radius:8px;cursor:pointer;}
  .dash-caret:hover{background:var(--wn-300);}.dash-caret .material-symbols-rounded{font-size:20px;}
  .dash-name-input{font-family:'Red Hat Text',sans-serif;font-weight:500;font-size:20px;line-height:26px;border:1px solid var(--focus);border-radius:8px;padding:0 8px;margin-left:-1px;background:#fff;color:var(--txt-primary);}
  .dep-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .dep-right{display:flex;align-items:center;gap:8px;}
  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--wn-200);color:var(--txt-subtle);border:1px solid var(--stroke-widget);margin-left:6px;}
  .tb-right{display:flex;align-items:center;gap:8px;}
  .statusline{font-size:12px;color:var(--txt-subtle);margin:0;min-height:0;}
  .statusline:not(:empty){margin:4px 0 8px;}

  .dashboard{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:48px;gap:16px;grid-auto-flow:row dense;}
  @media(min-width:768px){.dashboard{grid-template-columns:repeat(8,1fr);}}
  @media(min-width:1024px){.dashboard{grid-template-columns:repeat(12,1fr);}}
  .widget[data-size="kpi"]{grid-row:span 3;}
  .widget[data-size="wide"]{grid-row:span 8;}
  .widget[data-size="xwide"]{grid-row:span 9;}
  .widget[data-size="kpi"],.widget[data-size="wide"],.widget[data-size="xwide"]{grid-column:span 4;}
  @media(min-width:768px){
    .widget[data-size="kpi"]{grid-column:span 4;}
    .widget[data-size="wide"]{grid-column:span 8;}.widget[data-size="xwide"]{grid-column:span 8;}
  }
  @media(min-width:1024px){
    .widget[data-size="kpi"]{grid-column:span 3;}
    .widget[data-size="wide"]{grid-column:span 6;}.widget[data-size="xwide"]{grid-column:span 12;}
  }
  /* KPI is one row tall: tighten header + content so number + trend fit a short tile */
  .widget[data-size="kpi"] .whead{padding-top:7px;padding-bottom:2px;}
  /* KPI glance: number + mini trend SIDE BY SIDE, never a full chart */
  .kpi-row{display:flex;align-items:stretch;gap:14px;padding:12px 16px;flex:1;min-height:0;}
  .kpi-row .dep-spark{flex:0 0 40%;max-width:42%;min-width:96px;align-self:stretch;display:block;position:relative;}
  .kpi-row .dep-spark svg{width:100%;height:100%;display:block;}
  .gl-sub{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11px;color:var(--txt-subtle);margin:0;}
  .kpi-num{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:1 1 auto;min-width:0;}
  .kpi-num .scope-chip{margin-bottom:6px;}
  .kpi-num .metric-value{font-size:22px;line-height:1.1;}
  .kpi-spark{flex:1;min-width:0;align-self:stretch;display:flex;align-items:center;}
  .kpi-spark svg{width:100%;height:40px;display:block;}
  .dep-spark{position:relative;display:block;height:44px;cursor:crosshair;flex:1;min-width:0;}
  .dep-spark svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .ds-hair{position:absolute;top:2px;bottom:2px;width:1px;background:var(--cn-110);opacity:0;pointer-events:none;transition:opacity .1s;}
  .ds-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brand-fill);border:2px solid var(--surface-widget);transform:translate(-50%,-50%);opacity:0;pointer-events:none;box-shadow:0 0 0 1px rgba(41,39,36,.12);}
  .ds-end{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brand-fill);border:1.5px solid var(--surface-widget);transform:translate(-50%,-50%);pointer-events:none;}
  .ds-tip{position:fixed;z-index:2200;display:flex;flex-direction:column;gap:1px;background:var(--surface-widget);border:1px solid var(--stroke-widget);border-radius:7px;box-shadow:0 10px 28px rgba(41,39,36,.2);padding:5px 9px;pointer-events:none;white-space:nowrap;}
  .ds-tip .dst-l{font-size:10px;font-weight:600;color:var(--txt-subtle);text-transform:uppercase;letter-spacing:.04em;}
  .ds-tip .dst-v{font-size:13px;font-weight:600;color:var(--txt-primary);font-variant-numeric:tabular-nums;}

  .widget{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface-header);border:1px solid var(--stroke-widget);border-radius:var(--r);box-shadow:0 1px 2px rgba(41,39,36,.04),0 2px 8px rgba(41,39,36,.05);transition:box-shadow var(--dur);}
  .whead{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 13px;}
  .wdrag{display:none;align-items:center;color:var(--cn-110);cursor:grab;}.wdrag .material-symbols-rounded{font-size:18px;}
  .wtitle{flex:0 1 auto;min-width:0;font-weight:600;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt-primary);border-radius:4px;}
  .wtitle-wrap{display:flex;flex-direction:column;gap:1px;min-width:0;flex:0 1 auto;}
  .wsubh{font-size:11px;line-height:1.25;color:var(--txt-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wtitle--edit{cursor:text;}.wtitle--edit:hover{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--cn-110);}
  .wtitle-input{font-family:inherit;font-weight:600;font-size:13px;line-height:18px;width:100%;border:1px solid var(--focus);border-radius:6px;padding:1px 6px;background:#fff;}
  .weyebrow{display:flex;align-items:center;gap:6px;margin-top:2px;}
  .wupd{font-size:11px;line-height:16px;color:var(--txt-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wrefresh{width:18px;height:18px;border:0;background:transparent;color:var(--txt-subtle);border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;opacity:0;pointer-events:none;transition:opacity .12s ease .3s;}
  .wrefresh:hover{background:var(--wn-200);color:var(--txt-primary);}
  .wrefresh .material-symbols-rounded{font-size:14px;}
  @media(hover:hover){.widget:hover .wrefresh{opacity:1;pointer-events:auto;}}
  @media(hover:none){.wrefresh{opacity:1;pointer-events:auto;transition:none;}}
  .wactions{display:flex;align-items:center;gap:0;flex-shrink:0;}
  .wactions .iconbtn{width:28px;height:28px;}.wactions .iconbtn .material-symbols-rounded{font-size:18px;}
  .wcontent{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface-widget);border-radius:10px 10px 0 0;box-shadow:0 -1px 3px rgba(41,39,36,.04);overflow:hidden;padding-bottom:10px;}

  .cmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 4px;}
  .kpi{font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:24px;line-height:1;}
  .ksub{font-size:11px;color:var(--txt-subtle);}
  .trend{display:inline-flex;align-items:center;gap:1px;font-size:12px;font-weight:500;color:var(--txt-pos);}.trend .material-symbols-rounded{font-size:14px;}
  .trend.neg{color:var(--red-130);}
  .tabs{display:inline-flex;gap:2px;background:var(--surface-header);border-radius:8px;padding:2px;flex-shrink:0;}
  .tab{border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:500;padding:3px 7px;border-radius:6px;cursor:pointer;color:var(--txt-secondary);}
  .tab[aria-selected="true"]{background:var(--surface-widget);color:var(--txt-primary);box-shadow:0 1px 2px rgba(41,39,36,.12);}
  .pad{padding:14px 16px 8px;}
  .metric-value{font-family:'Red Hat Display',sans-serif;font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;}
  .metric-delta{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:500;margin-top:6px;color:var(--txt-pos);}.metric-delta .material-symbols-rounded{font-size:16px;}
  .spark{margin-top:auto;width:100%;display:block;padding:6px 16px 12px;}.spark svg{display:block;width:100%;height:100%;}
  .chartwrap{flex:1;min-height:0;display:flex;gap:6px;padding:6px 16px 14px;}
  .yaxis{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--txt-subtle);padding-bottom:14px;text-align:right;min-width:16px;}
  .plot{flex:1;min-width:0;display:flex;flex-direction:column;}
  .bars{flex:1;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--stroke-widget);padding-bottom:2px;}
  .bar{background:var(--brand-fill);border-radius:3px 3px 0 0;flex:1;opacity:.9;}
  .xaxis{display:flex;justify-content:space-between;font-size:9px;color:var(--txt-subtle);padding-top:4px;}
  .scroll{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
  /* Pathway scrollbar — CSS approximation of the <Scrollable> primitive (6px fully-rounded thumb, scrim/faint at rest → scrim/light on hover, transparent track). The production build uses the real code-only <Scrollable> component. */
  .scroll,.menu-scroll,.pie-wrap.row .legend,.sidenav,.appmain{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.16) transparent;}
  .scroll::-webkit-scrollbar,.menu-scroll::-webkit-scrollbar,.pie-wrap.row .legend::-webkit-scrollbar,.sidenav::-webkit-scrollbar,.appmain::-webkit-scrollbar{width:6px;height:6px;}
  .scroll::-webkit-scrollbar-track,.menu-scroll::-webkit-scrollbar-track,.pie-wrap.row .legend::-webkit-scrollbar-track,.sidenav::-webkit-scrollbar-track,.appmain::-webkit-scrollbar-track{background:transparent;}
  .scroll::-webkit-scrollbar-thumb,.menu-scroll::-webkit-scrollbar-thumb,.pie-wrap.row .legend::-webkit-scrollbar-thumb,.sidenav::-webkit-scrollbar-thumb,.appmain::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:999px;border:1px solid transparent;background-clip:padding-box;}
  .scroll::-webkit-scrollbar-thumb:hover,.menu-scroll::-webkit-scrollbar-thumb:hover,.pie-wrap.row .legend::-webkit-scrollbar-thumb:hover,.sidenav::-webkit-scrollbar-thumb:hover,.appmain::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.30);}
  .list-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--stroke-widget);font-size:13px;}
  .list-row:last-child{border-bottom:none;}.list-row .material-symbols-rounded{font-size:18px;color:var(--txt-subtle);}
  .lr-main{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.lr-meta{font-size:12px;color:var(--txt-subtle);}
  .wt-row{display:flex;align-items:center;gap:12px;padding:7px 14px;border-bottom:1px solid var(--stroke-widget);font-size:13px;}
  .wt-row:last-child{border-bottom:none;}
  .wt-head{position:sticky;top:0;background:var(--surface-widget);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-subtle);}
  .wt-row .lr-main{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Individual deposit accounts only: two accounts can legitimately share the exact same name, so the account number is always shown (not just on hover) as a quiet second line under the name — disambiguates without a dedicated table column, and works for touch users who can't hover. */
  .wt-row .lr-main.lr-stack{display:flex;align-items:center;white-space:normal;overflow:visible;text-overflow:clip;min-width:0;}
  /* The tooltip trigger must hug the visible text, not the wide flex:1 table cell — otherwise the shared tip's center-on-trigger math (unchanged, used everywhere else in the app) centers on the cell's midpoint instead of the actual name, landing far away with a caret pointing nowhere. */
  .lr-tipwrap{display:inline-block;max-width:100%;min-width:0;vertical-align:middle;}
  .lr-tipwrap .lr-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lr-acctno{display:block;font-size:11px;line-height:1.3;color:var(--txt-subtle);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wt-type{flex:0 0 110px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt-secondary);}
  .wt-c2{flex:0 0 96px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
  .wt-row .dt-c{flex:0 0 88px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt-secondary);font-variant-numeric:tabular-nums;}
  .wt-row .dt-tr{flex:0 0 84px;text-align:left;overflow:visible;}
  .rtrend{display:inline-flex;align-items:center;gap:1px;justify-content:flex-start;font-weight:600;color:var(--txt-pos);font-variant-numeric:tabular-nums;}
  .rtrend.neg{color:var(--red-100);}
  .rtrend .material-symbols-rounded{font-size:20px;margin:-3px -2px;}
  .dep-mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 16px 8px;}
  .dmh-lbl{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-subtle);}
  .dmh-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .dmh-row .metric-value{font-size:22px;line-height:1.1;}
  /* Grid, not stacked flex rows: the toggle row and the search/break-toggle row share one right-hand column, so whichever is wider sets the column width and the other stretches to match it exactly — search bar and toolbar always line up, instead of each sizing to its own content. */
  .dep-hd{display:grid;grid-template-columns:1fr auto;align-items:start;column-gap:12px;row-gap:14px;padding:14px 16px 16px;}
  .dep-hd-top,.dep-hd-num{display:contents;}
  .delta-grp{display:inline-flex;align-items:center;gap:3px;}
  .type-badge{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:1px 9px 1px 7px;border-radius:999px;background:var(--wn-200);color:var(--txt-secondary);font-size:11px;font-weight:500;line-height:18px;cursor:pointer;}
  .type-badge:hover{background:var(--wn-300);}
  .type-badge .tb-ic{font-size:14px;color:var(--txt-subtle);flex:0 0 auto;}
  .type-badge .tb-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* Two chart colours only: light purple Budget (the plan), dark purple Actual (the result). No red — favourability is read from the hover popover and the headline pill, never from the bar colour itself. */

  .bgt-plotrow2{flex:1;min-height:0;display:flex;gap:8px;padding:0 16px;}
  .bgt-yax2{flex:0 0 40px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--txt-subtle);text-align:right;font-variant-numeric:tabular-nums;padding:2px 0;}

  /* Hover on a set of bars: only the neutral column fill darkens a couple steps so the hovered group is obvious. The bars themselves keep their exact legend colours — never recolour them on hover, or the legend and the bars disagree. */

  /* Custom two-line x-axis (period name + its own signed variance) laid out as a second flex row with the same column count/gap as the bars, so alignment is exact by construction. Variance number is a single neutral colour (no red); its sign carries the direction, the popover carries the good/bad reading. */

  .bgt-viewbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 16px 8px;flex-wrap:wrap;}

  .bgt-tbl{padding:2px 16px 14px;display:flex;flex-direction:column;min-height:0;}

  .bgt-ttot{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 0;border-top:1.5px solid var(--stroke-widget);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px;}
  /* Global filter-control styling (shell-wide): every interactive filter/scope dropdown — Deposits' account scope, Payroll's period, Budget's scope + time span, etc. — reads as a secondary-fill button with a leading filter glyph and a trailing chevron, so filters are obviously filters. Non-interactive label chips (no data-action, e.g. the KPI-tile scope label) are left alone. */
  .filter-chip[data-action],.scope-chip[data-action]{background:var(--wn-200);border-color:var(--wn-300);color:var(--txt-primary);}

  .filter-chip[data-action]::before,.scope-chip[data-action]::before{font-family:'Material Symbols Rounded';content:'filter_list';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;font-size:16px;line-height:1;color:var(--txt-subtle);flex:0 0 auto;margin-right:1px;}
  .bgt-scope-chip{justify-self:start;max-width:190px;}

  .bgt-repctx{font-size:11.5px;color:var(--txt-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}

  .bgt-inner2{flex:1;min-height:0;min-width:100%;display:flex;flex-direction:column;}
  /* Report-line combobox: report names are non-clickable group headings above their selectable lines — a standard grouped-select pattern, all in one popover (no drill-in). */

  /* Bar hover shows a formatted popover card, not a cramped one-line tooltip: budget and actual on their own rows with swatches, a divider, then the variance and whether it is favourable or unfavourable. */
  .bgt-pop{position:fixed;z-index:120;background:var(--surface-widget);border:1px solid var(--stroke-widget);border-radius:10px;box-shadow:0 12px 32px rgba(41,39,36,.22),0 2px 8px rgba(41,39,36,.12);padding:10px 12px;min-width:190px;pointer-events:none;font-size:12px;}

/* ===== Bank Balances (prefix: bank) — RENDER ===== */
  function bankAccounts(w){return BANK_ACCOUNTS;}

  function bankSelected(w){if(!w.bkacct)return null;var list=bankAccounts(w);for(var i=0;i<list.length;i++)if(list[i].id===w.bkacct)return list[i];return null;}
  function bankMoney(n){return n<0?("−$"+Math.abs(n).toLocaleString()):("$"+n.toLocaleString());}
  function bankTotal(w){return bankAccounts(w).reduce(function(s,a){return s+bankEnding(a);},0);}
  function bankNegCount(w){return bankAccounts(w).filter(function(a){return bankEnding(a)<0;}).length;}

  function bankViewToggle(w){var v=w.bkview||"table",single=!!bankSelected(w),chartIc=single?"bar_chart":"donut_small";var opts=[["table","Table","table_rows"],["chart","Chart",chartIc]];return '<div class="vtoggle" role="group" aria-label="View">'+opts.map(function(o){return '<button class="vt'+(v===o[0]?" on":"")+'" data-action="bank-view" data-id="'+w.id+'" data-v="'+o[0]+'" aria-pressed="'+(v===o[0])+'">'+ICON(o[2])+o[1]+'</button>';}).join("")+'</div>';}

    else if(sel){var end=bankEnding(sel),neg=end<0;numInner='<div class="dep-hd-kpigrp"><span class="metric-value'+(neg?" bank-neg":"")+'">'+bankMoney(end)+'</span><span class="bank-pill">'+ICON("account_balance")+sel.type+'</span></div>';}
    else{var tot=bankTotal(w),n=bankAccounts(w).length,over=bankNegCount(w);var overPill=over?'<span class="bank-pill warn" data-tip="'+over+' account'+(over>1?"s":"")+' currently overdrawn (a negative balance). Overdrawn accounts stay in the table but are left out of the chart." data-tip-plain>'+ICON("warning")+over+' overdrawn</span>':"";numInner='<div class="dep-hd-kpigrp"><span class="metric-value">'+bankMoney(tot)+'</span><span class="bank-pill">'+n+' accounts</span>'+overPill+'</div>';}
    var ctx=sel?('Balance since the last reconciliation (unreconciled activity), account '+(sel.acctFull||sel.acct)+'.'):('Combined balance across all active bank accounts, based on unreconciled activity since the last reconciliation.');

  function bankSkeleton(){var bars="";[58,82,50,90,66,74,60].forEach(function(h){bars+='<div class="bank-sk-col"><span class="sk bank-sk-bar" style="height:'+h+'%"></span></div>';});return '<div class="bank-skel"><div class="bank-skel-plot">'+bars+'</div><div class="bank-skel-cap"><span class="bgt-spin"></span>Loading…</div></div>';}
  function bankAllTable(w,full){

    var rowsHtml='<div class="bgt-pop-r"><span class="bgt-pop-sw" style="background:var(--am-200)"></span><span class="bgt-pop-lbl">Budget</span><span class="bgt-pop-v">'+money(budget)+'</span></div>';
    if(actual!=null)rowsHtml+='<div class="bgt-pop-r"><span class="bgt-pop-sw" style="background:var(--am-600)"></span><span class="bgt-pop-lbl">Actual</span><span class="bgt-pop-v">'+money(actual)+'</span></div>';
    else rowsHtml+='<div class="bgt-pop-r"><span class="bgt-pop-sw" style="background:var(--am-600);opacity:.35"></span><span class="bgt-pop-lbl">Actual</span><span class="bgt-pop-v" style="color:var(--txt-subtle);font-weight:400">Not posted yet</span></div>';
    var varHtml=(vr!=null)?('<div class="bgt-pop-div"></div><div class="bgt-pop-var"><span class="bgt-pop-lbl">Variance</span><span class="bgt-pop-fav '+favCls+'">'+(neg?"−":"+")+money(Math.abs(vr))+' · '+favWord+'</span></div>'):'';
    var note=partial?'<div class="bgt-pop-note">Partial quarter, not all months posted yet.</div>':'';
    bgtHideBpop();
    bpopEl=document.createElement("div");bpopEl.className="bgt-pop";
    bpopEl.innerHTML='<div class="bgt-pop-h">'+period+'</div>'+rowsHtml+varHtml+note;
    document.body.appendChild(bpopEl);
    var bw=bpopEl.offsetWidth,bh=bpopEl.offsetHeight,M=10;
    var left=mx+14;if(left+bw>innerWidth-M)left=mx-bw-14;if(left<M)left=M;
    var top=my+14;if(top+bh>innerHeight-M)top=my-bh-14;if(top<M)top=M;
    bpopEl.style.left=left+"px";bpopEl.style.top=top+"px";
  }
  document.addEventListener("mousemove",function(e){var col=e.target.closest&&e.target.closest(".bgt-col2[data-bpop]");if(!col){if(bpopEl)bgtHideBpop();return;}bgtShowBpop(col,e.clientX,e.clientY);});
  /* Glance spark scrubbing: hover the deposits sparkline to read the total at that point in time */
  var dsTip=null;
  function dsShow(e,label,val){if(!dsTip){dsTip=document.createElement("div");dsTip.className="ds-tip";document.body.appendChild(dsTip);}dsTip.innerHTML='<span class="dst-l">'+label+'</span><span class="dst-v">'+val+'</span>';var x=e.clientX+12,y=e.clientY-16;if(x+140>innerWidth)x=e.clientX-140;dsTip.style.left=x+"px";dsTip.style.top=y+"px";}
  function dsHide(){if(dsTip){dsTip.remove();dsTip=null;}}
  function dsReset(sp){var num=document.getElementById("depnum");if(num&&num.getAttribute("data-latest"))num.textContent=num.getAttribute("data-latest");var h=sp.querySelector(".ds-hair"),d=sp.querySelector(".ds-dot");if(h)h.style.opacity="0";if(d)d.style.opacity="0";dsHide();}
  document.addEventListener("mousemove",function(e){var sp=e.target.closest&&e.target.closest(".dep-spark");if(!sp){if(dsTip)dsHide();return;}var r=sp.getBoundingClientRect();var frac=Math.min(1,Math.max(0,(e.clientX-r.left)/(r.width||1)));var s=sp.getAttribute("data-series").split(","),labs=sp.getAttribute("data-labels").split("|"),xp=sp.getAttribute("data-xp").split(","),yp=sp.getAttribute("data-yp").split(",");var idx=Math.round(frac*(s.length-1));var num=document.getElementById("depnum");if(num)num.textContent=money(parseInt(s[idx],10));var hair=sp.querySelector(".ds-hair"),dot=sp.querySelector(".ds-dot");if(hair){hair.style.left=xp[idx]+"%";hair.style.opacity="1";}if(dot){dot.style.left=xp[idx]+"%";dot.style.top=yp[idx]+"%";dot.style.opacity="1";}dsShow(e,labs[idx],money(parseInt(s[idx],10)));});
  document.addEventListener("mouseout",function(e){var sp=e.target.closest&&e.target.closest(".dep-spark");if(!sp)return;if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(".dep-spark"))return;dsReset(sp);});
  /* Trend line chart: hover shows a guideline, dots on each line, and a tooltip listing each account's balance at that point */
  var lnTipEl=null,lnIdx=-1,lnActive=null,lnActivePrev=null,lnCanvas=null,lnRAF=0,lnMx=0,lnMy=0,lnActiveName=null;
  function trHighlight(cv,idx){if(!cv)return;cv.querySelectorAll("polyline.tl").forEach(function(pl){var on=(+pl.getAttribute("data-idx")===idx);pl.style.strokeOpacity=(idx==null||on)?"1":"0.18";pl.setAttribute("stroke-width",on&&idx!=null?"2.8":"1.7");});var plot=cv.parentNode,lg=plot&&plot.querySelector(".tr-legend");if(lg)lg.querySelectorAll(".tr-lg-row").forEach(function(r){r.classList.toggle("act",idx!=null&&(+r.getAttribute("data-idx")===idx));});}
  function hideLnTip(){if(lnTipEl){lnTipEl.remove();lnTipEl=null;}lnIdx=-1;lnActive=null;lnActivePrev=null;lnActiveName=null;if(lnCanvas){var cr=lnCanvas.querySelector(".tr-cross");if(cr)cr.innerHTML="";trHighlight(lnCanvas,null);}lnCanvas=null;}
  function lnUpdate(){lnRAF=0;var cv=lnCanvas;if(!cv||!document.body.contains(cv)){hideLnTip();return;}var lo=+cv.getAttribute("data-lo"),hi=+cv.getAttribute("data-hi"),dom=(hi-lo)||1;var blob=cv.getAttribute("data-blob").split(";").map(function(x){var p=x.split("|");return {name:p[0],color:p[1],idx:+p[2],s:p[3].split(",").map(Number)};});var months=cv.getAttribute("data-months").split(",");var n=+cv.getAttribute("data-n");if(!n)return;var rect=cv.getBoundingClientRect();var xf=(lnMx-rect.left)/rect.width;var idx=Math.max(0,Math.min(n-1,Math.round(xf*(n-1))));
    var act=null;if(lnActive!=null)blob.forEach(function(b){if(b.idx===lnActive)act=b;});
    if(idx!==lnIdx||lnActive!==lnActivePrev){lnIdx=idx;lnActivePrev=lnActive;lnActiveName=act?act.name:null;var xp=(n>1?idx/(n-1)*100:50);var cr=cv.querySelector(".tr-cross");if(cr){var cline=cr.querySelector(".tr-cline"),cdot=cr.querySelector(".tr-cdot");if(!cline){cline=document.createElement("div");cline.className="tr-cline";cr.appendChild(cline);}if(!cdot){cdot=document.createElement("div");cdot.className="tr-cdot";cr.appendChild(cdot);}cline.style.left=xp+"%";cline.style.opacity="1";if(act){var yp=Math.max(0,Math.min(100,(1-(act.s[idx]-lo)/dom)*100));cdot.style.left=xp+"%";cdot.style.top=yp+"%";cdot.style.borderColor=act.color;cdot.style.opacity="1";}else{cdot.style.opacity="0";}}trHighlight(cv,(blob.length>1&&act)?act.idx:null);if(act){if(!lnTipEl){lnTipEl=document.createElement("div");lnTipEl.className="ln-tip";document.body.appendChild(lnTipEl);}lnTipEl.innerHTML='<div class="lt-m">'+months[idx]+'</div><div class="lt-r"><span class="dot" style="background:'+act.color+'"></span><span>'+act.name+'</span><span class="lt-v">'+money(act.s[idx])+'</span></div>';}else if(lnTipEl){lnTipEl.remove();lnTipEl=null;}}
    if(lnTipEl){var tx=lnMx+14,ty=lnMy+14;if(tx+220>innerWidth)tx=lnMx-220;lnTipEl.style.left=tx+"px";lnTipEl.style.top=ty+"px";}}
  document.addEventListener("mousemove",function(e){var lg=e.target.closest&&e.target.closest(".tr-lg-row");if(lg){var plot=lg.closest(".tr-plot"),cvx=plot&&plot.querySelector(".tr-canvas");if(cvx){if(lnTipEl)hideLnTip();trHighlight(cvx,+lg.getAttribute("data-idx"));}return;}var cv=e.target.closest&&e.target.closest(".tr-canvas");if(!cv){if(lnCanvas)hideLnTip();return;}if(cv!==lnCanvas){if(lnCanvas)trHighlight(lnCanvas,null);lnCanvas=cv;lnIdx=-1;lnActivePrev=null;}lnMx=e.clientX;lnMy=e.clientY;var hit=e.target.closest?e.target.closest("polyline.tl-hit"):null;var single=cv.getAttribute("data-blob").indexOf(";")<0;lnActive=hit?+hit.getAttribute("data-idx"):(single?(+cv.getAttribute("data-blob").split("|")[2]):null);if(!lnRAF)lnRAF=requestAnimationFrame(lnUpdate);});
  document.addEventListener("mouseout",function(e){var t=e.target;if(t.closest&&t.closest(".tr-lg-row")){var plot=t.closest(".tr-plot"),cvx=plot&&plot.querySelector(".tr-canvas");var to=e.relatedTarget;if(cvx&&!(to&&to.closest&&(to.closest(".tr-lg-row")||to.closest(".tr-canvas"))))trHighlight(cvx,null);return;}if(!lnCanvas)return;var cv=t.closest&&t.closest(".tr-canvas");if(!cv)return;if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest(".tr-canvas"))return;hideLnTip();});
  document.addEventListener("click",function(e){var cv=e.target.closest&&e.target.closest(".tr-canvas");if(!cv||cv.getAttribute("data-multi")!=="1")return;if(lnActive==null)return;var wid=cv.getAttribute("data-id"),wc=find(wid);if(wc){wc.trIso=(wc.trIso===lnActive)?null:lnActive;hideLnTip();render();}},true);
  window.addEventListener("scroll",function(e){var t=e.target;if(t&&t.closest&&(t.closest("#overlay")||t.closest(".menu-scroll")||t.closest(".scroll")))return;hideTip();if(pop){pop=null;render();}},true);
  window.addEventListener("resize",function(){if(pop)renderOverlay();});
  render();
})();
</script>
