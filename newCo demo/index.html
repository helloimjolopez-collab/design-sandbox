          The current apps are desktop-first and don't meaningfully adapt — the fixed rail and dense tables don't reflow, so a phone gets a shrunken desktop page. Yet volunteers and staff increasingly work from a phone (check-in, giving, directory lookups). Spired treats small screens as a first-class case: the switcher and top bar stay put, the rail becomes a drawer, and content goes full-bleed.

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, paddingBottom: 8 }}>
          <IAFrame label="Today — a squeezed desktop page" tone="bad">
            <p style={{ fontSize: 11, color: "var(--semantic-color-light-mode-text-static-tertiary-base)", marginBottom: 8 }}>Fixed rail + non-reflowing tables on a phone</p>
            <MiniNavItem icon="table_rows" label="Rail eats half the screen" muted />
            <MiniNavItem icon="pinch" label="Pinch-and-zoom to read tables" muted />
            <p style={{ fontSize: 11, color: "#B0473F", marginTop: 8 }}>No drawer, no reflow — mobile is an afterthought.</p>
          </IAFrame>
          <IAFrame label="Spired — mobile-first navigation" tone="good">
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <Icon name="menu" size={16} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)" }} />
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 8px", borderRadius: 999, background: "var(--semantic-color-light-mode-fill-static-accent-amethyst-light)" }}>
                <Icon name="apps" size={12} style={{ color: "var(--semantic-color-light-mode-text-action-primary-base)" }} /><span style={{ fontSize: 11, fontWeight: 600, color: "var(--semantic-color-light-mode-text-action-primary-base)" }}>People ▾</span>
              </div>
            </div>
            <MiniNavItem icon="swipe_right" label="Rail opens as a drawer" active />
            <MiniNavItem icon="fit_screen" label="Content goes full-bleed" />
            <p style={{ fontSize: 11, color: "var(--spd-badge-positive-fg)", marginTop: 8 }}>Switcher persists; you always know the module, even on a phone.</p>
          </IAFrame>
        </div>
      </div>
    </div>
  );
}

/* In-module placeholder — reinforces which module/section you're in for the
   sections not fleshed out in this concept. */
function ModulePlaceholder({ mod, item }) {
  const section = [...(mod.nav || []), ...(mod.footerNav || [])].find((n) => n.id === item);
  return (
    <div className="spd-page">
      <div className="spd-page__inner">
        <div className="spd-fade-in" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, minHeight: "58vh", textAlign: "center" }}>
          <span className="spd-navitem__chip" style={{ width: 56, height: 56, borderRadius: 18, background: `color-mix(in srgb, ${mod.color} 12%, transparent)` }}>
            <Icon name={section ? section.icon : mod.icon} filled size={26} style={{ color: mod.color }} />
          </span>
          <div>
            <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "1px", textTransform: "uppercase", color: "var(--semantic-color-light-mode-text-static-tertiary-base)" }}>{mod.name}</p>
            <p style={{ fontSize: 22, fontWeight: 600, marginTop: 4 }}>{section ? section.label : mod.name}</p>
          </div>
          <p style={{ fontSize: 14, color: "var(--semantic-color-light-mode-text-static-secondary-subtle)", maxWidth: 470, lineHeight: 1.55 }}>
            This section isn't built out in the concept — it's here to show the information architecture. Notice the switcher up top and this module's own rail on the left. <strong style={{ fontWeight: 600, color: "var(--semantic-color-light-mode-text-static-secondary-base)" }}>People → Directory</strong> and <strong style={{ fontWeight: 600, color: "var(--semantic-color-light-mode-text-static-secondary-base)" }}>Giving Admin → Overview</strong> are the fleshed-out examples.
          </p>
        </div>
      </div>
    </div>

}

/* ═══ App shell ═══ */

const CONCEPT_PAGES = {
  motion: MotionPage, loading: LoadingStatesPage, errors: ErrorStatesPage,
  validation: ValidationStatesPage, states: ComponentStatesPage,
  feedback: SystemFeedbackPage, ia: InfoArchitecturePage,
};

function App() {
  const [booting, setBooting] = useState(true);
  const [mode, setMode] = useState("light");
  const [moduleId, setModuleId] = useState("home");
  const [itemByModule, setItemByModule] = useState({}); // remembers last section per module
  const [mobileNav, setMobileNav] = useState(false);
  const [navRail, setNavRail] = useState(false);       // side-nav collapse control: full labels vs icon rail
  const [switcherPinned, setSwitcherPinned] = useState(false); // module switcher docked as a left rail
  const [switcherOpen, setSwitcherOpen] = useState(false);     // switcher popover open
  const [switching, setSwitching] = useState(false);   // brief loader while moving to another module
  const hoverTimer = useRef(null);                     // hover-intent open/close timer for the switcher

  // The Spired logo always opens the module-switcher popover (the drawer on
  // mobile). The popover is also where you pin the switcher to a rail — and,
  // when already pinned, where you unpin it back to a popover.
  const onLogoClick = () => {
    clearTimeout(hoverTimer.current);
    if (window.matchMedia("(max-width: 768px)").matches) { setMobileNav((o) => !o); return; }
    setSwitcherOpen((o) => !o);
  };
  // Hover-to-open with intent: a short delay before opening so a passing cursor
  // doesn't trigger it, and a grace delay before closing so you can travel to
  // the popover without it vanishing. Desktop only (no hover on touch).
  const hoverOpen = () => {
    if (window.matchMedia("(max-width: 768px)").matches) return;
    clearTimeout(hoverTimer.current);
    hoverTimer.current = setTimeout(() => setSwitcherOpen(true), 340);
  };
  const hoverClose = () => {
    clearTimeout(hoverTimer.current);
    hoverTimer.current = setTimeout(() => setSwitcherOpen(false), 260);
  };
  const hoverKeep = () => { clearTimeout(hoverTimer.current); };

  useEffect(() => { const t = setTimeout(() => setBooting(false), 2900); return () => clearTimeout(t); }, []);
  useEffect(() => { document.documentElement.dataset.spdMode = mode; }, [mode]);

  if (booting) {
    return (
      <div className="spd-boot" role="status" aria-label="Loading Spired">
        <BootLogo />
      </div>
    );
  }

  const mod = MODULE_MAP[moduleId];
  const item = itemByModule[moduleId] ?? firstItemOf(moduleId);

  const goModule = (id) => {
    setMobileNav(false);
    if (id === moduleId) return;
    // Switching modules moves to a different "space" — show a brief branded
    // load so it doesn't feel like an instant, weightless jump.
    setSwitching(true);
    setModuleId(id);
    setTimeout(() => setSwitching(false), 750);
  };
  const goItem = (id) => { setItemByModule((s) => ({ ...s, [moduleId]: id })); setMobileNav(false); };
  const goModuleHome = () => goItem(firstItemOf(moduleId)); // badge → back to this module's home
  const pinSwitcher = () => { setSwitcherPinned(true); setSwitcherOpen(false); };
  const unpinSwitcher = () => { setSwitcherPinned(false); }; // keep popover open so it's clearly back to popover mode
  const logoLabel = switcherOpen ? "Close module switcher" : "Switch module";

  const renderPage = () => {
    if (moduleId === "home") return item === "dashboard" ? <HomePage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "people") return item === "directory" ? <PeoplePage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "giving") return item === "overview" ? <GivingOverviewPage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "concept") { const P = CONCEPT_PAGES[item]; return P ? <P /> : <ModulePlaceholder mod={mod} item={item} />; }
    return <ModulePlaceholder mod={mod} item={item} />;
  };

  return (
    <div className="spd-shell spd-fade-in">
      <TopNav
        mode={mode}
        onToggleMode={() => setMode(mode === "light" ? "midnight" : "light")}
        onLogoClick={onLogoClick}
        onLogoEnter={hoverOpen}
        onLogoLeave={hoverClose}
        logoLabel={logoLabel}
        logoActive={switcherOpen}
        moduleId={moduleId}
      />
      {switcherOpen && (
        <SwitcherPopover moduleId={moduleId} pinned={switcherPinned} onSwitch={goModule}
          onPin={pinSwitcher} onUnpin={unpinSwitcher} onClose={() => setSwitcherOpen(false)}
          onMouseEnter={hoverKeep} onMouseLeave={hoverClose} />
      )}
      <div className="spd-body">
        {/* Module-switcher rail at the far left (before the section nav). Always
            mounted so pin/unpin can animate the slot open/closed. */}
        <ModuleRail moduleId={moduleId} pinned={switcherPinned} onSwitch={goModule} onUnpin={unpinSwitcher} />
        {/* Single side nav = the current module's own nav (Home = the hub).
            The in-nav collapse control shrinks it to an icon rail. */}
        <ModuleNav key={moduleId} mod={mod} item={item} onSelectItem={goItem} onSwitchModule={goModule}
          rail={navRail} onToggleRail={() => setNavRail((r) => !r)} />
        <main className="spd-sheet">
          {/* keyed on module+section — a mode toggle re-themes in place, it
              never reloads content */}
          <div key={moduleId + ":" + item + ":" + (switching ? "load" : "page")} className="spd-fade-in" style={{ position: "absolute", inset: 0, display: "flex", overflow: "hidden" }}>
            {switching
              ? <div className="spd-modload"><SpiredLoader label={"Opening " + mod.name + "…"} /></div>
              : renderPage()}
          </div>
        </main>
      </div>
      {/* Mobile: one drawer with modules + current sections. */}
      <MobileNavDrawer
        moduleId={moduleId}
        item={item}
        onSwitchModule={goModule}
        onSelectItem={goItem}
        open={mobileNav}
        onClose={() => setMobileNav(false)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
