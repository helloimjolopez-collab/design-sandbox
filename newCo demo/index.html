<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spired Rebrand Concept — Amplify on Pathway architecture</title>
<!--
  SOURCES (only these):
  · Pathway repo (pathway-ds) — token architecture + naming, NavShell spec §4/§5/§11,
    Material Symbols Rounded mandate (CLAUDE.md §12), self-contained demo convention
    (components/sidenav/sidenav.html).
  · Live product (account.test1.myamplify.io/dashboard, captured 2026-07-16) — all
    page content and nav structure.
  · Spired_Brand_Guidelines.pdf — palette, Google Sans Flex, gradients, ascension motif.
  · Figma node 40006833-27620 — sheet-over-canvas layout (rounded top corners) +
    People screen content.
  · Figma node 40010650-164495 — warm-neutral surface direction: greige canvas,
    neutral text, purple reserved for accents (not Planning-Center-purple-everywhere).
  · Widget Container sandbox demo (helloimjolopez-collab.github.io/design-sandbox/
    Widget%20Container%20Demo) + Figma node 40009622-39702 — widget container
    structure and behaviour (warm header strip, hover-reveal refresh, inner
    content sheet). No charts here — production content only.

  ARCHITECTURE — why the rebrand is "mostly a token swap":
  Components below consume ONLY Pathway semantic token names (pathway-ds
  CLAUDE.md §6). Spired = new values behind those same contracts. Midnight
  Mode = a second value set behind the same names. In production: add a
  "Midnight" mode to the Figma variable collection → sync-tokens →
  Style Dictionary emits `--semantic-color-midnight-mode-*` (same shape as
  the existing 452 `--semantic-color-dark-mode-*` vars in tokens.css) and
  the app's theme switch re-points the aliases. Zero component changes.
-->
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ── PRIMITIVES — Spired brand palette (Spired_Brand_Guidelines.pdf) ──── */
    --primitive-color-purple-100: #9691F5;
    --primitive-color-purple-300: #6E64BE;
    --primitive-color-purple-600: #41377D;
    --primitive-color-purple-900: #19143C;
    --primitive-color-purple-950: #131120;  /* PROPOSED: midnight canvas — desaturated deep indigo, a starry night sky, not neon */
    --primitive-color-yellow-300: #FFC864;
    --primitive-color-orange-300: #FF8C50;
    --primitive-color-orange-500: #CF775B;
    --primitive-color-magenta-500: #9B0078;
    --primitive-color-magenta-700: #7A0569;
    --primitive-color-blue-300: #508CFF;
    --primitive-color-blue-500: #35509E;
    --primitive-color-blue-700: #27326D;
    --primitive-color-green-300: #14C382;
    --primitive-color-green-700: #166C5F;
    --primitive-color-teal-900: #18404E;
    --primitive-color-mauve-500: #714C72;
    --primitive-color-taupe-600: #6F677A;
    --primitive-color-neutral-0: #FFFFFF;
    --primitive-color-neutral-50: #F5F5F5;
    --primitive-color-neutral-100: #E6E6E6;
    --primitive-color-neutral-200: #D2D2D2;
    --primitive-color-neutral-300: #B4B4B4;
    --primitive-color-neutral-600: #5A5A5A;
    --primitive-color-neutral-900: #1E1E1E;
    /* Warm neutrals — surface family from the Widget Container sandbox demo
       and Figma 40010650-164495. Purple stays an accent; it no longer tints
       every surface. */
    --primitive-color-warm-0: #FEFEFD;
    --primitive-color-warm-100: #FBFAF8;
    --primitive-color-warm-200: #F7F5F3;
    --primitive-color-warm-250: #F3F0EC;
    --primitive-color-warm-300: #EEEBE6;
    --primitive-color-warm-400: #D4CFC8;
    --primitive-color-warm-750: #87827B;
    --primitive-color-warm-950: #292724;

    /* ── SEMANTICS · LIGHT MODE — real Pathway token names, Spired values.
       Neutrals are WARM (Figma 40010650-164495): greige surfaces, neutral
       text. Purple appears only where the brand should speak — actions,
       links, active states, the mark. ── */
    --semantic-color-light-mode-surface-canvas-light: var(--primitive-color-warm-250);
    --semantic-color-light-mode-surface-nav-light: var(--primitive-color-warm-250);
    --semantic-color-light-mode-surface-sheet-base: var(--primitive-color-warm-0); /* PROPOSED */
    --semantic-color-light-mode-surface-widget-header: var(--primitive-color-warm-100); /* PROPOSED — one whisper below the content surface */
    --semantic-color-light-mode-surface-widget-base: var(--primitive-color-warm-0); /* PROPOSED */
    --semantic-color-light-mode-fill-static-neutral-light: var(--primitive-color-warm-0);
    --semantic-color-light-mode-fill-static-neutral-subtle: var(--primitive-color-warm-250);
    --semantic-color-light-mode-fill-static-brand-base: var(--primitive-color-purple-600);
    --semantic-color-light-mode-fill-static-brand-bold: var(--primitive-color-purple-900);
    --semantic-color-light-mode-fill-static-brand-light: #F1EFFC;
    /* Four text tiers, used deliberately: primary for content, secondary for
       labels, subtle for supporting, tertiary for timestamps/captions —
       hierarchy through shade, not weight. */
    --semantic-color-light-mode-text-static-primary-base: #202020;
    --semantic-color-light-mode-text-static-secondary-base: #484848;
    --semantic-color-light-mode-text-static-secondary-subtle: #606060;
    --semantic-color-light-mode-text-static-tertiary-base: #94908A; /* PROPOSED */
    --semantic-color-light-mode-text-static-positive-base: var(--primitive-color-green-700);
    --semantic-color-light-mode-fill-static-positive-light: #EDF6F0;
    --semantic-color-light-mode-stroke-static-neutral-light: var(--primitive-color-warm-300);
    --semantic-color-light-mode-stroke-static-neutral-faint: rgba(41,39,36,0.045); /* PROPOSED — dividers whisper */
    --semantic-color-light-mode-stroke-action-secondary-inverse-base: var(--primitive-color-warm-400);
    --semantic-color-light-mode-fill-contextual-navitem-hover: rgba(41,39,36,0.035);
    /* Active nav: translucent amethyst tint (Pathway's alpha-tint recipe) —
       reads clearly against the warm sand canvas, unlike a flat pale fill. */
    --semantic-color-light-mode-fill-contextual-navitem-active: rgba(110,100,184,0.14);
    --semantic-color-light-mode-text-contextual-navitem-base: #484848;
    --semantic-color-light-mode-text-contextual-navitem-active: #202020;
    --semantic-color-light-mode-icon-contextual-navitem-oncolor: #FFFFFF; /* PROPOSED — glyph on the active module chip */
    /* Action primary = Jo's chosen value, read from the Figma node itself
       (Add Person → bg #6E64BE, full pill, white label). Links use the
       amethyst contrast (#5951A0) bound in the same screen. */
    --semantic-color-light-mode-fill-action-primary-base: #6E64BE;
    --semantic-color-light-mode-fill-action-primary-hover: #7B72C9;
    --semantic-color-light-mode-text-action-primary-base: #5951A0;
    /* Secondary action = quiet warm fill, no border (Figma Export button). */
    --semantic-color-light-mode-fill-action-secondary-base: #F7F5F3;
    --semantic-color-light-mode-fill-action-secondary-hover: #F0EDE9;
    --semantic-color-light-mode-text-action-secondary-base: #292724;
    --spd-logo-word: #19143C;
    /* Badge palette — recipe read from Figma: soft translucent tint + deep
       ink text + 11px leading dot. */
    --spd-badge-plum-bg: rgba(237,224,224,0.58);   --spd-badge-plum-fg: #5B0C49;
    --spd-badge-navy-bg: rgba(223,229,240,0.60);   --spd-badge-navy-fg: #27326D;
    --spd-badge-orchid-bg: rgba(235,224,240,0.60); --spd-badge-orchid-fg: #4C2260;
    --spd-badge-teal-bg: rgba(222,233,236,0.62);   --spd-badge-teal-fg: #193640;
    --spd-badge-amber-bg: rgba(240,231,221,0.62);  --spd-badge-amber-fg: #6B4423;
    --spd-badge-positive-bg: #E5F2ED;              --spd-badge-positive-fg: #193640; --spd-badge-positive-dot: #2F8A62;
    --spd-badge-rose-bg: rgba(240,226,231,0.62);   --spd-badge-rose-fg: #5B1F33;
    --spd-badge-role-bg: #F4F2FA; --spd-badge-role-fg: #221E3F; --spd-badge-role-stroke: #DCD9EF; --spd-badge-role-dot: #5951A0;
    /* Accent UI variants are DESATURATED versions of the brand secondaries —
       full-saturation primitives stay reserved for marketing/hero moments.
       In-product color should murmur, not shout (and never clash). */
    --semantic-color-light-mode-fill-static-accent-amethyst-base: #6E64B8; /* amethyst-90, Jo's pipeline */
    --semantic-color-light-mode-fill-static-accent-amethyst-light: #F4F2FA; /* amethyst-10 */
    --semantic-color-light-mode-fill-static-accent-jade-base: #1F9A66; /* more vibrant, still accessible */
    --semantic-color-light-mode-fill-static-accent-jade-light: #E4F3EC;
    --semantic-color-light-mode-fill-static-accent-seabreeze-base: #4A7ECB;
    --semantic-color-light-mode-fill-static-accent-seabreeze-light: #EAF0FA;

    /* PROPOSED accent families for Spired's wider secondary palette — named
       by the existing grammar so they can be added in Figma and synced.
       Tuned for a bit more vibrancy in light mode (Jo, 2026-07-21) — the flat
       bases were too pastel; contrast stays accessible via the deepened ink. */
    --semantic-color-light-mode-fill-static-accent-magenta-base: #AC3389;
    --semantic-color-light-mode-fill-static-accent-magenta-bold: #8E2E72;
    --semantic-color-light-mode-fill-static-accent-magenta-light: #F8ECF4;
    --semantic-color-light-mode-fill-static-accent-sunrise-base: #E17B34;
    --semantic-color-light-mode-fill-static-accent-sunrise-bold: #C56A2E;
    --semantic-color-light-mode-fill-static-accent-sunrise-light: #FAEEE3;
    --semantic-color-light-mode-fill-static-accent-gold-base: var(--primitive-color-yellow-300);
    --semantic-color-light-mode-fill-static-accent-teal-base: #2A7E90;
    --semantic-color-light-mode-fill-static-accent-teal-light: #E6F1F3;
    --semantic-color-light-mode-fill-static-accent-mauve-base: #8C4F92;
    --semantic-color-light-mode-fill-static-accent-taupe-base: var(--primitive-color-taupe-600);
    --semantic-color-light-mode-fill-static-accent-navy-base: #3F52AE;
    --semantic-color-light-mode-fill-static-accent-navy-bold: #35468F;

    /* Avatar — exact from the Figma table cell: muted mauve-gray tint at 74%,
       near-black initials. 28px, one shade everywhere. */
    --semantic-color-light-mode-fill-contextual-avatar-base: rgba(207,197,206,0.74);
    --semantic-color-light-mode-text-contextual-avatar-base: #1E1E1E;

    /* ── LAYOUT — Pathway contextual tokens (nav-shell-spec §4) ──────────── */
    --semantic-layout-units-contextual-card-cornerradius-cornerradius: 16px;
    --semantic-layout-units-contextual-card-border-width-base-base: 0.5px; /* true hairline (Pathway card spec) */
    --semantic-layout-units-contextual-page-padding-horizontal: 48px;
    --semantic-layout-units-contextual-page-padding-top: 44px;
    --semantic-layout-units-contextual-page-padding-bottom: 56px;
    --semantic-layout-units-contextual-sheet-cornerradius: 28px; /* PROPOSED */
    --semantic-layout-units-cornerradius-full: 999px;

    /* ── MOTION — Pathway names + values (src/tokens/tokens.css). One
       PROPOSED override: livelier spring (1.14 vs Pathway's 1.04) for
       Spired's "uplifting" personality. ─────────────────────────────────── */
    --motion-duration-1: 100ms;
    --motion-duration-2: 150ms;
    --motion-duration-3: 200ms;
    --motion-duration-4: 300ms;
    --motion-duration-5: 380ms;
    --motion-duration-6: 460ms;
    --motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --motion-easing-decelerate: cubic-bezier(0, 0, 0.2, 1);
    --motion-easing-emphasized: cubic-bezier(0.32, 0.72, 0, 1);
    --motion-easing-spring: cubic-bezier(0.34, 1.14, 0.64, 1); /* PROPOSED */
    /* PROPOSED — the everyday spring: barely-there overshoot over a longer
       arc. Elegant, never abrupt. Reserve the livelier spring for loaders. */
    --motion-easing-spring-soft: cubic-bezier(0.30, 1.05, 0.40, 1);
    /* PROPOSED — hover-lift easing: eases in GENTLY (no abrupt snap), then
       settles with a whisper of overshoot. P1 y=0 gives a soft start; P2
       y=1.18 gives the barely-there bounce. Paired with a longer duration. */
    --motion-easing-burst: cubic-bezier(0.30, 0, 0.5, 1.18);
    /* PROPOSED — sinusoidal ease for ambient/looping motion (loaders,
       shimmer). Loops should breathe, not tick. */
    --motion-easing-breath: cubic-bezier(0.37, 0, 0.63, 1);

    /* Elevation — quiet. Nothing carries shadow weight at rest beyond a
       single faint contact; the violet ambient cast appears only on
       hover/overlay, one soft layer, never stacked. Flips per mode. */
    --spd-elevation-sheet: 0 8px 32px -20px rgba(41,39,36,0.10);
    --spd-elevation-widget: 0 1px 2px rgba(41,39,36,0.03);
    --spd-elevation-lift: 0 8px 20px -10px rgba(89,81,160,0.12);
    --spd-elevation-overlay: 0 20px 48px -20px rgba(89,81,160,0.16), 0 3px 10px -6px rgba(41,39,36,0.06);
  }

  /* ── MIDNIGHT MODE ────────────────────────────────────────────────────────
     Not gray, not slate, not black: every surface is deep brand indigo, so
     the app still reads unmistakably Spired with the lights off.
     In production these values are a "Midnight" mode on the Figma variable
     collection — sync-tokens emits --semantic-color-midnight-mode-* (same
     mechanism as the 452 dark-mode vars already in tokens.css) and the theme
     switch re-points the aliases. Same names, third value set, zero
     component changes. */
  html[data-spd-mode="midnight"] {
    /* Desaturated throughout — surfaces sit around 20–30% saturation, like a
       grainy long-exposure photo of a summer night sky. Brand hue is felt,
       never loud. */
    --semantic-color-light-mode-surface-canvas-light: var(--primitive-color-purple-950);
    --semantic-color-light-mode-surface-nav-light: var(--primitive-color-purple-950);
    --semantic-color-light-mode-surface-sheet-base: #181628;
    --semantic-color-light-mode-surface-widget-header: #211E32;
    --semantic-color-light-mode-surface-widget-base: #1A1829;
    --semantic-color-light-mode-fill-static-neutral-light: #201D30;
    --semantic-color-light-mode-fill-static-neutral-subtle: rgba(170,166,200,0.08);
    --semantic-color-light-mode-fill-static-brand-light: rgba(170,166,200,0.12);
    --semantic-color-light-mode-text-static-primary-base: #ECEAF3;
    --semantic-color-light-mode-text-static-secondary-base: #B5B1C6;
    --semantic-color-light-mode-text-static-secondary-subtle: #837E96;
    --semantic-color-light-mode-text-static-tertiary-base: #6B6680;
    --semantic-color-light-mode-text-static-positive-base: #4BC495;
    --semantic-color-light-mode-fill-static-positive-light: rgba(75,196,149,0.12);
    --semantic-color-light-mode-stroke-static-neutral-light: rgba(170,166,200,0.13);
    --semantic-color-light-mode-stroke-static-neutral-faint: rgba(170,166,200,0.05);
    --semantic-color-light-mode-stroke-action-secondary-inverse-base: rgba(170,166,200,0.24);
    --semantic-color-light-mode-fill-contextual-navitem-hover: rgba(170,166,200,0.045);
    --semantic-color-light-mode-fill-contextual-navitem-active: rgba(170,166,200,0.12);
    --semantic-color-light-mode-text-contextual-navitem-base: #B5B1C6;
    --semantic-color-light-mode-text-contextual-navitem-active: #FFFFFF;
    --semantic-color-light-mode-icon-contextual-navitem-oncolor: var(--primitive-color-purple-950);
    --semantic-color-light-mode-fill-action-primary-base: #8F87DD;
    --semantic-color-light-mode-fill-action-primary-hover: #9C95E4;
    --semantic-color-light-mode-text-action-primary-base: #ABA5EC;
    --semantic-color-light-mode-fill-action-secondary-base: rgba(170,166,200,0.10);
    --semantic-color-light-mode-fill-action-secondary-hover: rgba(170,166,200,0.16);
    --semantic-color-light-mode-text-action-secondary-base: #D9D6E8;
    --spd-logo-word: #FFFFFF;
    --spd-badge-plum-bg: rgba(200,150,170,0.14);   --spd-badge-plum-fg: #DFB4CE;
    --spd-badge-navy-bg: rgba(150,165,210,0.14);   --spd-badge-navy-fg: #B6C3E6;
    --spd-badge-orchid-bg: rgba(190,155,210,0.14); --spd-badge-orchid-fg: #D3BAE0;
    --spd-badge-teal-bg: rgba(140,190,200,0.13);   --spd-badge-teal-fg: #AFD2D8;
    --spd-badge-amber-bg: rgba(215,180,140,0.13);  --spd-badge-amber-fg: #DBC2A4;
    --spd-badge-positive-bg: rgba(75,196,149,0.13); --spd-badge-positive-fg: #A9DEC6; --spd-badge-positive-dot: #4BC495;
    --spd-badge-rose-bg: rgba(210,150,170,0.13);   --spd-badge-rose-fg: #E0B7C5;
    --spd-badge-role-bg: rgba(170,166,200,0.10); --spd-badge-role-fg: #D9D5EC; --spd-badge-role-stroke: rgba(170,166,200,0.22); --spd-badge-role-dot: #ABA5EC;
    --semantic-color-light-mode-fill-static-accent-amethyst-base: #8F8AD8;
    --semantic-color-light-mode-fill-static-accent-amethyst-light: rgba(170,166,200,0.12);
    --semantic-color-light-mode-fill-static-accent-jade-base: #35B78C;
    --semantic-color-light-mode-fill-static-accent-jade-light: rgba(75,196,149,0.12);
    --semantic-color-light-mode-fill-static-accent-seabreeze-base: #7C9BE0;
    --semantic-color-light-mode-fill-static-accent-seabreeze-light: rgba(124,155,224,0.13);
    --semantic-color-light-mode-fill-static-accent-magenta-base: #C06BAB;
    --semantic-color-light-mode-fill-static-accent-magenta-bold: #D693C4;
    --semantic-color-light-mode-fill-static-accent-magenta-light: rgba(192,107,171,0.13);
    --semantic-color-light-mode-fill-static-accent-sunrise-base: #D69064;
    --semantic-color-light-mode-fill-static-accent-sunrise-light: rgba(214,154,127,0.13);
    --semantic-color-light-mode-fill-static-accent-sunrise-bold: #CE9679;
    --semantic-color-light-mode-fill-static-accent-teal-base: #6FB3BE;
    --semantic-color-light-mode-fill-static-accent-teal-light: rgba(111,179,190,0.12);
    --semantic-color-light-mode-fill-static-accent-mauve-base: #A98BA9;
    --semantic-color-light-mode-fill-static-accent-taupe-base: #918BA0;
    --semantic-color-light-mode-fill-static-accent-navy-base: #7C97D6;
    --semantic-color-light-mode-fill-static-accent-navy-bold: #849FD9;
    --semantic-color-light-mode-fill-contextual-avatar-base: rgba(207,197,206,0.18);
    --semantic-color-light-mode-text-contextual-avatar-base: #E6E1E8;

    --spd-elevation-sheet: 0 8px 36px -18px rgba(0,0,0,0.40);
    --spd-elevation-widget: 0 1px 2px rgba(0,0,0,0.15);
    --spd-elevation-lift: 0 8px 20px -10px rgba(0,0,0,0.32);
    --spd-elevation-overlay: 0 20px 48px -16px rgba(0,0,0,0.50);
  }
  html[data-spd-mode="midnight"] .spd-topnav { border-bottom-color: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] .spd-topnav__org { background: rgba(170,166,200,0.07); border-color: rgba(170,166,200,0.13); }
  html[data-spd-mode="midnight"] .spd-topnav__org:hover { background: rgba(170,166,200,0.11); }
  html[data-spd-mode="midnight"] .spd-topnav__iconbtn:hover { background: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] .spd-modnav__search { background: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] .spd-skeleton { background: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] *:hover::-webkit-scrollbar-thumb { background: rgba(170,166,200,0.26); }

  html, body, #root {
    height: 100%;
    background: var(--semantic-color-light-mode-surface-canvas-light);
    font-family: 'Google Sans Flex', ui-sans-serif, system-ui, sans-serif;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    transition: background var(--motion-duration-5) var(--motion-easing-standard),
                color var(--motion-duration-5) var(--motion-easing-standard);
  }

  /* Scrollbars: 3px whisper on BOTH axes (an unstyled horizontal bar is a
     15px plank), thumb only appears on hover. */
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  *:hover::-webkit-scrollbar-thumb { background: rgba(41,39,36,0.16); }

  /* Material Symbols Rounded per pathway-ds CLAUDE.md §12: wght 400, GRAD 0,
     opsz 20. Nav items FILL=1 when active (nav-shell-spec §9.2); top-nav FILL=0. */
  .material-symbols-rounded {
    font-variation-settings: 'wght' 400, 'GRAD' 0, 'opsz' 20, 'FILL' 0;
    user-select: none;
    /* Hide ligature text until the icon font is ready — no flash of raw
       icon names on slow connections. */
    visibility: hidden;
  }
  html.spd-fonts-ready .material-symbols-rounded { visibility: visible; }
  .material-symbols-rounded.is-filled {
    font-variation-settings: 'wght' 400, 'GRAD' 0, 'opsz' 20, 'FILL' 1;
  }

  /* ── Spired brand motion ──────────────────────────────────────────────── */

  /* Shimmer: a lavender-into-gray light travelling diagonally from bottom-left
     up to top-right. The band is oriented at 45° (perpendicular to its travel)

  .spd-skeleton::after {
    content: ""; position: absolute; inset: -80%;

     hangs for a breath at the top. Then the bottom drops first and pulls the
     middle down, the middle the top. Each step up the stack lifts a touch
     higher (--rise), so it reads as steps climbing: a gentle burst of
     inspiration. Subtle throughout. */
  @keyframes spd-drift {
    0%   { transform: translateY(0);                       opacity: 0.35; }
    20%  { transform: translateY(calc(var(--rise) * 1.28)); opacity: 1; }   /* bumped up past the peak */
    31%  { transform: translateY(var(--rise));             opacity: 1; }    /* settle onto the step */
    48%  { transform: translateY(var(--rise));             opacity: 1; }    /* slight suspension at the top */
    80%, 100% { transform: translateY(0);                  opacity: 0.35; } /* pulled back down, gently */

  @keyframes spd-btn-shimmer { 0% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
  .spd-btn--shimmering {

  .spd-pressmark:active .spd-pressmark__mark { transform: scale(0.94); transition-duration: var(--motion-duration-1); }

  .spd-boot {

  /* ── Shell ────────────────────────────────────────────────────────────── */

  /* SideNav: expanded 256px ↔ collapsed 84px rail. A pinned header holds the

    font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spd-tms__menu {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 60;
    width: 268px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-tms__menuhead {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base);
    padding: 8px 10px 6px;
  }
  .spd-tms__opt {
    width: 100%; display: flex; align-items: center; gap: 11px; padding: 8px 10px;
    border-radius: 11px; background: transparent; border: none; cursor: pointer;
    text-align: left; font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-tms__opt:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-tms__opt.is-current { background: var(--semantic-color-light-mode-fill-contextual-navitem-active); }
  .spd-tms__tag {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 6px; margin-left: 8px;
    background: color-mix(in srgb, var(--semantic-color-light-mode-fill-static-accent-amethyst-base) 14%, transparent);
    color: var(--semantic-color-light-mode-fill-static-accent-amethyst-base);
  }

  /* Logo active (switcher popover open, or pinned rail shown) */
  .spd-topnav__logo.is-active { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-action-primary-base) 14%, transparent); }

  /* ── Switcher popover (opened from the logo, unpinned) ── */
  .spd-swpop {
    position: fixed; top: 56px; left: 14px; z-index: 65;
    width: 284px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-swpop__head { display: flex; align-items: center; justify-content: space-between; padding: 5px 5px 7px 10px; }
  .spd-swpop__title {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base);
  }
  .spd-swpop__pin {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 9px;
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 600; color: var(--semantic-color-light-mode-fill-action-primary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-swpop__pin:hover { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-action-primary-base) 11%, transparent); }
  .spd-swpop__pin.is-unpin { color: var(--semantic-color-light-mode-text-static-secondary-base); }
  .spd-swpop__pin.is-unpin:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-swpop__list { display: flex; flex-direction: column; gap: 1px; }

  /* ── Pinned module rail (far left). Collapsed = icon rail; hover expands it
       as an overlay to reveal labels, no layout shift. ── */
  .spd-mrail {
    position: relative; flex: 0 0 64px; width: 64px; z-index: 30;
    /* Pin/unpin (and reveal/hide) animate: the slot opens/closes and the panel
       slides in/out with it — never an instant pop. */
    transition: flex-basis var(--motion-duration-5) var(--motion-easing-emphasized),
                width var(--motion-duration-5) var(--motion-easing-emphasized);
  }
  .spd-mrail.is-collapsed { flex-basis: 0; width: 0; pointer-events: none; }
  .spd-mrail__inner {
    position: absolute; top: 0; left: 0; bottom: 0; width: 64px;
    display: flex; flex-direction: column; padding: 6px 8px 10px 0;
    background: var(--semantic-color-light-mode-surface-nav-light);
    /* A distinct surface from the section nav beside it: a divider + a slight
       right-edge elevation so the rail reads as its own raised layer. */
    border-right: 1px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: 3px 0 10px -7px rgba(41, 39, 36, 0.16);
    overflow: hidden;
    transition: width var(--motion-duration-5) var(--motion-easing-emphasized),
                box-shadow var(--motion-duration-4) var(--motion-easing-standard),
                transform var(--motion-duration-5) var(--motion-easing-emphasized),
                opacity var(--motion-duration-4) var(--motion-easing-standard);
  }
  .spd-mrail.is-collapsed .spd-mrail__inner { transform: translateX(-100%); opacity: 0; }
  html[data-spd-mode="midnight"] .spd-mrail__inner { box-shadow: 3px 0 12px -6px rgba(0, 0, 0, 0.45); }
  .spd-mrail:hover .spd-mrail__inner, .spd-mrail:focus-within .spd-mrail__inner {
    width: 214px; box-shadow: var(--spd-elevation-sheet);
  }
  .spd-mrail__scroll { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; padding-left: 8px; }
  .spd-mrail__item, .spd-mrail__unpin {
    position: relative; display: flex; align-items: center; gap: 11px; height: 44px;
    padding: 0 8px; border-radius: 11px; background: transparent; border: none;
    cursor: pointer; font-family: inherit; text-align: left; flex-shrink: 0;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-mrail__item:hover, .spd-mrail__unpin:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  /* No tile — a transparent slot that just centres the module glyph (sized to
     match the top-nav module glyph). */
  .spd-mrail__badge {
    width: 26px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
  }
  .spd-mrail__label {
    font-size: 12.5px; font-weight: 500; letter-spacing: -0.05px; white-space: nowrap;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    /* Labels fade in just after the panel begins widening, so it reads as one
       sequenced gesture rather than everything moving at once. */
    opacity: 0; transition: opacity var(--motion-duration-3) var(--motion-easing-standard) 70ms;
  }
  .spd-mrail:hover .spd-mrail__label, .spd-mrail:focus-within .spd-mrail__label { opacity: 1; }
  .spd-mrail__item.is-active { background: color-mix(in srgb, var(--sel) 9%, transparent); }
  .spd-mrail__item.is-active .spd-mrail__label { color: var(--sel); font-weight: 600; }
  /* Selection stripe = the MODULE's own colour (matches its glyph — never a
     mismatched purple), flush to the rail's left edge. The -8px breakout lands
     on the scroll's clip edge so it shows without clipping. */
  .spd-mrail__indicator {
    position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; border-radius: 0 3px 3px 0;
    background: var(--sel);
  }
  .spd-mrail__unpin { margin: 4px 0 0 8px; }
  .spd-mrail__unpin .spd-mrail__badge { color: var(--semantic-color-light-mode-text-static-tertiary-base); }
  .spd-mrail__unpin .spd-mrail__label { color: var(--semantic-color-light-mode-text-static-secondary-base); }
  @media (max-width: 768px) { .spd-mrail { display: none; } }

  .spd-topnav__brandsep {
    width: 1px; height: 22px; flex-shrink: 0;
    background: var(--semantic-color-light-mode-stroke-static-neutral-light);
  }
  .spd-topnav__orgname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .spd-topnav__hamburger { display: none; }

  /* ── Account menu — Spired-level settings/admin live here (not the side nav) */
  .spd-acct { position: relative; margin-left: 6px; }
  .spd-acct__avatar {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 11px; font-weight: 600;
    background: var(--semantic-color-light-mode-fill-contextual-avatar-base);
    color: var(--semantic-color-light-mode-text-contextual-avatar-base);
    transition: transform var(--motion-duration-3) var(--motion-easing-spring);
  }
  .spd-acct__avatar:active { transform: scale(0.94); }
  .spd-acct__avatar--lg { width: 38px; height: 38px; font-size: 13px; }
  .spd-acct__menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
    width: 256px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-acct__id { display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px; }
  .spd-acct__name { display: block; font-size: 13.5px; font-weight: 600; color: var(--semantic-color-light-mode-text-static-primary-base); }
  .spd-acct__sub { display: block; font-size: 12px; color: var(--semantic-color-light-mode-text-static-tertiary-base); margin-top: 1px; }
  .spd-acct__sep { height: 0.5px; background: var(--semantic-color-light-mode-stroke-static-neutral-light); margin: 6px 4px; }
  .spd-acct__cap {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base); padding: 4px 10px 4px;
  }

  /* Mobile drawer — modules + current sections in one sheet. */
  .spd-drawer {
    position: fixed; top: 60px; left: 0; bottom: 0; z-index: 50; width: 280px;
    display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 20px;
    overflow-y: auto; background: var(--semantic-color-light-mode-surface-nav-light);
    border-right: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    transform: translateX(-102%);
    transition: transform var(--motion-duration-6) var(--motion-easing-emphasized);
  }
  .spd-drawer.is-open { transform: translateX(0); box-shadow: 0 24px 60px -20px rgba(20,18,30,0.4); }

  /* Giving Overview stat row. */
  .spd-giving-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  /* Mobile drawer scrim (hidden until the rail opens on small screens).
     NOTE: distinct class from the dialog backdrop .spd-scrim — reusing that
     name pulled in its fade-to-opacity:1 animation and veiled the whole app. */
  .spd-navscrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(20,18,30,0.34);
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-duration-4) var(--motion-easing-standard);
  }
  .spd-navscrim.is-open { opacity: 1; pointer-events: auto; }

  /* The content sheet — rounded top corners, flush right/bottom (Figma
     40006833-27620). Depth from one luminance step + soft ambient shadow. */
  .spd-sheet {
    flex: 1; display: flex; overflow: hidden; position: relative; margin-right: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border-radius: var(--semantic-layout-units-contextual-sheet-cornerradius) var(--semantic-layout-units-contextual-sheet-cornerradius) 0 0;
    box-shadow: var(--spd-elevation-sheet);
    transition: background var(--motion-duration-5) var(--motion-easing-standard);
  }
  .spd-modload { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spd-page { flex: 1; overflow: auto; }
  .spd-page__inner {
    padding: var(--semantic-layout-units-contextual-page-padding-top)
             var(--semantic-layout-units-contextual-page-padding-horizontal)
             var(--semantic-layout-units-contextual-page-padding-bottom);
    max-width: 1060px; margin: 0 auto;
  }

  /* Responsive safety net: this is a desktop-product concept. Rather than let
     a narrow preview panel crush the sheet to a sliver, keep a sensible
     minimum and scroll horizontally below it. */
  .spd-body { min-width: 0; }
  .spd-sheet { min-width: 560px; }

  /* ── Mobile: the logo opens a drawer; side nav + switcher fold away ────── */
  @media (max-width: 768px) {
    .spd-topnav { padding: 0 14px; }
    /* Keep the bar breathable: the two least-essential globals fold away. */
    .spd-topnav [aria-label="Search"], .spd-topnav [aria-label="Help"] { display: none; }
    .spd-topnav__orgname { max-width: 150px; }

    /* Side nav + top-bar switcher give way to the drawer. */
    .spd-modnav, .spd-tms, .spd-topnav__brandsep { display: none; }

    .spd-body { padding-top: 0; }
    .spd-sheet { min-width: 0; margin-right: 0; border-radius: 0; }

    .spd-giving-stats { grid-template-columns: 1fr; }
  }

  /* ── Concept-showcase building blocks ─────────────────────────────────── */
  .spd-concept__lead {
    font-size: 14px; line-height: 1.55; color: var(--semantic-color-light-mode-text-static-secondary-base);
    max-width: 680px; margin-top: 6px;
  }
  .spd-principle {
    border-radius: var(--semantic-layout-units-contextual-card-cornerradius-cornerradius);
    background: var(--semantic-color-light-mode-fill-static-neutral-light);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    padding: 20px; display: flex; flex-direction: column; gap: 8px;
  }
  .spd-principle__icon {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: var(--semantic-color-light-mode-fill-static-accent-amethyst-light);
    color: var(--semantic-color-light-mode-text-action-primary-base); margin-bottom: 4px;
  }
  .spd-principle__title { font-size: 14px; font-weight: 600; color: var(--semantic-color-light-mode-text-static-primary-base); }
  .spd-principle__body { font-size: 12.5px; line-height: 1.5; color: var(--semantic-color-light-mode-text-static-secondary-subtle); }

  /* Do / Don't callouts */
  .spd-dodont { border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; border: 0.5px solid; }
  .spd-dodont--do { background: var(--spd-badge-positive-bg); border-color: rgba(75,150,120,0.20); }
  .spd-dodont--dont { background: var(--spd-badge-rose-bg); border-color: rgba(160,80,100,0.20); }
  .spd-dodont__h { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; }
  .spd-dodont--do .spd-dodont__h { color: var(--spd-badge-positive-fg); }
  .spd-dodont--dont .spd-dodont__h { color: var(--spd-badge-rose-fg); }
  .spd-dodont__t { font-size: 12.5px; line-height: 1.5; color: var(--semantic-color-light-mode-text-static-secondary-base); }

  /* Form fields with validation states */
  .spd-field { display: flex; flex-direction: column; gap: 6px; }
  .spd-field__label { font-size: 12.5px; font-weight: 500; color: var(--semantic-color-light-mode-text-static-secondary-base); }
  .spd-input {
    height: 40px; padding: 0 13px; border-radius: 10px; font-family: inherit; font-size: 13.5px;
    background: var(--semantic-color-light-mode-surface-widget-base, #fff);
    border: 1px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    color: var(--semantic-color-light-mode-text-static-primary-base);
    outline: none; width: 100%;
    transition: border-color var(--motion-duration-2) var(--motion-easing-standard), box-shadow var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-input::placeholder { color: var(--semantic-color-light-mode-text-static-tertiary-base); }
  .spd-input:focus { border-color: #6E64BE; box-shadow: 0 0 0 3px rgba(110,100,190,0.14); }
  .spd-input--error { border-color: #C0564E; }
  .spd-input--error:focus { border-color: #C0564E; box-shadow: 0 0 0 3px rgba(192,86,78,0.14); }
  .spd-input--success { border-color: #4FA07C; }
  .spd-field__msg { font-size: 11.5px; display: flex; align-items: center; gap: 4px; }
  .spd-field__msg--error { color: #B0473F; }
  .spd-field__msg--success { color: var(--spd-badge-positive-fg); }
  .spd-field__msg--hint { color: var(--semantic-color-light-mode-text-static-tertiary-base); }
  .spd-field__msg .material-symbols-rounded { font-size: 14px; }

  /* Alert / inline banner */
  .spd-alert { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; border: 0.5px solid; }
  .spd-alert__body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .spd-alert__title { font-size: 13px; font-weight: 600; }
  .spd-alert__text { font-size: 12.5px; line-height: 1.45; }
  .spd-alert .material-symbols-rounded { font-size: 20px; flex-shrink: 0; }
  .spd-alert--error { background: var(--spd-badge-rose-bg); border-color: rgba(176,71,63,0.22); }
  .spd-alert--error .spd-alert__title, .spd-alert--error > .material-symbols-rounded { color: #B0473F; }
  .spd-alert--error .spd-alert__text { color: var(--spd-badge-rose-fg); }
  .spd-alert--success { background: var(--spd-badge-positive-bg); border-color: rgba(75,150,120,0.22); }
  .spd-alert--success .spd-alert__title, .spd-alert--success > .material-symbols-rounded { color: var(--spd-badge-positive-fg); }
  .spd-alert--success .spd-alert__text { color: var(--spd-badge-positive-fg); }
  .spd-alert--warn { background: var(--spd-badge-amber-bg); border-color: rgba(150,110,50,0.24); }
  .spd-alert--warn .spd-alert__title, .spd-alert--warn > .material-symbols-rounded { color: var(--spd-badge-amber-fg); }
  .spd-alert--warn .spd-alert__text { color: var(--spd-badge-amber-fg); }
  .spd-alert--info { background: var(--spd-badge-navy-bg); border-color: rgba(60,80,130,0.22); }
  .spd-alert--info .spd-alert__title, .spd-alert--info > .material-symbols-rounded { color: var(--spd-badge-navy-fg); }
  .spd-alert--info .spd-alert__text { color: var(--spd-badge-navy-fg); }

  /* Toast — same gentle woop up-and-settle */
  @keyframes spd-toast-in {
    0%   { opacity: 0; transform: translateY(12px) scale(0.98); }
    70%  { opacity: 1; transform: translateY(-2.5px) scale(1.004); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .spd-toast {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px;
    background: var(--primitive-color-purple-900); color: #fff; font-size: 13px;
    box-shadow: var(--spd-elevation-overlay); animation: spd-toast-in var(--motion-duration-6) var(--motion-easing-breath) both;
  }
  html[data-spd-mode="midnight"] .spd-toast { background: #2A2740; border: 0.5px solid rgba(170,166,200,0.18); }
  .spd-toast .material-symbols-rounded { font-size: 18px; }

  /* Modal / dialog */
  .spd-scrim { position: absolute; inset: 0; background: rgba(25,20,60,0.34); display: flex; align-items: center; justify-content: center; z-index: 20; animation: spd-fade var(--motion-duration-3) var(--motion-easing-standard) both; }
  .spd-dialog {
    width: min(420px, 88%); background: var(--semantic-color-light-mode-surface-widget-base, #fff);
    border-radius: 18px; box-shadow: var(--spd-elevation-overlay); padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
    animation: spd-dialog-in var(--motion-duration-6) var(--motion-easing-breath) both;
  }
  @keyframes spd-dialog-in {
    0%   { opacity: 0; transform: translateY(14px) scale(0.965); }
    70%  { opacity: 1; transform: translateY(-3px) scale(1.006); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* IA before/after frames */
  .spd-ia-frame { border-radius: 12px; border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light); overflow: hidden; background: var(--semantic-color-light-mode-fill-static-neutral-light); }
  .spd-ia-frame__bar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .spd-ia-chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 500; }

  /* Cards: hairline stroke, no resting shadow; shadow is a hover response. */
  .spd-card {
    border-radius: var(--semantic-layout-units-contextual-card-cornerradius-cornerradius);
    background: var(--semantic-color-light-mode-fill-static-neutral-light);
    border: var(--semantic-layout-units-contextual-card-border-width-base-base) solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    transition: background var(--motion-duration-5) var(--motion-easing-standard);
  }
  .spd-card--lift {
    cursor: pointer;
    transition: transform var(--motion-duration-5) var(--motion-easing-burst),
                box-shadow var(--motion-duration-5) var(--motion-easing-standard),
                background var(--motion-duration-5) var(--motion-easing-standard);
  }
  /* Very subtle: a ~1.5px rise with a whisper of a bump, and a soft shadow. */
  .spd-card--lift:hover { transform: translateY(-1.5px); box-shadow: var(--spd-elevation-lift); }
  .spd-card__header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--semantic-color-light-mode-stroke-static-neutral-faint);
    font-size: 15px; font-weight: 600;
  }

  /* Buttons never go heavier than medium — weight shouts, and Spired doesn't. */
  .spd-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px;
    border-radius: var(--semantic-layout-units-cornerradius-full);
    font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.2;
    white-space: nowrap; flex-shrink: 0; cursor: pointer;

  .spd-btn--ghost {

  .spd-btn--ghost:hover { background: var(--semantic-color-light-mode-fill-action-secondary-hover); }

const LOGO_MARK_PATHS = [

const MONO_OPS = [1, 0.7, 0.45];

/* `solid` = a flat single-colour mark (all bars full opacity) — used on dark
   tiles where the tiered white opacities would look muddy. */
function SpiredMark({ size = 22, withWordmark = false, mono, solid = false }) {
  const w = withWordmark ? size * (705.2 / 189.9) : size * (135.3 / 121.2);
  return (
    <svg width={w} height={size} viewBox={withWordmark ? LOGO_VB : MARK_VB} fill="none" aria-hidden="true" style={{ display: "block" }}>
      {LOGO_MARK_PATHS.map((p, i) => (
        <path key={i} d={p.d} fill={mono || p.fill} fillOpacity={mono && !solid ? MONO_OPS[i] : 1} />
      ))}
      {withWordmark && LOGO_WORD_PATHS.map((d, i) => (
        <path key={"w" + i} d={d} fill={mono || "var(--spd-logo-word)"} />
      ))}
    </svg>
  );
}

/* The top-left logo — three bars that replay their assembling motion on hover
   (bottom→top, the loading bump), not a scale. Bars are individual <g>s so CSS
   can stagger them. */
function LogoMark({ size = 24 }) {
  const w = size * (135.3 / 121.2);
  return (
    <svg width={w} height={size} viewBox={MARK_VB} fill="none" aria-hidden="true" style={{ display: "block" }}>
      {LOGO_MARK_PATHS.map((p, i) => (
        <g key={i} className="spd-logobar"><path d={p.d} fill={p.fill} /></g>
      ))}
    </svg>
  );
}

function AscensionField({ colors, opacity = 1 }) {
  const [a, b, c] = colors;
  return (
    <svg viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"
      style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity }}>
      <polygon points="0,300 400,300 400,230 0,300" fill={a} opacity="0.9" />
      <polygon points="0,300 400,300 400,255 0,300" fill={b} opacity="0.9" />
      <polygon points="0,300 400,300 400,278 0,300" fill={c} opacity="0.95" />
    </svg>
  );
}

   cards, modals, and on-fill. */
function SpiredLoader({ label, size = 56, mono }) {
  const w = size * (135.3 / 121.2);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>

function BootLogo() {

/* Ring loader — the mark's DNA (one long, one medium, one short pill)
   arranged in a turning ring. For buttons and tight spots. */
function RingLoader({ size = 18, mono, strokeWidth = 2.5 }) {
  const c = size / 2;
  const r = (size - strokeWidth) / 2;
  const circ = 2 * Math.PI * r;
  const segs = [
    { frac: 0.32, off: 0.0, fill: "var(--primitive-color-purple-600)", op: 1 },
    { frac: 0.19, off: 0.4, fill: "var(--primitive-color-purple-300)", op: 0.7 },
    { frac: 0.09, off: 0.68, fill: "var(--primitive-color-purple-100)", op: 0.45 },
  ];
  return (
    <svg className="spd-ring" width={size} height={size} viewBox={`0 0 ${size} ${size}`} fill="none" aria-hidden="true">

        <circle key={i} cx={c} cy={c} r={r} stroke={mono || s.fill} strokeOpacity={mono ? s.op : 1}

          strokeDasharray={`${s.frac * circ} ${circ}`} strokeDashoffset={-s.off * circ} />

  );
}

    color: "var(--semantic-color-light-mode-fill-static-accent-sunrise-bold)", nav: [

      { id: "feedback", label: "System Feedback", icon: "campaign" },

    ]},

];
const MODULE_MAP = Object.fromEntries(MODULES.map((m) => [m.id, m]));
/* Order shown in the Home launcher rail (Admin is pinned separately below). */

function firstItemOf(id) {
  const m = MODULE_MAP[id];
  return m && m.nav && m.nav.length ? m.nav[0].id : null;
}

/* Personalised app-switcher glyph — a 2×2 of rounded squares in the brand
   purples, laid out so the darkest sits bottom-left rising to the lightest
   top-right (echoing the mark's ascension). Bespoke to Spired, à la Confluence. */
function WaffleMark({ size = 24 }) {
  const d = "var(--primitive-color-purple-600)", m = "var(--primitive-color-purple-300)", l = "var(--primitive-color-purple-100)";
  const sq = (x, y, c) => <rect x={x} y={y} width="9" height="9" rx="3.6" stroke={c} strokeWidth="1.05" fill="none" />;
  return (
    <svg width={size} height={size} viewBox="0 0 22 22" fill="none" aria-hidden="true" style={{ display: "block" }}>
      {sq(1, 1, m)}
      {sq(12, 1, l)}
      {sq(1, 12, d)}
      {sq(12, 12, m)}
    </svg>
  );
}

/* Elegant custom sidebar collapse/expand glyph — a soft rounded panel with a
   left column; when railed, the column fills to show the icon-rail is active.
   Cleaner than the Material left_panel symbol. */
function SidebarToggleIcon({ collapsed, size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true" style={{ display: "block" }}>
      <rect x="3.25" y="5" width="17.5" height="14" rx="4.2" stroke="currentColor" strokeWidth="1.6" />
      {collapsed && <rect x="3.25" y="5" width="6.5" height="14" rx="4.2" fill="currentColor" fillOpacity="0.18" />}
      <line x1="9.75" y1="6.4" x2="9.75" y2="17.6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
    </svg>
  );
}

/* Persistent global rail — the ONE place navigation lives, at the left edge,
   identical on Home and inside every module. A slim vertical rail of module
   icons (Home first) with Admin pinned at the bottom. Switching a module and
   going Home are the same gesture, in the same place, every time. It's visibly
   a different surface from a module's own section nav beside it (icons-over-
   labels vs. a labelled list), so the two are never confused. */
const RAIL_TOP = ["home", "people", "giving", "accounting", "media", "safety", "concept"];

/* Home uses a deep, vibrant amethyst (from the Figma warm-nav reference) —
   NEVER the primary-action purple. Every other module uses its own colour. */
const moduleGlyphColor = (id) => (id === "home" ? "#694D94" : MODULE_MAP[id].color);
/* Module glyph INK — a high-contrast, legible version of the module colour for
   icons/glyphs (the flat brand colours are too light on-surface). Home is the
   Figma amethyst icon-contrast (#694D94); others are deepened toward the mode's
   primary text so they read in both Light and Midnight. */
const moduleInk = (id) => (id === "home"
  ? "#694D94"
  : `color-mix(in srgb, ${MODULE_MAP[id].color} 60%, var(--semantic-color-light-mode-text-static-primary-base))`);
const moduleBadgeFill = (id) => (id === "home"
  ? "var(--semantic-color-light-mode-fill-static-accent-amethyst-light)"
  : `color-mix(in srgb, ${moduleGlyphColor(id)} 17%, transparent)`);

/* The module badge + name in the top bar. This is NOT the switcher anymore —
   it's a one-click shortcut back to the CURRENT module's home (its dashboard /
   first section) for when you've navigated deep inside it. Switching modules
   happens at the Spired logo (popover) or the pinned rail. */
function ModuleBadge({ moduleId }) {
  const mod = MODULE_MAP[moduleId];
  return (
    /* NON-clickable "you are here" label (each module's own side nav has a
       Dashboard, so this needn't be a shortcut). No background tile — just the
       module glyph in its high-contrast ink, sized close to the Spired logo. */
    <div className="spd-tms__current" aria-label={"Current module: " + mod.name}>
      <span className="spd-tms__badge">
        <Icon name={mod.icon} filled size={24} style={{ color: moduleInk(mod.id) }} />
      </span>
      <span className="spd-tms__name" style={{ color: moduleInk(mod.id) }}>{mod.name}</span>
    </div>
  );
}

/* Module switcher as a POPOVER — opened from the Spired logo when the switcher
   isn't pinned. Lists every module; picking one switches. A Pin control docks
   it to the persistent left rail (see ModuleRail) for one-click access. */
function SwitcherPopover({ moduleId, pinned, onSwitch, onPin, onUnpin, onClose, onMouseEnter, onMouseLeave }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => {
      // Ignore clicks on the logo — it owns the open/close toggle itself.
      if (e.target.closest && e.target.closest("[data-sw-logo]")) return;
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [onClose]);
  return (
    <div className="spd-swpop spd-fade-in" ref={ref} role="menu" aria-label="Modules"
      onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      <div className="spd-swpop__head">
        <p className="spd-swpop__title">Switch module</p>
        {pinned ? (
          <button className="spd-swpop__pin is-unpin" onClick={onUnpin} title="Unpin the rail — keep the switcher as a popover">
            <Icon name="keep_off" size={14} /> Unpin rail
          </button>
        ) : (
          <button className="spd-swpop__pin" onClick={onPin} title="Pin the switcher to a rail on the left">
            <Icon name="push_pin" size={14} /> Pin to rail
          </button>
        )}
      </div>
      <div className="spd-swpop__list">
        {RAIL_TOP.map((id) => {
          const m = MODULE_MAP[id];
          const current = m.id === moduleId;
          return (
            <button key={m.id} role="menuitemradio" aria-checked={current}
              className={"spd-tms__opt" + (current ? " is-current" : "")}
              onClick={() => { onSwitch(m.id); onClose(); }}>
              <span className="spd-tms__chip">
                <Icon name={m.icon} filled={current} size={18} style={{ color: moduleInk(m.id) }} />
              </span>
              <span style={{ flex: 1 }}>{m.name}{m.demo && <span className="spd-tms__tag">Demo</span>}</span>
              {current && <Icon name="check" size={16} style={{ color: "var(--semantic-color-light-mode-fill-action-primary-base)" }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* Module switcher PINNED as a persistent icon rail at the far left, so every
   module is one click from everywhere. Collapsed it's an icon rail; hovering
   expands it (as an overlay, no layout shift) to reveal labels. Unpin returns
   it to the logo popover. */
function ModuleRail({ moduleId, pinned, onSwitch, onUnpin }) {
  return (
    <nav className={"spd-mrail" + (pinned ? "" : " is-collapsed")} aria-label="Modules" aria-hidden={!pinned}>
      <div className="spd-mrail__inner">
        <div className="spd-mrail__scroll">
          {RAIL_TOP.map((id) => {
            const m = MODULE_MAP[id];
            const active = id === moduleId;
            const c = moduleGlyphColor(id); // the module's own (now vibrant) colour
            return (
              <button key={id} className={"spd-mrail__item" + (active ? " is-active" : "")}
                onClick={() => onSwitch(id)} style={{ "--sel": c }}>
                {/* Each module keeps its OWN vibrant colour (filled glyph) so it's
                    recognisable; the active stripe + tint + label are that SAME
                    colour (never a mismatched purple). */}
                {active && <span className="spd-mrail__indicator" aria-hidden="true" />}
                <span className="spd-mrail__badge">
                  <Icon name={m.icon} filled size={20} style={{ color: c }} />
                </span>
                <span className="spd-mrail__label">{m.name}{m.demo && <span className="spd-tms__tag">Demo</span>}</span>
              </button>
            );
          })}
        </div>
        <button className="spd-mrail__unpin" onClick={onUnpin} aria-label="Unpin module rail">
          <span className="spd-mrail__badge"><Icon name="keep_off" size={19} /></span>
          <span className="spd-mrail__label">Unpin</span>
        </button>
      </div>
    </nav>
  );
}

/* Account menu — Spired-level (org/account) settings and admin live here,
   under the avatar, NOT in a side nav. Keeping them out of the rail avoids
   clashing with any module's own Settings/Admin. */
function AccountMenu({ mode, onToggleMode }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const midnight = mode === "midnight";
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [open]);
  /* PERSONAL account only — the same "this is ME" set, reachable from every
     module's top bar (profile, sign-in & security, notifications, prefs). This
     is deliberately NOT org/church admin: that (Church Account, Users, Billing,
     Integrations) lives once in Spired Home, and each module's own admin lives
     in that module — so account ≠ church-admin ≠ module-admin never conflate. */
  const personal = [
    { icon: "person", label: "My Profile" },
    { icon: "security", label: "Sign-in & Security" },
    { icon: "notifications", label: "Notifications" },
    { icon: "tune", label: "Preferences" },
  ];
  return (
    <div className="spd-acct" ref={ref}>
      <button className="spd-acct__avatar" onClick={() => setOpen((o) => !o)} aria-haspopup="menu" aria-expanded={open} aria-label="Account">
        JL
      </button>
      {open && (
        <div className="spd-acct__menu spd-fade-in" role="menu">
          <div className="spd-acct__id">
            <span className="spd-acct__avatar spd-acct__avatar--lg" aria-hidden="true">JL</span>
            <span>
              <span className="spd-acct__name">Jo Lopez</span>
              <span className="spd-acct__sub">jo.lopez@grace.church</span>
            </span>
          </div>
          <div className="spd-acct__sep" />
          <p className="spd-acct__cap">My account</p>
          {personal.map((i) => (
            <button key={i.label} className="spd-tms__opt" onClick={() => setOpen(false)}>
              <Icon name={i.icon} size={18} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)" }} />
              <span style={{ flex: 1 }}>{i.label}</span>
            </button>
          ))}
          <div className="spd-acct__sep" />
          {/* Appearance — the mode toggle lives here, not on the top bar. Stays
              open so you can see the theme flip in place. */}
          <button className="spd-tms__opt" role="menuitemcheckbox" aria-checked={midnight} onClick={onToggleMode}>
            <Icon name={midnight ? "light_mode" : "bedtime"} filled={midnight} size={18} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)" }} />
            <span style={{ flex: 1 }}>{midnight ? "Light Mode" : "Midnight Mode"}</span>
          </button>
          <div className="spd-acct__sep" />
          <button className="spd-tms__opt" onClick={() => setOpen(false)}>
            <Icon name="logout" size={18} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)" }} />
            <span style={{ flex: 1 }}>Sign out</span>
          </button>
        </div>
      )}
    </div>
  );
}

/* A single section-nav item (labelled list style) — used by the section panel
   and the mobile drawer. `leadColor` forces the icon colour (module-links show
   their module's colour even when inactive); `trailing` adds a → to signal the
   item leaves for another area. */
function SectionItem({ icon, label, color, active, onClick, leadColor }) {
  // Active: stripe + icon + label take the selected colour (`--sel`).
  // Recent module links (leadColor) are marked by an OUTLINED ring + outlined
  // module-ink glyph — distinguishable as apps, but far lighter than a fill.
  const tile = !!leadColor && !active; // Recent modules → outlined ring
  const inkFor = (c) => `color-mix(in srgb, ${c} 60%, var(--semantic-color-light-mode-text-static-primary-base))`;
  const iconColor = active ? "var(--sel)" : (leadColor ? inkFor(leadColor) : "var(--semantic-color-light-mode-text-static-secondary-base)");
  return (
    <button
      className={"spd-navitem" + (active ? " is-active" : "")}
      onClick={onClick}
      aria-current={active ? "page" : undefined}
      aria-label={label}
      title={label}
      style={active ? { "--sel": color } : undefined}
    >
      {active && <span className="spd-navitem__indicator" />}
      <span
        className={"spd-navitem__glyph" + (tile ? " spd-navitem__glyph--ring" : "")}
        style={tile ? { boxShadow: `inset 0 0 0 1px color-mix(in srgb, ${leadColor} 32%, transparent)` } : undefined}
      >
        <Icon name={icon} filled={active} size={19} style={{ color: iconColor }} />
      </span>
      <span className="spd-navitem__label">{label}</span>
    </button>
  );
}

/* The current module's own navigation — the single side nav. On Home, a
   "Modules" group provides one-click access into every module (items with
   `to`); other items navigate within the current module. */
function ModuleNav({ mod, item, onSelectItem, onSwitchModule, rail, onToggleRail }) {
  const [q, setQ] = useState("");
  if (!mod.nav || !mod.nav.length) return null;
  const query = rail ? "" : q.trim().toLowerCase(); // no filtering while railed
  // Home's selected-item accent is the deeper amethyst (never the primary purple).
  const accent = mod.id === "home" ? "#694D94" : mod.color;
  const labelOf = (n) => (n.to ? MODULE_MAP[n.to].name : n.label);
  const visible = mod.nav.filter((n) => !query || labelOf(n).toLowerCase().includes(query));
  let lastGroup = null;
  return (
    <nav className={"spd-modnav" + (rail ? " is-rail" : "")} aria-label={mod.name + " navigation"}>
      {/* Header: a filter for this area's nav + the collapse/expand control.
          (No module name/badge here — the top-nav switcher already names the
          module, so repeating it would be redundant.) */}
      <div className="spd-modnav__header">
        {!rail && (
          <div className="spd-modnav__search">
            <Icon name="search" size={19} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)", flexShrink: 0 }} />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search…" aria-label={"Search " + mod.name} />
            {q && (
              <button className="spd-modnav__search-clear" onClick={() => setQ("")} aria-label="Clear search" title="Clear">
                <Icon name="close" size={16} />
              </button>
            )}
          </div>
        )}
        <button className="spd-modnav__collapse" onClick={onToggleRail}
          aria-label={rail ? "Expand navigation" : "Collapse to rail"}
          title={rail ? "Expand navigation" : "Collapse to rail"}>
          <SidebarToggleIcon collapsed={rail} size={17} />
        </button>
      </div>
      <div className="spd-modnav__list spd-stagger">
        {visible.map((n) => {
          const showGroup = n.group && n.group !== lastGroup;
          lastGroup = n.group || lastGroup;
          const target = n.to ? MODULE_MAP[n.to] : null;
          return (
            <React.Fragment key={n.id}>
              {showGroup && <p className="spd-modnav__group">{n.group}</p>}
              {target ? (
                <SectionItem
                  icon={target.icon} label={target.name} color={target.color}
                  leadColor={target.color} active={false}
                  onClick={() => onSwitchModule(n.to)}
                />
              ) : (
                <SectionItem
                  icon={n.icon} label={n.label} color={accent}
                  active={item === n.id} onClick={() => onSelectItem(n.id)}
                />
              )}
            </React.Fragment>
          );
        })}
        {visible.length === 0 && <p className="spd-modnav__empty">No matches</p>}
      </div>
      {/* Account settings pinned to the bottom — always visible; the list
          above scrolls behind it. */}
      {mod.footerNav && mod.footerNav.length > 0 && (
        <div className="spd-modnav__foot">
          <p className="spd-modnav__group spd-modnav__foot-label">Admin settings</p>
          {mod.footerNav.map((n) => (
            <SectionItem key={n.id} icon={n.icon} label={n.label} color={accent}
              active={item === n.id} onClick={() => onSelectItem(n.id)} />
          ))}
        </div>
      )}
    </nav>
  );
}

/* Mobile: one drawer holds everything — the module list (how you switch /
   go Home) then, when inside a module, that module's own sections. Same
   information as the desktop rail + panel, stacked into a single sheet. */
function MobileNavDrawer({ moduleId, item, onSwitchModule, onSelectItem, open, onClose }) {
  const mod = MODULE_MAP[moduleId];
  return (
    <React.Fragment>
      <div className={"spd-navscrim" + (open ? " is-open" : "")} onClick={onClose} aria-hidden="true" />
      <nav className={"spd-drawer" + (open ? " is-open" : "")} aria-label="Navigation">
        <div className="spd-modnav__list spd-stagger">
          <p className="spd-sidenav__section-label">Modules</p>
          {RAIL_TOP.map((id) => {
            const m = MODULE_MAP[id];
            return <SectionItem key={id} icon={m.icon} label={m.name} color={m.color} active={id === moduleId} onClick={() => onSwitchModule(id)} />;
          })}
        </div>
        {mod.nav && mod.nav.filter((n) => !n.to).length > 0 && (
          <div className="spd-modnav__list spd-stagger" style={{ marginTop: 8 }}>
            <p className="spd-sidenav__section-label">{mod.name}</p>
            {/* skip module-link items — the Modules list above already covers them */}
            {mod.nav.filter((n) => !n.to).map((n) => (
              <SectionItem key={n.id} icon={n.icon} label={n.label} color={mod.color} active={item === n.id} onClick={() => onSelectItem(n.id)} />
            ))}
          </div>
        )}
      </nav>
    </React.Fragment>
  );
}

function HomePage() {

/* A primary action in its loading state: the mono mark assembles bottom-to-top
   inside the button while the label narrates. */
function LoadingButtonDemo() {
  const [state, setState] = useState("idle");
  const click = () => {
    if (state !== "idle") return;
    setState("loading");
    setTimeout(() => {
      setState("done");
      setTimeout(() => setState("idle"), 1600);
    }, 2800);
  };
  return (
    <button className="spd-btn spd-btn--primary" onClick={click} style={{ minWidth: 160, justifyContent: "center", opacity: state === "loading" ? 0.92 : 1 }}>
      {state === "loading" ? (
        <React.Fragment><RingLoader size={16} mono="#FFFFFF" strokeWidth={2.2} /> Adding…</React.Fragment>
      ) : state === "done" ? (
        <React.Fragment><Icon name="check" size={17} /> Added</React.Fragment>
      ) : (
        <React.Fragment><Icon name="add" size={17} /> Add Person</React.Fragment>
      )}
    </button>
  );
}

/* ═══ Validation States ═══
   A reusable validated-form engine following the industry-standard error
   pattern (GOV.UK error-summary + WCAG 3.3.1/3.3.3): validate on submit,
   show an error SUMMARY panel that lists every problem as a link to its
   field, mark each field inline (border + icon + message + aria-invalid),
   move focus to the summary or first bad field, and re-validate live once
   the user starts fixing. Two example forms below configure it differently. */
function ValidatedForm({ icon, fields, submitLabel, successTitle, successText, summaryPosition, scrollTo }) {
  const initial = {};
  fields.forEach((f) => { initial[f.key] = f.type === "checkbox" ? false : ""; });
  const [values, setValues] = useState(initial);
  const [submitted, setSubmitted] = useState(false);
  const [done, setDone] = useState(false);
  const summaryRef = React.useRef(null);
  const refs = {};
  fields.forEach((f) => { refs[f.key] = React.useRef(null); });

  const computeErrors = (vals) => {
    const e = {};
    fields.forEach((f) => {
      const v = vals[f.key];
      if (f.type === "checkbox") { if (f.required && !v) e[f.key] = f.errorMsg || ("Please confirm " + f.label.toLowerCase() + "."); return; }
      const s = (v || "").trim();
      if (f.required && !s) { e[f.key] = f.emptyMsg || ((f.type === "select" ? "Choose " : "Enter ") + f.label.toLowerCase() + "."); return; }
      if (!s) return;
      if (f.type === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)) e[f.key] = "Enter a valid email, like name@church.org.";
      else if (f.type === "tel" && !/^[0-9()+\-\s]{7,}$/.test(s)) e[f.key] = "Use digits, spaces and + ( ) - only.";
      else if (f.type === "amount" && !/^\d+(\.\d{1,2})?$/.test(s.replace(/[$,\s]/g, ""))) e[f.key] = "Enter an amount like 250 or 250.00.";
      else if (f.validate) { const m = f.validate(s, vals); if (m) e[f.key] = m; }
    });
    return e;
  };
  const errors = computeErrors(values);
  const errorKeys = fields.filter((f) => errors[f.key]).map((f) => f.key);

  const submit = () => {
    setSubmitted(true);
    if (errorKeys.length === 0) { setDone(true); return; }
    setDone(false);
    setTimeout(() => {
      if (scrollTo === "firstError" && refs[errorKeys[0]].current) {
        const el = refs[errorKeys[0]].current;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      } else if (summaryRef.current) {
        summaryRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        try { summaryRef.current.focus({ preventScroll: true }); } catch (e) { summaryRef.current.focus(); }
      }
    }, 40);
  };
  const reset = () => { setValues(initial); setSubmitted(false); setDone(false); };
  const showErr = (k) => submitted && errors[k];
  const showOk = (k) => { if (!submitted || errors[k]) return false; const f = fields.find((x) => x.key === k); return f.type === "checkbox" ? values[k] : (values[k] || "").trim(); };

  const summary = (
    <div ref={summaryRef} tabIndex={-1} role="alert" className="spd-alert spd-alert--error spd-fade-in" style={{ outline: "none", scrollMarginTop: 16 }}>
      <Icon name="error" size={20} filled />
      <div className="spd-alert__body">
        <p className="spd-alert__title">Please complete or correct the highlighted {errorKeys.length === 1 ? "field" : errorKeys.length + " fields"}</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 3, marginTop: 4 }}>
          {errorKeys.map((k) => (
            <button key={k} onClick={() => { const el = refs[k].current; if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.focus(); } }}
              style={{ background: "none", border: "none", padding: 0, textAlign: "left", cursor: "pointer", fontFamily: "inherit", fontSize: 12.5, color: "#B0473F", textDecoration: "underline", textUnderlineOffset: 2 }}>
              {errors[k]}
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  const renderField = (f) => {
    const err = showErr(f.key), ok = showOk(f.key);
    const cls = "spd-input" + (err ? " spd-input--error" : ok ? " spd-input--success" : "");
    const msgId = "msg-" + f.key;
    const common = { id: "vf-" + f.key, ref: refs[f.key], "aria-invalid": err ? "true" : "false", "aria-describedby": (err || ok || f.hint) ? msgId : undefined };
    if (f.type === "checkbox") {
      return (
        <div key={f.key} className="spd-field" style={{ gridColumn: "1 / -1" }}>
          <label style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
            <input type="checkbox" ref={refs[f.key]} checked={values[f.key]} onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.checked }))}
              aria-invalid={err ? "true" : "false"}
              style={{ width: 17, height: 17, marginTop: 1, accentColor: "#6E64BE", flexShrink: 0, outline: err ? "2px solid #C0564E" : "none", outlineOffset: 1, borderRadius: 4 }} />
            <span style={{ fontSize: 13, color: "var(--semantic-color-light-mode-text-static-secondary-base)", lineHeight: 1.4 }}>{f.label}</span>
          </label>
          {err && <span id={msgId} className="spd-field__msg spd-field__msg--error" style={{ marginLeft: 27 }}><Icon name="error" size={14} filled /> {errors[f.key]}</span>}
        </div>
      );
    }
    return (
      <div key={f.key} className="spd-field" style={f.full ? { gridColumn: "1 / -1" } : undefined}>
        <label className="spd-field__label" htmlFor={"vf-" + f.key}>{f.label}{!f.required && <span style={{ color: "var(--semantic-color-light-mode-text-static-tertiary-base)", fontWeight: 400 }}> · optional</span>}</label>
        {f.type === "select" ? (
          <select {...common} className={cls} value={values[f.key]} onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.value }))} style={{ appearance: "none", backgroundImage: "url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B85A8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>\")", backgroundRepeat: "no-repeat", backgroundPosition: "right 12px center", backgroundSize: 16, paddingRight: 34, color: values[f.key] ? "var(--semantic-color-light-mode-text-static-primary-base)" : "var(--semantic-color-light-mode-text-static-tertiary-base)" }}>
            <option value="">{f.placeholder || "Select…"}</option>
            {f.options.map((o) => <option key={o} value={o} style={{ color: "#202020" }}>{o}</option>)}
          </select>
        ) : (
          <input {...common} type={f.type === "amount" ? "text" : f.type} inputMode={f.type === "amount" ? "decimal" : undefined}
            className={cls} value={values[f.key]} placeholder={f.placeholder}
            onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.value }))} />
        )}
        {err ? <span id={msgId} className="spd-field__msg spd-field__msg--error"><Icon name="error" size={14} filled /> {errors[f.key]}</span>
          : ok ? <span id={msgId} className="spd-field__msg spd-field__msg--success"><Icon name="check_circle" size={14} filled /> Looks good</span>
          : f.hint ? <span id={msgId} className="spd-field__msg spd-field__msg--hint">{f.hint}</span> : null}
      </div>
    );
  };

  return (
    <div className="spd-card" style={{ padding: 24, display: "flex", flexDirection: "column", gap: 16, scrollMarginTop: 12 }}>
      {done ? (
        <div className="spd-alert spd-alert--success spd-fade-in">
          <Icon name="check_circle" size={20} filled />
          <div className="spd-alert__body">
            <p className="spd-alert__title">{successTitle}</p>
            <p className="spd-alert__text">{typeof successText === "function" ? successText(values) : successText}</p>
          </div>
        </div>
      ) : (submitted && errorKeys.length > 0 && summaryPosition === "top") ? summary : null}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16 }}>
        {fields.map(renderField)}
      </div>

      {(submitted && errorKeys.length > 0 && summaryPosition === "bottom") ? summary : null}

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
        <button className="spd-btn spd-btn--primary" onClick={submit}><Icon name={icon} size={17} /> {submitLabel}</button>
        {(submitted || done) && <button className="spd-btn spd-btn--ghost" onClick={reset}>Reset</button>}
      </div>
    </div>
  );
}

            <span className="spd-field__label">Error</span>
            <input className="spd-input spd-input--error" defaultValue="not-an-email" readOnly />
            <span className="spd-field__msg spd-field__msg--error"><Icon name="error" size={14} filled /> Enter a valid email.</span>
          </div>
          <div className="spd-field">
            <span className="spd-field__label">Success</span>
            <input className="spd-input spd-input--success" defaultValue="marcus@grace.church" readOnly />
            <span className="spd-field__msg spd-field__msg--success"><Icon name="check_circle" size={14} filled /> Looks good</span>
          </div>
        </div>

        <ShowcaseLabel>Example 1 — Add a person · summary at top, scrolls to summary</ShowcaseLabel>
        <p style={{ fontSize: 12.5, color: "var(--semantic-color-light-mode-text-static-tertiary-base)", margin: "0 0 12px", lineHeight: 1.5 }}>
          The GOV.UK / WCAG standard for longer forms: a summary panel appears at the top listing every problem as a link, each field is marked inline, and focus moves to the summary. Fixing a field clears it live.
        </p>
        <ValidatedForm icon="person_add" fields={personFields} submitLabel="Add person" summaryPosition="top" scrollTo="summary"
          successTitle="Person added" successText={(v) => (v.firstName + " " + v.lastName).trim() + " was added to your directory."} />

        <ShowcaseLabel>Example 2 — Record a gift · summary at bottom, scrolls to first field</ShowcaseLabel>
        <p style={{ fontSize: 12.5, color: "var(--semantic-color-light-mode-text-static-tertiary-base)", margin: "0 0 12px", lineHeight: 1.5 }}>
          A shorter, denser form near its action: the summary sits by the button, and submit takes you straight to the first field that needs attention. Shows amount, date, select and a required consent checkbox.
        </p>
        <ValidatedForm icon="savings" fields={giftFields} submitLabel="Record gift" summaryPosition="bottom" scrollTo="firstError"
          successTitle="Gift recorded" successText={(v) => "A $" + (v.amount || "0").replace(/[$,\s]/g, "") + " gift to " + (v.fund || "the fund") + " was recorded."} />

        <ShowcaseLabel>Do &amp; don't</ShowcaseLabel>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 16, paddingBottom: 8 }}>
          <DoDont type="do" points={["Validate on submit; then re-check live so fixed fields turn green as they go.", "Name every problem twice: inline on the field, and in a summary that links to it.", "Move focus to the summary (or first error) so keyboard and screen-reader users land on the problem."]} />
          <DoDont type="dont" points={["Don't scold on every keystroke before a field is finished.", "Don't rely on red alone — pair colour with an icon and plain words.", "Don't clear the user's input, and never say only 'invalid input'."]} />
        </div>
      </div>
    </div>
  );
}

/* ═══ Information Architecture ═══ */
function IAFrame({ label, tone, children }) {
  const bg = tone === "bad" ? "var(--spd-badge-rose-bg)" : tone === "good" ? "var(--spd-badge-positive-bg)" : "var(--semantic-color-light-mode-fill-static-neutral-subtle)";
  const fg = tone === "bad" ? "#B0473F" : tone === "good" ? "var(--spd-badge-positive-fg)" : "var(--semantic-color-light-mode-text-static-tertiary-base)";
  return (
    <div className="spd-ia-frame">
      <div className="spd-ia-frame__bar" style={{ background: bg, color: fg }}>
        <Icon name={tone === "bad" ? "close" : tone === "good" ? "check" : "circle"} size={14} /> {label}

      <div style={{ padding: 14 }}>{children}</div>
    </div>

}
