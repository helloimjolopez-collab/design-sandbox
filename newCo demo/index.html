  .spd-alert--info { background: var(--spd-badge-navy-bg); border-color: rgba(60,80,130,0.22); }
  .spd-alert--info .spd-alert__title, .spd-alert--info > .material-symbols-rounded { color: var(--spd-badge-navy-fg); }
  .spd-alert--info .spd-alert__text { color: var(--spd-badge-navy-fg); }

  /* Toast, same gentle woop up-and-settle */
  @keyframes spd-toast-in {
    0%   { opacity: 0; transform: translateY(12px) scale(0.98); }
    70%  { opacity: 1; transform: translateY(-2.5px) scale(1.004); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .spd-toast {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px;
    background: var(--primitive-color-purple-900); color: #fff; font-size: 13px;
    box-shadow: var(--spd-elevation-overlay); animation: spd-toast-in var(--motion-duration-6) var(--motion-easing-breath) both;
  }
  html[data-spd-mode="midnight"] .spd-toast { background: #2A2740; border: 0.5px solid rgba(170,166,200,0.18); }
  .spd-toast .material-symbols-rounded { font-size: 18px; }

  /* Modal / dialog */
  .spd-scrim { position: absolute; inset: 0; background: rgba(25,20,60,0.34); display: flex; align-items: center; justify-content: center; z-index: 20; animation: spd-fade var(--motion-duration-3) var(--motion-easing-standard) both; }
  .spd-dialog {
    width: min(420px, 88%); background: var(--semantic-color-light-mode-surface-widget-base, #fff);
    border-radius: 18px; box-shadow: var(--spd-elevation-overlay); padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
    animation: spd-dialog-in var(--motion-duration-6) var(--motion-easing-breath) both;
  }
  @keyframes spd-dialog-in {
    0%   { opacity: 0; transform: translateY(14px) scale(0.965); }
    70%  { opacity: 1; transform: translateY(-3px) scale(1.006); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* IA before/after frames */
  .spd-ia-frame { border-radius: 12px; border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light); overflow: hidden; background: var(--semantic-color-light-mode-fill-static-neutral-light); }
  .spd-ia-frame__bar { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
  .spd-ia-chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 500; }

  /* Cards: hairline stroke, no resting shadow; shadow is a hover response. */
  .spd-card {
    border-radius: var(--semantic-layout-units-contextual-card-cornerradius-cornerradius);
    background: var(--semantic-color-light-mode-fill-static-neutral-light);
    border: var(--semantic-layout-units-contextual-card-border-width-base-base) solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    transition: background var(--motion-duration-5) var(--motion-easing-standard);
  }
  .spd-card--lift {
    cursor: pointer;
    transition: transform var(--motion-duration-5) var(--motion-easing-spring),
                box-shadow var(--motion-duration-5) var(--motion-easing-standard),
                background var(--motion-duration-5) var(--motion-easing-standard);
  }
  /* Very subtle: a ~1.5px rise with a whisper of a bump, and a soft shadow. */
  .spd-card--lift:hover { transform: translateY(-1.5px); box-shadow: var(--spd-elevation-lift); }
  .spd-card__header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--semantic-color-light-mode-stroke-static-neutral-faint);
    font-size: 15px; font-weight: 600;
  }

  /* Buttons never go heavier than medium, weight shouts, and Spired doesn't. */
  .spd-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 18px;
    border-radius: var(--semantic-layout-units-cornerradius-full);
    font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.2;
    white-space: nowrap; flex-shrink: 0; cursor: pointer;
    transition: transform var(--motion-duration-5) var(--motion-easing-spring),
                background var(--motion-duration-3) var(--motion-easing-standard);
  }
  .spd-btn .material-symbols-rounded { font-size: 18px; }
  /* Optical balance: a leading icon's glyph box carries left whitespace that makes
     the left padding look bigger than the right, pull it in a touch. */
  .spd-btn > .material-symbols-rounded:first-child { margin-left: -3px; }
  .spd-btn > .material-symbols-rounded:last-child { margin-right: -3px; }
  .spd-btn--primary {
    background: var(--semantic-color-light-mode-fill-action-primary-base);
    border: none; color: var(--semantic-color-light-mode-fill-static-neutral-light);
  }
  /* Gentle burst up on hover, rises past ~-3px then settles at -2.5, like the loader's bump */
  .spd-btn--primary:hover { background: var(--semantic-color-light-mode-fill-action-primary-hover); transform: translateY(-2.5px); }
  .spd-btn--outline {
    background: transparent;
    border: 0.5px solid var(--semantic-color-light-mode-fill-static-accent-amethyst-base);
    color: var(--semantic-color-light-mode-text-action-primary-base);
  }
  /* Primary-outline hover = a brand-purple tint (NOT the neutral row/nav fill). */
  .spd-btn--outline:hover { background: var(--semantic-color-light-mode-fill-static-brand-light); }
  /* Secondary action per Figma: quiet warm fill, borderless. */
  .spd-btn--ghost {
    background: var(--semantic-color-light-mode-fill-action-secondary-base);
    border: none;
    color: var(--semantic-color-light-mode-text-action-secondary-base);
  }
  /* Its own clearly-noticeable warm step (a fill button darkening on hover),      NOT the barely-there neutral used for table rows / nav items. */
  .spd-btn--ghost:hover { background: var(--semantic-color-light-mode-fill-action-secondary-hover); }
  /* Gradient fill, a whisper of the brand gradient for quiet-but-special
     actions: pale lavender wash, purple text, hairline stroke. */
  .spd-btn--gradient {
    background: linear-gradient(105deg, #F3F1FB 0%, #E9E6F7 100%);
    border: 0.5px solid rgba(110,100,190,0.26);
    color: var(--semantic-color-light-mode-text-action-primary-base);
  }
  .spd-btn--gradient:hover { transform: translateY(-1px); border-color: rgba(110,100,190,0.38); }
  html[data-spd-mode="midnight"] .spd-btn--gradient {
    background: linear-gradient(105deg, rgba(170,166,200,0.10) 0%, rgba(170,166,200,0.16) 100%);
    border-color: rgba(170,166,200,0.28);
  }

  /* ── Ask Spot, the AI-assistant CTA on Spired Home. The first action you meet
        on landing: a rounded prompt bar with a gradient spark badge and a send
        affordance. Placeholder (no real AI), it just invites. ─────────────── */
  /* Ask Spot Halo: the two scalloped rings slowly counter-rotate (an elegant,
     alive shimmer — never a fast loader spin). On hover the whole mark does a
     delightful bouncy roll + pop. */
  /* The rings drift VERY slowly (barely a spin) + a soft breath; the colour/centre
     cycling (React) is the star, so it reads as a shape/colour animation, not a
     spinner. */
  .spd-spotmark { transform-box: fill-box; transform-origin: center; animation: spd-spot-breath 5s var(--motion-easing-breath) infinite; }
  .spd-spotmark__ring1 { transform-box: fill-box; transform-origin: center; animation: spd-halo-cw 30s linear infinite; }
  .spd-spotmark__ring2 { transform-box: fill-box; transform-origin: center; animation: spd-halo-ccw 24s linear infinite; }
  @keyframes spd-halo-cw { to { transform: rotate(360deg); } }
  @keyframes spd-halo-ccw { to { transform: rotate(-360deg); } }
  @keyframes spd-spot-breath { 0%,100% { transform: scale(0.965); } 50% { transform: scale(1); } }
  /* Hover = a clean spring BLOOM: a uniform pop + a quarter-turn that settles
     (no squash-stretch, which read as a glitch). Composes with the rings' drift. */
  .spd-askspot:hover .spd-spotmark { animation: spd-spot-hover 0.9s var(--motion-easing-spring); }
  @keyframes spd-spot-hover {
    0% { transform: scale(1) rotate(0deg); }
    45% { transform: scale(1.2) rotate(30deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .spd-spotmark, .spd-spotmark__ring1, .spd-spotmark__ring2, .spd-askspot:hover .spd-spotmark { animation: none; } }

  /* Ask Spot CTA, a LIGHT prompt bar (its own raised paper surface) whose
     primary-coloured send button is the visible primary action that pops. */
  .spd-askspot {
    display: flex; align-items: center; gap: 13px; width: 100%; max-width: 640px;
    margin: 0 auto 22px; padding: 7px 7px 7px 12px; height: 64px;
    border-radius: 999px; border: none; cursor: pointer; text-align: left; font-family: inherit;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(60,48,110,0.06), 0 6px 20px -10px rgba(60,48,110,0.22),

const { useState, useEffect, useRef } = React;

/* ═══ The ACTUAL Spired logo, geometry lifted verbatim from

const LOGO_MARK_PATHS = [

const LOGO_WORD_PATHS = [

const MARK_VB = "159.4 184.1 135.3 121.2";
const LOGO_VB = "159.4 155.5 705.2 189.9";
const MONO_OPS = [1, 0.7, 0.45];

/* `solid` = a flat single-colour mark (all bars full opacity), used on dark
   tiles where the tiered white opacities would look muddy. */
function SpiredMark({ size = 22, withWordmark = false, mono, solid = false }) {
  const w = withWordmark ? size * (705.2 / 189.9) : size * (135.3 / 121.2);
  return (
    <svg width={w} height={size} viewBox={withWordmark ? LOGO_VB : MARK_VB} fill="none" aria-hidden="true" style={{ display: "block" }}>
      {LOGO_MARK_PATHS.map((p, i) => (
        <path key={i} d={p.d} fill={mono || p.fill} fillOpacity={mono && !solid ? MONO_OPS[i] : 1} />
      ))}
      {withWordmark && LOGO_WORD_PATHS.map((d, i) => (
        <path key={"w" + i} d={d} fill={mono || "var(--spd-logo-word)"} />
      ))}
    </svg>
  );
}

/* The top-left logo, three bars that replay their assembling motion on hover
   (bottom→top, the loading bump), not a scale. Bars are individual <g>s so CSS
   can stagger them. */
function LogoMark({ size = 24 }) {
  const w = size * (135.3 / 121.2);
  return (
    <svg width={w} height={size} viewBox={MARK_VB} fill="none" aria-hidden="true" style={{ display: "block" }}>
      {LOGO_MARK_PATHS.map((p, i) => (
        <g key={i} className="spd-logobar"><path d={p.d} fill={p.fill} /></g>
      ))}
    </svg>
  );
}

function AscensionField({ colors, opacity = 1 }) {
  const [a, b, c] = colors;
  return (
    <svg viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"
      style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity }}>
      <polygon points="0,300 400,300 400,230 0,300" fill={a} opacity="0.9" />
      <polygon points="0,300 400,300 400,255 0,300" fill={b} opacity="0.9" />
      <polygon points="0,300 400,300 400,278 0,300" fill={c} opacity="0.95" />
    </svg>
  );
}

/* The loader is the REAL mark sitting solid, with a soft light sweeping up
   through it (bottom-left → top-right, the brand's ascension) over a gentle
   breath. Full colour = page-level loads; `mono` (grayscale) inside widgets,
   cards, modals, and on-fill. */
function SpiredLoader({ label, size = 56, mono, gap = 12 }) {
  const w = size * (135.3 / 121.2);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: gap }}>
      <svg className="spd-markloader__base" width={w} height={size} viewBox={MARK_VB} fill="none" aria-hidden="true">

            <path d={p.d} fill={mono || p.fill} fillOpacity={mono ? MONO_OPS[i] : 1} />

        ))}

      {label && <span style={{ fontSize: 13, fontWeight: 500, color: "var(--semantic-color-light-mode-text-static-secondary-base)" }}>{label}</span>}
    </div>

}

/* Boot logo, a one-off, only for the full-app load. Not a "loading" spinner:
   a little story. The three strokes of the mark rise and stack bottom-to-top
   with the brand's gentle woop, then the wordmark whispers in beside them,    the spark becoming Spired, and the settled logo breathes softly. Small and
   quiet by design. */
function BootLogo() {
  const height = 32;
  const w = height * (705.2 / 189.9);
  return (
    <svg width={w} height={height} viewBox={LOGO_VB} fill="none" aria-hidden="true" className="spd-boot__svg">

        <g key={i} className="spd-boot-bar" style={{ animationDelay: (i * 0.2) + "s" }}>
          <path d={p.d} fill={p.fill} />

      ))}
      <g className="spd-boot-word">
        {LOGO_WORD_PATHS.map((d, i) => <path key={i} d={d} fill="var(--spd-logo-word)" />)}
      </g>
    </svg>
  );
}

/* Ring loader, the mark's DNA (one long, one medium, one short pill)
   arranged in a turning ring. For buttons and tight spots. */
function RingLoader({ size = 18, mono, strokeWidth = 2.5 }) {
  const c = size / 2;
  const r = (size - strokeWidth) / 2;
  const circ = 2 * Math.PI * r;
  const segs = [
    { frac: 0.32, off: 0.0, fill: "var(--primitive-color-purple-600)", op: 1 },
    { frac: 0.19, off: 0.4, fill: "var(--primitive-color-purple-300)", op: 0.7 },
    { frac: 0.09, off: 0.68, fill: "var(--primitive-color-purple-100)", op: 0.45 },
  ];
  return (
    <svg className="spd-ring" width={size} height={size} viewBox={`0 0 ${size} ${size}`} fill="none" aria-hidden="true">
      {segs.map((s, i) => (
        <circle key={i} cx={c} cy={c} r={r} stroke={mono || s.fill} strokeOpacity={mono ? s.op : 1}
          strokeWidth={strokeWidth} strokeLinecap="round" fill="none"
          strokeDasharray={`${s.frac * circ} ${circ}`} strokeDashoffset={-s.off * circ} />
      ))}
    </svg>
  );
}

/* The logo as a pressable: settles slightly while held, eases back on

/* Ask Spot AI mark = the Halo, as a FILLED composition (Jo's direction): a large
   gradient scalloped shape, a LIGHTER scalloped shape on top, and a vibrant centre
   that grows/shrinks. Colours stay LIGHT→vibrant (gold ↔ vibrant lilac) — never
   dark purple. Gradient stops + fills cross-fade (React state + CSS transition);
   the two scallops counter-rotate slowly + breathe; hover = a squash-stretch bloom. */
const SPOT_FRAMES = [
  { g1: "#F9C56C", g2: "#9691F5", inner: "#FDFBFF", cen: "#7B6EF0", cs: 0.62 },
  { g1: "#BCA9F2", g2: "#F9C56C", inner: "#FFFFFF", cen: "#F9C56C", cs: 0.9 },
  { g1: "#9691F5", g2: "#C9BDF7", inner: "#F5F2FF", cen: "#8E86E8", cs: 1.06 },
  { g1: "#EFB06A", g2: "#A99AEE", inner: "#FFFFFF", cen: "#9691F5", cs: 0.72 },
];
function SpotMark({ size = 30 }) {
  const [f, setF] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setF((x) => (x + 1) % SPOT_FRAMES.length), 2400);
    return () => clearInterval(id);
  }, []);
  const c = SPOT_FRAMES[f];
  const tr = "1.7s cubic-bezier(0.4,0,0.2,1)";
  return (
    <svg className="spd-spotmark" viewBox="0 0 210 210" width={size} height={size} fill="none" aria-hidden="true" style={{ display: "block" }}>
      <defs>
        <linearGradient id="spd-spotg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c.g1} style={{ transition: "stop-color " + tr }} />
          <stop offset="100%" stopColor={c.g2} style={{ transition: "stop-color " + tr }} />
        </linearGradient>
      </defs>
      <g className="spd-spotmark__ring1"><path d={HALO_OUTER} fill="url(#spd-spotg)" /></g>
      <g className="spd-spotmark__ring2"><path d={HALO_INNER} fill={c.inner} style={{ transition: "fill " + tr }} /></g>
      <path d={HALO_CENTER} fill={c.cen} style={{ transformBox: "fill-box", transformOrigin: "center", transform: "scale(" + c.cs + ")", transition: "transform 1.9s cubic-bezier(0.34,1.3,0.5,1), fill " + tr }} />
    </svg>
  );
}

/* Module switcher as a POPOVER, opened from the Spired logo when the switcher
   isn't pinned. Lists every module; picking one switches. A Pin control docks
   it to the persistent left rail (see ModuleRail) for one-click access. */
function SwitcherPopover({ moduleId, pinned, onSwitch, onPin, onUnpin, onClose, onMouseEnter, onMouseLeave }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => {
      // Ignore clicks on the logo, it owns the open/close toggle itself.
      if (e.target.closest && e.target.closest("[data-sw-logo]")) return;
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [onClose]);
  return (
    <div className="spd-swpop spd-fade-in" ref={ref} role="menu" aria-label="Modules"
      onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave}>
      <div className="spd-swpop__head">
        <p className="spd-swpop__title">Switch module</p>
        {pinned ? (
          <button className="spd-swpop__pin is-unpin" onClick={onUnpin} aria-label="Unpin the rail">
            <Icon name="keep_off" size={14} /> Unpin rail
          </button>
        ) : (
          <button className="spd-swpop__pin" onClick={onPin} aria-label="Pin the switcher to a rail">
            <Icon name="push_pin" size={14} /> Pin to rail
          </button>
        )}
      </div>
      <div className="spd-swpop__list">
        {RAIL_TOP.map((id) => {
          const m = MODULE_MAP[id];
          const current = m.id === moduleId;
          return (
            <button key={m.id} role="menuitemradio" aria-checked={current}
              className={"spd-tms__opt" + (current ? " is-current" : "")}
              onClick={() => { onSwitch(m.id); onClose(); }}>
              <span className="spd-tms__chip">
                <Icon name={m.icon} filled={current} size={18} style={{ color: moduleInk(m.id) }} />
              </span>
              <span style={{ flex: 1 }}>{m.name}{m.demo && <span className="spd-tms__tag">Demo</span>}</span>
              {current && <Icon name="check" size={16} style={{ color: "var(--semantic-color-light-mode-fill-action-primary-base)" }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* Module switcher PINNED as a persistent icon rail at the far left, so every
   module is one click from everywhere. Collapsed it's an icon rail; hovering
   expands it (as an overlay, no layout shift) to reveal labels. Unpin returns
   it to the logo popover. */
function ModuleRail({ moduleId, pinned, onSwitch, onUnpin }) {
  // After a selection the rail should snap back to icon-only even though the
  // cursor is still over it (CSS :hover would otherwise keep it expanded until
  // you move away). `collapsedAfterPick` suppresses the hover-expand until the
  // pointer actually leaves and returns.
  // Expand purely on pointer hover, tracked in state so a selection can force
  // it closed deterministically (CSS :hover/:focus-within couldn't).
  const [expanded, setExpanded] = useState(false);
  const pick = (id, e) => { onSwitch(id); setExpanded(false); if (e && e.currentTarget) e.currentTarget.blur(); };
  return (
    <nav className={"spd-mrail" + (pinned ? "" : " is-collapsed") + (expanded && pinned ? " is-expanded" : "")}
      aria-label="Modules" aria-hidden={!pinned}
      onMouseEnter={() => setExpanded(true)}
      onMouseLeave={() => setExpanded(false)}>
      <div className="spd-mrail__inner">
        <div className="spd-mrail__scroll">
          {RAIL_TOP.map((id) => {
            const m = MODULE_MAP[id];
            const active = id === moduleId;
            const c = moduleGlyphColor(id); // the module's own (now vibrant) colour
            return (
              <button key={id} className={"spd-mrail__item" + (active ? " is-active" : "")}
                onClick={(e) => pick(id, e)} style={{ "--sel": c }}>
                {/* Each module keeps its OWN vibrant colour (filled glyph) so it's
                    recognisable; the active stripe + tint + label are that SAME
                    colour (never a mismatched purple). */}
                {active && <span className="spd-mrail__indicator" aria-hidden="true" />}
                <span className="spd-mrail__badge">

/* A single section-nav item (labelled list style), used by the section panel
   and the mobile drawer. `leadColor` forces the icon colour (module-links show
   their module's colour even when inactive); `trailing` adds a → to signal the
   item leaves for another area. */
function SectionItem({ icon, label, color, active, onClick, leadColor }) {
  // The module/primary colour (`--sel`) drives ONLY the fill + stripe. The
  // icon + label ride the slate `--spd-navink` var so they stay slate and just
  // deepen on hover/active. Recent module links (leadColor) keep an OUTLINED
  // ring + module-ink glyph so they still read as apps.
  const tile = !!leadColor && !active; // Recent modules → outlined ring
  const inkFor = (c) => `color-mix(in srgb, ${c} 60%, var(--semantic-color-light-mode-text-static-primary-base))`;
  const iconColor = leadColor && !active ? inkFor(leadColor) : "var(--spd-navink)";
  return (
    <button
      className={"spd-navitem" + (active ? " is-active" : "")}
      onClick={onClick}
      aria-current={active ? "page" : undefined}
      aria-label={label}
      title={label}
      style={{ "--sel": color }}
    >
      {active && <span className="spd-navitem__indicator" />}
      <span
        className={"spd-navitem__glyph" + (tile ? " spd-navitem__glyph--ring" : "")}
        style={tile ? { boxShadow: `inset 0 0 0 1px color-mix(in srgb, ${leadColor} 32%, transparent)` } : undefined}
      >
        <Icon name={icon} filled={active} size={19} style={{ color: iconColor }} />
      </span>
      <span className="spd-navitem__label">{label}</span>
    </button>
  );
}

function ModuleNav({ mod, item, onSelectItem, onSwitchModule, rail, onToggleRail }) {
  const [q, setQ] = useState("");
  const isAcct = mod.id === "accounting";
  const [acctApp, setAcctApp] = useState(ACCT_APPS[0]);
  const [acctItem, setAcctItem] = useState(ACCT_APPS[0].nav[0].id);
  const navSource = isAcct ? acctApp.nav : mod.nav;
  if (!navSource || !navSource.length) return null;
  const query = rail ? "" : q.trim().toLowerCase(); // no filtering while railed
  // Home's selected-item accent = the Spired purple (mode-aware token).
  const accent = mod.id === "home" ? "var(--spd-home-glyph)" : mod.color;
  const labelOf = (n) => (n.to ? MODULE_MAP[n.to].name : n.label);
  const visible = navSource.filter((n) => !query || labelOf(n).toLowerCase().includes(query));
  const activeItem = isAcct ? acctItem : item;
  const pickItem = (id) => { if (isAcct) setAcctItem(id); onSelectItem(id); };
  const pickApp = (a) => { setAcctApp(a); setAcctItem(a.nav[0].id); onSelectItem(a.nav[0].id); };
  let lastGroup = null;
  return (
    <nav className={"spd-modnav" + (rail ? " is-rail" : "")} aria-label={mod.name + " navigation"}>
      {/* Header: for Accounting, the SECONDARY app switcher (GL/Payroll/AP/AR/…)
          sits inline here — switching apps swaps the sections below. Plus the
          search (a little icon that takes over the row when tapped) + collapse. */}
      <div className={"spd-modnav__header" + (isAcct ? " spd-modnav__header--acct" : "")}>
        {isAcct && !rail && <AccountingAppSwitcher app={acctApp} onPick={pickApp} />}
        {!rail && (
          /* A label so tapping anywhere focuses the input; idle it's a rounded
             square (icon only), on focus it expands into a working field. */
          <label className="spd-modnav__search">
            <Icon name="search" size={19} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)", flexShrink: 0 }} />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder={"Search " + mod.name + "…"} aria-label={"Search " + mod.name} />
            {q && (
              <button type="button" className="spd-modnav__search-clear" onMouseDown={(e) => { e.preventDefault(); setQ(""); }} aria-label="Clear search">
                <Icon name="close" size={16} />
              </button>
            )}
          </label>
        )}
        <button className="spd-modnav__collapse" onClick={onToggleRail}
          aria-label={rail ? "Expand navigation" : "Collapse to rail"}>
          <SidebarToggleIcon collapsed={rail} size={17} />
        </button>
      </div>
      <div className="spd-modnav__list spd-stagger">
        {visible.map((n) => {
          const showGroup = n.group && n.group !== lastGroup;
          lastGroup = n.group || lastGroup;
          const target = n.to ? MODULE_MAP[n.to] : null;
          return (
            <React.Fragment key={n.id}>
              {showGroup && <p className="spd-modnav__group">{n.group}</p>}
              {target ? (
                <SectionItem
                  icon={target.icon} label={target.name} color={target.color}
                  leadColor={target.color} active={false}
                  onClick={() => onSwitchModule(n.to)}
                />
              ) : (
                <SectionItem
                  icon={n.icon} label={n.label} color={accent}
                  active={activeItem === n.id} onClick={() => pickItem(n.id)}
                />
              )}
            </React.Fragment>
          );
        })}
        {visible.length === 0 && <p className="spd-modnav__empty">No matches</p>}
      </div>
      {/* Account settings pinned to the bottom, always visible; the list
          above scrolls behind it. */}
      {mod.footerNav && mod.footerNav.length > 0 && (
        <div className="spd-modnav__foot">
          <p className="spd-modnav__group spd-modnav__foot-label">Admin settings</p>
          {mod.footerNav.map((n) => (
            <SectionItem key={n.id} icon={n.icon} label={n.label} color={accent}
              active={item === n.id} onClick={() => onSelectItem(n.id)} />
          ))}
        </div>
      )}
    </nav>
  );
}

/* A primary action in its loading state: the mono mark assembles bottom-to-top
   inside the button while the label narrates. */
function LoadingButtonDemo() {
  const [state, setState] = useState("idle");
  const click = () => {
    if (state !== "idle") return;
    setState("loading");
    setTimeout(() => {
      setState("done");
      setTimeout(() => setState("idle"), 1600);
    }, 2800);
  };
  return (
    <button className="spd-btn spd-btn--primary" onClick={click} style={{ minWidth: 160, justifyContent: "center", opacity: state === "loading" ? 0.92 : 1 }}>
      {state === "loading" ? (
        <React.Fragment><RingLoader size={16} mono="#FFFFFF" strokeWidth={2.2} /> Adding…</React.Fragment>
      ) : state === "done" ? (
        <React.Fragment><Icon name="check" size={17} /> Added</React.Fragment>
      ) : (
        <React.Fragment><Icon name="add" size={17} /> Add Person</React.Fragment>
      )}
    </button>
  );
}

/* ═══ Validation States ═══
   A reusable validated-form engine following the industry-standard error
   pattern (GOV.UK error-summary + WCAG 3.3.1/3.3.3): validate on submit,
   show an error SUMMARY panel that lists every problem as a link to its
   field, mark each field inline (border + icon + message + aria-invalid),
   move focus to the summary or first bad field, and re-validate live once
   the user starts fixing. Two example forms below configure it differently. */
function ValidatedForm({ icon, fields, submitLabel, successTitle, successText, summaryPosition, scrollTo }) {
  const initial = {};
  fields.forEach((f) => { initial[f.key] = f.type === "checkbox" ? false : ""; });
  const [values, setValues] = useState(initial);
  const [submitted, setSubmitted] = useState(false);
  const [done, setDone] = useState(false);
  const summaryRef = React.useRef(null);
  const refs = {};
  fields.forEach((f) => { refs[f.key] = React.useRef(null); });

  const computeErrors = (vals) => {
    const e = {};
    fields.forEach((f) => {
      const v = vals[f.key];
      if (f.type === "checkbox") { if (f.required && !v) e[f.key] = f.errorMsg || ("Please confirm " + f.label.toLowerCase() + "."); return; }
      const s = (v || "").trim();
      if (f.required && !s) { e[f.key] = f.emptyMsg || ((f.type === "select" ? "Choose " : "Enter ") + f.label.toLowerCase() + "."); return; }
      if (!s) return;
      if (f.type === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)) e[f.key] = "Enter a valid email, like name@church.org.";
      else if (f.type === "tel" && !/^[0-9()+\-\s]{7,}$/.test(s)) e[f.key] = "Use digits, spaces and + ( ) - only.";
      else if (f.type === "amount" && !/^\d+(\.\d{1,2})?$/.test(s.replace(/[$,\s]/g, ""))) e[f.key] = "Enter an amount like 250 or 250.00.";
      else if (f.validate) { const m = f.validate(s, vals); if (m) e[f.key] = m; }
    });
    return e;
  };
  const errors = computeErrors(values);
  const errorKeys = fields.filter((f) => errors[f.key]).map((f) => f.key);

  const submit = () => {
    setSubmitted(true);
    if (errorKeys.length === 0) { setDone(true); return; }
    setDone(false);
    setTimeout(() => {
      if (scrollTo === "firstError" && refs[errorKeys[0]].current) {
        const el = refs[errorKeys[0]].current;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      } else if (summaryRef.current) {
        summaryRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        try { summaryRef.current.focus({ preventScroll: true }); } catch (e) { summaryRef.current.focus(); }
      }
    }, 40);
  };
  const reset = () => { setValues(initial); setSubmitted(false); setDone(false); };
  const showErr = (k) => submitted && errors[k];
  const showOk = (k) => { if (!submitted || errors[k]) return false; const f = fields.find((x) => x.key === k); return f.type === "checkbox" ? values[k] : (values[k] || "").trim(); };

  const summary = (
    <div ref={summaryRef} tabIndex={-1} role="alert" className="spd-alert spd-alert--error spd-fade-in" style={{ outline: "none", scrollMarginTop: 16 }}>
      <Icon name="error" size={20} filled />
      <div className="spd-alert__body">
        <p className="spd-alert__title">Please complete or correct the highlighted {errorKeys.length === 1 ? "field" : errorKeys.length + " fields"}</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 3, marginTop: 4 }}>
          {errorKeys.map((k) => (
            <button key={k} onClick={() => { const el = refs[k].current; if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.focus(); } }}
              style={{ background: "none", border: "none", padding: 0, textAlign: "left", cursor: "pointer", fontFamily: "inherit", fontSize: 12.5, color: "#B0473F", textDecoration: "underline", textUnderlineOffset: 2 }}>
              {errors[k]}
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  const renderField = (f) => {
    const err = showErr(f.key), ok = showOk(f.key);
    const cls = "spd-input" + (err ? " spd-input--error" : ok ? " spd-input--success" : "");
    const msgId = "msg-" + f.key;
    const common = { id: "vf-" + f.key, ref: refs[f.key], "aria-invalid": err ? "true" : "false", "aria-describedby": (err || ok || f.hint) ? msgId : undefined };
    if (f.type === "checkbox") {
      return (
        <div key={f.key} className="spd-field" style={{ gridColumn: "1 / -1" }}>
          <label style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
            <input type="checkbox" ref={refs[f.key]} checked={values[f.key]} onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.checked }))}
              aria-invalid={err ? "true" : "false"}
              style={{ width: 17, height: 17, marginTop: 1, accentColor: "#6E64BE", flexShrink: 0, outline: err ? "2px solid #C0564E" : "none", outlineOffset: 1, borderRadius: 4 }} />
            <span style={{ fontSize: 13, color: "var(--semantic-color-light-mode-text-static-secondary-base)", lineHeight: 1.4 }}>{f.label}</span>
          </label>
          {err && <span id={msgId} className="spd-field__msg spd-field__msg--error" style={{ marginLeft: 27 }}><Icon name="error" size={14} filled /> {errors[f.key]}</span>}
        </div>
      );
    }
    return (
      <div key={f.key} className="spd-field" style={f.full ? { gridColumn: "1 / -1" } : undefined}>
        <label className="spd-field__label" htmlFor={"vf-" + f.key}>{f.label}{!f.required && <span style={{ color: "var(--semantic-color-light-mode-text-static-tertiary-base)", fontWeight: 400 }}> · optional</span>}</label>
        {f.type === "select" ? (
          <select {...common} className={cls} value={values[f.key]} onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.value }))} style={{ appearance: "none", backgroundImage: "url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B85A8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>\")", backgroundRepeat: "no-repeat", backgroundPosition: "right 12px center", backgroundSize: 16, paddingRight: 34, color: values[f.key] ? "var(--semantic-color-light-mode-text-static-primary-base)" : "var(--semantic-color-light-mode-text-static-tertiary-base)" }}>
            <option value="">{f.placeholder || "Select…"}</option>
            {f.options.map((o) => <option key={o} value={o} style={{ color: "#202020" }}>{o}</option>)}
          </select>
        ) : (
          <input {...common} type={f.type === "amount" ? "text" : f.type} inputMode={f.type === "amount" ? "decimal" : undefined}
            className={cls} value={values[f.key]} placeholder={f.placeholder}
            onChange={(e) => setValues((v) => ({ ...v, [f.key]: e.target.value }))} />
        )}
        {err ? <span id={msgId} className="spd-field__msg spd-field__msg--error"><Icon name="error" size={14} filled /> {errors[f.key]}</span>
          : ok ? <span id={msgId} className="spd-field__msg spd-field__msg--success"><Icon name="check_circle" size={14} filled /> Looks good</span>
          : f.hint ? <span id={msgId} className="spd-field__msg spd-field__msg--hint">{f.hint}</span> : null}
      </div>
    );
  };

  return (
    <div className="spd-card" style={{ padding: 24, display: "flex", flexDirection: "column", gap: 16, scrollMarginTop: 12 }}>
      {done ? (
        <div className="spd-alert spd-alert--success spd-fade-in">
          <Icon name="check_circle" size={20} filled />
          <div className="spd-alert__body">
            <p className="spd-alert__title">{successTitle}</p>
            <p className="spd-alert__text">{typeof successText === "function" ? successText(values) : successText}</p>
          </div>
        </div>
      ) : (submitted && errorKeys.length > 0 && summaryPosition === "top") ? summary : null}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 16 }}>
        {fields.map(renderField)}
      </div>

      {(submitted && errorKeys.length > 0 && summaryPosition === "bottom") ? summary : null}

      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>

      </div>
    </div>
  );
}

              {["All", "Active", "Inactive", "Leaders"].map((c, i) => (
                <span key={c} className="spd-ia-chip" style={{ background: i === 0 ? "var(--spd-badge-role-bg)" : "var(--semantic-color-light-mode-fill-static-neutral-subtle)", color: i === 0 ? "var(--spd-badge-role-fg)" : "var(--semantic-color-light-mode-text-static-secondary-base)", border: i === 0 ? "0.5px solid var(--spd-badge-role-stroke)" : "0.5px solid transparent" }}>{c}</span>

          <IAFrame label="Today, a squeezed desktop page" tone="bad">
            <p style={{ fontSize: 11, color: "var(--semantic-color-light-mode-text-static-tertiary-base)", marginBottom: 8 }}>Fixed rail + non-reflowing tables on a phone</p>
            <MiniNavItem icon="table_rows" label="Rail eats half the screen" muted />
            <MiniNavItem icon="pinch" label="Pinch-and-zoom to read tables" muted />
            <p style={{ fontSize: 11, color: "#B0473F", marginTop: 8 }}>No drawer, no reflow, mobile is an afterthought.</p>
          </IAFrame>
          <IAFrame label="Spired, mobile-first navigation" tone="good">
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <Icon name="menu" size={16} style={{ color: "var(--semantic-color-light-mode-text-static-secondary-base)" }} />
              <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 8px", borderRadius: 999, background: "var(--semantic-color-light-mode-fill-static-accent-amethyst-light)" }}>

            <MiniNavItem icon="swipe_right" label="Rail opens as a drawer" active />
            <MiniNavItem icon="fit_screen" label="Content goes full-bleed" />
            <p style={{ fontSize: 11, color: "var(--spd-badge-positive-fg)", marginTop: 8 }}>Switcher persists; you always know the module, even on a phone.</p>
          </IAFrame>
        </div>
      </div>
    </div>
  );
}

/* In-module placeholder, reinforces which module/section you're in for the
   sections not fleshed out in this concept. */
function ModulePlaceholder({ mod, item }) {
  const section = [...(mod.nav || []), ...(mod.footerNav || [])].find((n) => n.id === item)
    || (mod.id === "accounting" ? ACCT_APP_SECTION[item] : null);
  return (
    <div className="spd-page">
      <div className="spd-page__inner">
        {mod.id === "accounting" && (
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}><AccountingContextBar /></div>
        )}
        <div className="spd-fade-in" style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, minHeight: "50vh", textAlign: "center" }}>
          <span className="spd-navitem__chip" style={{ width: 56, height: 56, borderRadius: 18, background: `color-mix(in srgb, ${mod.color} 12%, transparent)` }}>
            <Icon name={section ? section.icon : mod.icon} filled size={26} style={{ color: mod.color }} />
          </span>
          <div>
            <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: "1px", textTransform: "uppercase", color: "var(--semantic-color-light-mode-text-static-tertiary-base)" }}>{mod.name}</p>
            <p style={{ fontSize: 22, fontWeight: 600, marginTop: 4 }}>{section ? section.label : mod.name}</p>
          </div>
          <p style={{ fontSize: 14, color: "var(--semantic-color-light-mode-text-static-secondary-subtle)", maxWidth: 470, lineHeight: 1.55 }}>

          </p>
        </div>

/* ═══ App shell ═══ */

const CONCEPT_PAGES = {
  motion: MotionPage, spiredlogo: SpiredLogoPage, aimark: AiMarkPage,
  loading: LoadingStatesPage, errors: ErrorStatesPage,
  validation: ValidationStatesPage, states: ComponentStatesPage,
  feedback: SystemFeedbackPage, ia: InfoArchitecturePage,
};

function App() {
  const [booting, setBooting] = useState(true);
  const [mode, setMode] = useState("light");
  const [moduleId, setModuleId] = useState("home");
  const [itemByModule, setItemByModule] = useState({}); // remembers last section per module
  const [mobileNav, setMobileNav] = useState(false);
  const [navRail, setNavRail] = useState(false);       // side-nav collapse control: full labels vs icon rail
  const [switcherPinned, setSwitcherPinned] = useState(false); // module switcher docked as a left rail
  const [switcherOpen, setSwitcherOpen] = useState(false);     // switcher popover open
  const [switching, setSwitching] = useState(false);   // brief loader while moving to another module
  const hoverTimer = useRef(null);                     // hover-intent open/close timer for the switcher

  // The Spired logo always opens the module-switcher popover (the drawer on
  // mobile). The popover is also where you pin the switcher to a rail, and,
  // when already pinned, where you unpin it back to a popover.
  const onLogoClick = () => {
    clearTimeout(hoverTimer.current);
    if (window.matchMedia("(max-width: 768px)").matches) { setMobileNav((o) => !o); return; }
    setSwitcherOpen((o) => !o);
  };
  // Hover-to-open with intent: a short delay before opening so a passing cursor
  // doesn't trigger it, and a grace delay before closing so you can travel to
  // the popover without it vanishing. Desktop only (no hover on touch).
  const hoverOpen = () => {
    if (window.matchMedia("(max-width: 768px)").matches) return;
    clearTimeout(hoverTimer.current);
    hoverTimer.current = setTimeout(() => setSwitcherOpen(true), 340);
  };
  const hoverClose = () => {
    clearTimeout(hoverTimer.current);
    hoverTimer.current = setTimeout(() => setSwitcherOpen(false), 260);
  };
  const hoverKeep = () => { clearTimeout(hoverTimer.current); };

  useEffect(() => { const t = setTimeout(() => setBooting(false), 2900); return () => clearTimeout(t); }, []);
  useEffect(() => { document.documentElement.dataset.spdMode = mode; }, [mode]);

  if (booting) {
    return (
      <div className="spd-boot" role="status" aria-label="Loading Spired">
        <BootLogo />
      </div>
    );
  }

  const mod = MODULE_MAP[moduleId];
  const item = itemByModule[moduleId] ?? firstItemOf(moduleId);

  const goModule = (id) => {
    setMobileNav(false);
    if (id === moduleId) return;
    // Switching modules moves to a different "space", show a brief branded
    // load so it doesn't feel like an instant, weightless jump.
    setSwitching(true);
    setModuleId(id);
    setTimeout(() => setSwitching(false), 950);
  };
  const goItem = (id) => { setItemByModule((s) => ({ ...s, [moduleId]: id })); setMobileNav(false); };
  // Jumping into a module FROM the Spired Home side nav auto-pins the switcher
  // rail, a built-in "back" so you're never stranded in a module's own nav with
  // no visible way back to where you came from. (Only from Home; the popover/rail
  // switches never force-pin.)
  const goModuleFromNav = (id) => { if (moduleId === "home") setSwitcherPinned(true); goModule(id); };
  const goModuleHome = () => goItem(firstItemOf(moduleId)); // badge → back to this module's home
  const pinSwitcher = () => { setSwitcherPinned(true); setSwitcherOpen(false); };
  const unpinSwitcher = () => { setSwitcherPinned(false); setSwitcherOpen(false); }; // both pin & unpin close the popover
  const logoLabel = switcherOpen ? "Close module switcher" : "Switch module";

  const renderPage = () => {
    if (moduleId === "home") return item === "dashboard" ? <HomePage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "people") return item === "directory" ? <PeoplePage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "giving") return item === "overview" ? <GivingOverviewPage /> : <ModulePlaceholder mod={mod} item={item} />;
    if (moduleId === "concept") { const P = CONCEPT_PAGES[item]; return P ? <P /> : <ModulePlaceholder mod={mod} item={item} />; }
    return <ModulePlaceholder mod={mod} item={item} />;
  };

  return (
    <div className="spd-shell">
      <TopNav
        mode={mode}
        onToggleMode={() => setMode(mode === "light" ? "midnight" : "light")}
        onLogoClick={onLogoClick}
        onLogoEnter={hoverOpen}
        onLogoLeave={hoverClose}
        logoLabel={logoLabel}
        logoActive={switcherOpen}
        moduleId={moduleId}
      />
      {switcherOpen && (
        <SwitcherPopover moduleId={moduleId} pinned={switcherPinned} onSwitch={goModule}
          onPin={pinSwitcher} onUnpin={unpinSwitcher} onClose={() => setSwitcherOpen(false)}
          onMouseEnter={hoverKeep} onMouseLeave={hoverClose} />
      )}
      <div className="spd-body">
        {/* Module-switcher rail at the far left (before the section nav). Always
            mounted so pin/unpin can animate the slot open/closed. */}
        <ModuleRail moduleId={moduleId} pinned={switcherPinned} onSwitch={goModule} onUnpin={unpinSwitcher} />
        {/* Single side nav = the current module's own nav (Home = the hub).
            The in-nav collapse control shrinks it to an icon rail. */}
        <ModuleNav key={moduleId} mod={mod} item={item} onSelectItem={goItem} onSwitchModule={goModuleFromNav}
          rail={navRail} onToggleRail={() => setNavRail((r) => !r)} />
        <main className="spd-sheet">
          {/* keyed on module+section, a mode toggle re-themes in place, it
              never reloads content */}
          <div key={moduleId + ":" + item + ":" + (switching ? "load" : "page")} className="spd-fade-in" style={{ position: "absolute", inset: 0, display: "flex", overflow: "hidden" }}>
            {switching
              ? <div className="spd-modload"><SpiredLoader size={30} gap={18} label={"Opening " + mod.name + "…"} /></div>
              : renderPage()}
          </div>
        </main>
      </div>
      {/* Mobile: one drawer with modules + current sections. */}
      <MobileNavDrawer
        moduleId={moduleId}
        item={item}
        onSwitchModule={goModule}
        onSelectItem={goItem}
        open={mobileNav}
        onClose={() => setMobileNav(false)}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
