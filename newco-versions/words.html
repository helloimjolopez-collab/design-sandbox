<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>List of Words</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #000000;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px; box-sizing: border-box;
    font-family: 'Google Sans Flex', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  /* Rows are hard-coded rather than left to flex-wrap, so the grouping matches
     Figma "NewCo testing Round 1" node 2-8 exactly. The type scales with the
     viewport so a row still holds on one line as the window narrows. */
  .rows {
    display: flex; flex-direction: column;
    gap: clamp(12px, 1.6vw, 22px);
    /* Hug the widest row so the block sits optically centred instead of
       leaving a band of dead space to its right. */
    width: fit-content; max-width: 100%;
  }
  .row { display: flex; flex-wrap: wrap; gap: clamp(18px, 2.4vw, 38px); }
  /* Plain words, NOT controls. The filled pill read as a button and people
     tried to click it, so there is no fill, no border, no radius and no
     padding box: just large white type. The gap between words is well wider
     than a word-space so they still read as separate items, and the cursor
     stays the neutral arrow (a pointer would say "button", an I-beam would
     say "selectable text"). */
  .word {
    color: #FFFFFF;
    font-size: clamp(17px, 3.4vw, 42px);
    font-weight: 500;
    letter-spacing: -0.2px;
    line-height: 1.15;
    white-space: nowrap;
    user-select: none;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="rows">
    <div class="row"><span class="word">Approachable</span><span class="word">Bland</span><span class="word">Calm</span><span class="word">Boring</span><span class="word">Clean</span></div>
    <div class="row"><span class="word">Busy</span><span class="word">Comfortable</span><span class="word">Cluttered</span><span class="word">Familiar</span></div>
    <div class="row"><span class="word">Dated</span><span class="word">Fresh</span><span class="word">Impersonal</span><span class="word">Friendly</span></div>
    <div class="row"><span class="word">Intimidating</span><span class="word">High quality</span><span class="word">Overwhelming</span><span class="word">Inviting</span></div>
    <div class="row"><span class="word">Sterile</span><span class="word">Optimistic</span><span class="word">Unattractive</span><span class="word">Organised</span></div>
    <div class="row"><span class="word">Professional</span><span class="word">Reliable</span><span class="word">Sophisticated</span></div>
    <div class="row"><span class="word">Trustworthy</span><span class="word">OTHER</span></div>
  </div>
</body>
</html>
