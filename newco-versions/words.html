<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>List of Words</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #000000;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px; box-sizing: border-box;
    font-family: 'Google Sans Flex', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  /* Rows are hard-coded rather than left to flex-wrap, so the grouping matches
     Figma "NewCo testing Round 1" node 2-8 exactly at any width. */
  .rows { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 580px; }
  .row  { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    height: 36px; padding: 0 18px; border-radius: 999px;
    background: #FFFFFF; color: #0A0A0A;
    font-size: 13.5px; font-weight: 500; letter-spacing: .1px;
    white-space: nowrap; user-select: none;
  }
</style>
</head>
<body>
  <div class="rows">
    <div class="row"><span class="chip">Approachable</span><span class="chip">Bland</span><span class="chip">Calm</span><span class="chip">Boring</span><span class="chip">Clean</span></div>
    <div class="row"><span class="chip">Busy</span><span class="chip">Comfortable</span><span class="chip">Cluttered</span><span class="chip">Familiar</span></div>
    <div class="row"><span class="chip">Dated</span><span class="chip">Fresh</span><span class="chip">Impersonal</span><span class="chip">Friendly</span></div>
    <div class="row"><span class="chip">Intimidating</span><span class="chip">High quality</span><span class="chip">Overwhelming</span><span class="chip">Inviting</span></div>
    <div class="row"><span class="chip">Sterile</span><span class="chip">Optimistic</span><span class="chip">Unattractive</span><span class="chip">Organised</span></div>
    <div class="row"><span class="chip">Professional</span><span class="chip">Reliable</span><span class="chip">Sophisticated</span></div>
    <div class="row"><span class="chip">Trustworthy</span><span class="chip">OTHER</span></div>
  </div>
</body>
</html>
