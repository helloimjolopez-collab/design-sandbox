<style>
  :root { color-scheme: light }
  body { margin:0; padding:0; font:14px -apple-system,BlinkMacSystemFont,sans-serif;

<body>
<title>NewCo Version 1</title>
<!--
  SOURCES (only these):
  · Pathway repo (pathway-ds), token architecture + naming, NavShell spec §4/§5/§11,
    Material Symbols Rounded mandate (CLAUDE.md §12), self-contained demo convention
    (components/sidenav/sidenav.html).
  · Live product (account.test1.myamplify.io/dashboard, captured 2026-07-16), all
    page content and nav structure.
  · NewCo_Brand_Guidelines.pdf, palette, Google Sans Flex, gradients, ascension motif.
  · Figma node 40006833-27620, sheet-over-canvas layout (rounded top corners) +
    People screen content.
  · Figma node 40010650-164495, warm-neutral surface direction: greige canvas,
    neutral text, purple reserved for accents (not Planning-Center-purple-everywhere).
  · Widget Container sandbox demo (helloimjolopez-collab.github.io/design-sandbox/
    Widget%20Container%20Demo) + Figma node 40009622-39702, widget container
    structure and behaviour (warm header strip, hover-reveal refresh, inner
    content sheet). No charts here, production content only.

  ARCHITECTURE, why the rebrand is "mostly a token swap":
  Components below consume ONLY Pathway semantic token names (pathway-ds
  CLAUDE.md §6). NewCo = new values behind those same contracts. Midnight
  Mode = a second value set behind the same names. In production: add a
  "Midnight" mode to the Figma variable collection → sync-tokens →
  Style Dictionary emits `--semantic-color-midnight-mode-*` (same shape as
  the existing 452 `--semantic-color-dark-mode-*` vars in tokens.css) and
  the app's theme switch re-points the aliases. Zero component changes.
-->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* ── PRIMITIVES, NewCo brand palette (NewCo_Brand_Guidelines.pdf) ──── */
    --primitive-color-purple-100: #9691F5;
    --primitive-color-purple-300: #6E64BE;
    --primitive-color-purple-600: #41377D;
    --primitive-color-purple-900: #19143C;
    --primitive-color-purple-950: #131120;  /* PROPOSED: midnight canvas, desaturated deep indigo, a starry night sky, not neon */
    --primitive-color-yellow-300: #FFC864;
    --primitive-color-orange-300: #FF8C50;
    --primitive-color-orange-500: #CF775B;
    --primitive-color-magenta-500: #9B0078;
    --primitive-color-magenta-700: #7A0569;
    --primitive-color-blue-300: #508CFF;
    --primitive-color-blue-500: #35509E;
    --primitive-color-blue-700: #27326D;
    --primitive-color-green-300: #14C382;
    --primitive-color-green-700: #166C5F;
    --primitive-color-teal-900: #18404E;
    --primitive-color-mauve-500: #714C72;
    --primitive-color-taupe-600: #6F677A;
    --primitive-color-neutral-0: #FFFFFF;
    --primitive-color-neutral-50: #F5F5F5;
    --primitive-color-neutral-100: #E6E6E6;
    --primitive-color-neutral-200: #D2D2D2;
    --primitive-color-neutral-300: #B4B4B4;
    --primitive-color-neutral-600: #5A5A5A;
    --primitive-color-neutral-900: #1E1E1E;
    /* Warm neutrals, ONE coherent ramp. Each step has R highest and B just
       above G (R ≥ B > G): the SLIGHTEST mauve/pink-purple tint. On their own
       they read as clean warm neutrals (never pink, never purple, never yellow
       or blue); combined with the purple/mauve accents the shared undertone
       creates harmony. Light & airy like Material's paper surfaces. */
    /* Chrome canvas is the ORIGINAL Figma warm neutral #F7F3F3 (node 40010650)
       Jo confirmed. Clean warm greige: R a touch highest, G=B, so it reads warm
       without any yellow or purple cast; accents pop against it. */
    /* Warm greige with a rosy warmth (R > G = B) that GROWS at the darker steps,
       so darker elements (secondary button, borders) read warm, not grey. Chrome
       stays the Figma #F7F3F3. Never yellow (B=G), never purple (B not > G). */
    --primitive-color-warm-0: #FEFBFB;
    --primitive-color-warm-100: #FBF6F6;
    --primitive-color-warm-200: #F9F3F3;
    --primitive-color-warm-250: #F7F3F3;
    --primitive-color-warm-300: #EFE5E5;
    --primitive-color-warm-400: #DBCECE;
    --primitive-color-warm-750: #857A7A;
    --primitive-color-warm-950: #2A2525;

    /* ── SEMANTICS · LIGHT MODE, real Pathway token names, NewCo values.
       Neutrals are WARM (Figma 40010650-164495): greige surfaces, neutral
       text. Purple appears only where the brand should speak, actions,
       links, active states, the mark. ── */
    /* Warm "vibrant beige/sand" surfaces (MD3 feel but BEIGE, never purple),        more presence than the old flat beige; the sheet is a warm off-white,
       never pure white. */
    /* Surfaces drawn straight from the warm-neutral ramp so they're guaranteed
       in-family: canvas/nav a light warm neutral (warm-250), the main content
       sheet a near-white (warm-0) so it reads bright. Nothing pure white. */
    /* Layered surface steps (chrome darkest → sheet → cards pure white), like the
       Figma, so the content area isn't one flat white slab. */
    --semantic-color-light-mode-surface-canvas-light: var(--primitive-color-warm-250); /* chrome */
    --semantic-color-light-mode-surface-nav-light: var(--primitive-color-warm-250);
    --semantic-color-light-mode-surface-sheet-base: #FCF9F9;   /* main content: NEAR-white (same warm tone as chrome, much lighter) */
    /* Search fill (shared by the side-nav search + the People table search): a
       noticeable light MAUVE (not the neutral grey of the secondary button). */
    --spd-search-fill: color-mix(in oklch, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 11%, #FFFFFF);
    /* Side-nav ink is SLATE (never the module colour): a readable-but-quiet
       idle slate, and a near-black slate for hover/active. The module/primary
       colour lives only in the fill + stripe. */
    --spd-navink-idle: #524E59;
    --spd-navink-strong: #1B1822; /* near-black, active icon/label are the most visible */
    --semantic-color-light-mode-surface-widget-header: var(--primitive-color-warm-0); /* a whisper below the white card */
    --semantic-color-light-mode-surface-widget-base: #FFFFFF; /* cards pop as pure white on the warm sheet */
    --semantic-color-light-mode-fill-static-neutral-light: #FFFFFF;
    --semantic-color-light-mode-fill-static-neutral-subtle: var(--primitive-color-warm-250);
    --semantic-color-light-mode-fill-static-brand-base: var(--primitive-color-purple-600);
    --semantic-color-light-mode-fill-static-brand-bold: var(--primitive-color-purple-900);
    --semantic-color-light-mode-fill-static-brand-light: #F1EFFC;
    /* Four text tiers, used deliberately: primary for content, secondary for
       labels, subtle for supporting, tertiary for timestamps/captions,        hierarchy through shade, not weight. */
    --semantic-color-light-mode-text-static-primary-base: #202020;
    --semantic-color-light-mode-text-static-secondary-base: #484848;
    --semantic-color-light-mode-text-static-secondary-subtle: #606060;
    --semantic-color-light-mode-text-static-tertiary-base: #928B92; /* mauve-neutral gray (in-family, not yellow-gray) */
    --semantic-color-light-mode-text-static-positive-base: var(--primitive-color-green-700);
    --semantic-color-light-mode-fill-static-positive-light: #EDF6F0;
    --semantic-color-light-mode-stroke-static-neutral-light: var(--primitive-color-warm-300);
    --semantic-color-light-mode-stroke-static-neutral-faint: rgba(58,50,62,0.05); /* mauve-neutral hairline (in-family) */
    --semantic-color-light-mode-stroke-action-secondary-inverse-base: var(--primitive-color-warm-400);
    /* ONE hover fill everywhere, a mauve-NEUTRAL darkening (in-family with the
       warm ramp, never yellow-brown, never obviously purple), used by top-nav
       buttons, org, account menu, table rows, unpin & the switcher. */
    --semantic-color-light-mode-fill-contextual-navitem-hover: rgba(160, 149, 149, 0.12); /* #A09595 @ 12% */
    /* Active nav: translucent amethyst tint (Pathway's alpha-tint recipe),        reads clearly against the warm sand canvas, unlike a flat pale fill. */
    --semantic-color-light-mode-fill-contextual-navitem-active: rgba(110,100,184,0.14);
    --semantic-color-light-mode-text-contextual-navitem-base: #484848;
    --semantic-color-light-mode-text-contextual-navitem-active: #202020;
    --semantic-color-light-mode-icon-contextual-navitem-oncolor: #FFFFFF; /* PROPOSED, glyph on the active module chip */
    /* Action primary = Jo's chosen value, read from the Figma node itself
       (Add Person → bg #6E64BE, full pill, white label). Links use the
       amethyst contrast (#5951A0) bound in the same screen. */
    --semantic-color-light-mode-fill-action-primary-base: #6E64BE; /* NewCo brand primary (Jo's pick) */
    --semantic-color-light-mode-fill-action-primary-hover: #5C52A8;
    --semantic-color-light-mode-text-action-primary-base: #5951A0;
    /* Secondary action = a VISIBLE warm-neutral fill (from the ramp, in-family),        warm-300 so it's clearly a button, not invisible on the near-white sheet. */
    --semantic-color-light-mode-fill-action-secondary-base: #F5F1F1;
    --semantic-color-light-mode-fill-action-secondary-hover: #F1EAEA;
    --semantic-color-light-mode-fill-action-secondary-pressed: #ECE3E3;
    --semantic-color-light-mode-text-action-secondary-base: var(--primitive-color-warm-950);
    --spd-logo-word: #19143C;
    /* Badge palette, recipe read from Figma: soft translucent tint + deep
       ink text + 11px leading dot. */
    --spd-badge-plum-bg: rgba(237,224,224,0.58);   --spd-badge-plum-fg: #5B0C49;
    --spd-badge-navy-bg: rgba(223,229,240,0.60);   --spd-badge-navy-fg: #27326D;
    --spd-badge-orchid-bg: rgba(235,224,240,0.60); --spd-badge-orchid-fg: #4C2260;
    --spd-badge-teal-bg: rgba(222,233,236,0.62);   --spd-badge-teal-fg: #193640;
    --spd-badge-amber-bg: #FBEFC6;  --spd-badge-amber-fg: #7A511B;  /* chick-yellow bg + brown ink (Pending/warn) */
    --spd-badge-positive-bg: #E5F2ED;              --spd-badge-positive-fg: #193640; --spd-badge-positive-dot: #2F8A62;
    --spd-badge-rose-bg: rgba(240,226,231,0.62);   --spd-badge-rose-fg: #5B1F33;
    --spd-badge-role-bg: #F4F2FA; --spd-badge-role-fg: #221E3F; --spd-badge-role-stroke: #DCD9EF; --spd-badge-role-dot: #5951A0;
    /* Accent UI variants are DESATURATED versions of the brand secondaries,        full-saturation primitives stay reserved for marketing/hero moments.
       In-product color should murmur, not shout (and never clash). */
    --semantic-color-light-mode-fill-static-accent-amethyst-base: #6E64B8; /* amethyst-90, Jo's pipeline */
    --semantic-color-light-mode-fill-static-accent-amethyst-light: #F4F2FA; /* amethyst-10 */
    --semantic-color-light-mode-fill-static-accent-jade-base: #0DA79A; /* turquoise-teal — cooler/bluer green, harmonises with the purples */
    /* Home/NewCo amethyst ink, mode-aware so it flips in Midnight (was a
       hard-coded hex that stayed dark & invisible on the dark nav). */
    /* Home = the NEWCO PURPLE (brand primary family #6E64BE→#41377D), not the
       old muted amethyst. Deepened for text via color-mix at point of use. */
    --spd-home-glyph: #6E64BE;    /* rail / general glyph (matches primary) */
    --spd-home-ink: #6E64BE;      /* popover chip glyph */
    --spd-home-ink-deep: #3F2E7A; /* deep NewCo purple (text/high-contrast) */
    --semantic-color-light-mode-fill-static-accent-jade-light: #E1F4EC;
    --semantic-color-light-mode-fill-static-accent-seabreeze-base: #4E5AC6; /* INDIGO (was a plain blue that clashed with the purples) */
    --semantic-color-light-mode-fill-static-accent-seabreeze-light: #ECEDFA;
    --semantic-color-light-mode-fill-static-accent-amber-light: #F9EFCE;

    /* PROPOSED accent families for NewCo's wider secondary palette, named
       by the existing grammar so they can be added in Figma and synced.
       Tuned for a bit more vibrancy in light mode (Jo, 2026-07-21), the flat
       bases were too pastel; contrast stays accessible via the deepened ink. */
    --semantic-color-light-mode-fill-static-accent-magenta-base: #D62A97; /* vibrant magenta (was muted #AC3389) — its OKLCH active tint reads lighter + more vibrant */
    --semantic-color-light-mode-fill-static-accent-magenta-bold: #A81F78;
    --semantic-color-light-mode-fill-static-accent-magenta-light: #F8ECF4;
    --semantic-color-light-mode-fill-static-accent-sunrise-base: #E17B34;
    --semantic-color-light-mode-fill-static-accent-sunrise-bold: #C56A2E;
    --semantic-color-light-mode-fill-static-accent-sunrise-light: #FAEEE3;
    --semantic-color-light-mode-fill-static-accent-gold-base: var(--primitive-color-yellow-300);
    --semantic-color-light-mode-fill-static-accent-teal-base: #2A7E90;
    --semantic-color-light-mode-fill-static-accent-teal-light: #E6F1F3;
    --semantic-color-light-mode-fill-static-accent-mauve-base: #8C4F92;
    --semantic-color-light-mode-fill-static-accent-taupe-base: var(--primitive-color-taupe-600);
    --semantic-color-light-mode-fill-static-accent-navy-base: #3F52AE;
    --semantic-color-light-mode-fill-static-accent-navy-bold: #35468F;
    /* Yellow (Accounting) + Red (Safety), a true yellow (not ochre/brown), still
       deep enough to read as a filled glyph on the light surface. */
    --semantic-color-light-mode-fill-static-accent-amber-base: #C68A16; /* warm BROWN-ochre gold (darkens to brown not green); present as a stripe/fill + legible glyph */
    --semantic-color-light-mode-fill-static-accent-red-base: #CB4034;

    /* Avatar, exact from the Figma table cell: muted mauve-gray tint at 74%,
       near-black initials. 28px, one shade everywhere. */
    --semantic-color-light-mode-fill-contextual-avatar-base: #DDD4DA; /* Figma avatar (node 40010650): a light mauve-grey circle, dark initials */
    --semantic-color-light-mode-text-contextual-avatar-base: #2E2A33;

    /* ── LAYOUT, Pathway contextual tokens (nav-shell-spec §4) ──────────── */
    --semantic-layout-units-contextual-card-cornerradius-cornerradius: 16px;
    --semantic-layout-units-contextual-card-border-width-base-base: 0.5px; /* true hairline (Pathway card spec) */
    --semantic-layout-units-contextual-page-padding-horizontal: 32px;
    --semantic-layout-units-contextual-page-padding-top: 44px;
    --semantic-layout-units-contextual-page-padding-bottom: 56px;
    --semantic-layout-units-contextual-sheet-cornerradius: 28px; /* PROPOSED */
    --semantic-layout-units-cornerradius-full: 999px;

    /* ── MOTION, Pathway names + values (src/tokens/tokens.css). One
       PROPOSED override: livelier spring (1.14 vs Pathway's 1.04) for
       NewCo's "uplifting" personality. ─────────────────────────────────── */
    --motion-duration-1: 120ms;
    --motion-duration-2: 180ms;
    --motion-duration-3: 240ms;
    --motion-duration-4: 360ms;
    --motion-duration-5: 560ms;
    --motion-duration-6: 740ms;
    --motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
    --motion-easing-decelerate: cubic-bezier(0, 0, 0.2, 1);
    --motion-easing-emphasized: cubic-bezier(0.32, 0.72, 0, 1);
    /* Gentle ease-IN-and-out for collapse/reveal/expand, slow to start, slow to
       settle, so these gestures feel unhurried and elegant (not abrupt). */
    --motion-easing-inout: cubic-bezier(0.62, 0.02, 0.23, 1);
    --motion-easing-spring: cubic-bezier(0.34, 1.08, 0.64, 1); /* softened rebound, a whisper, not a bounce */
    /* PROPOSED, the everyday spring: barely-there overshoot over a longer
       arc. Elegant, never abrupt. Reserve the livelier spring for loaders. */
    --motion-easing-spring-soft: cubic-bezier(0.30, 1.05, 0.40, 1);
    /* PROPOSED, hover-lift easing: eases in GENTLY (no abrupt snap), then
       settles with a whisper of overshoot. P1 y=0 gives a soft start; P2
       y=1.18 gives the barely-there bounce. Paired with a longer duration. */
    --motion-easing-burst: cubic-bezier(0.30, 0, 0.5, 1.18);
    /* PROPOSED, sinusoidal ease for ambient/looping motion (loaders,
       shimmer). Loops should breathe, not tick. */
    --motion-easing-breath: cubic-bezier(0.37, 0, 0.63, 1);

    /* Elevation, quiet. Nothing carries shadow weight at rest beyond a
       single faint contact; the violet ambient cast appears only on
       hover/overlay, one soft layer, never stacked. Flips per mode. */
    /* More expressive, MD3-style layered elevation with a tonal purple cast. */
    /* Coherent, subtle, WARM-neutral elevation ladder (rgba 58,50,54 — warm, only
       the faintest purple). Each step a clear increment; nothing gigantic. */
    --spd-elevation-sheet: 0 1px 3px rgba(58,50,54,0.05), 0 10px 30px -16px rgba(58,50,54,0.13);
    --spd-elevation-widget: 0 1px 2px rgba(58,50,54,0.05), 0 2px 6px -2px rgba(58,50,54,0.06);
    --spd-elevation-lift: 0 2px 5px rgba(58,50,54,0.06), 0 6px 16px -6px rgba(58,50,54,0.11);
    --spd-elevation-overlay: 0 4px 10px rgba(58,50,54,0.07), 0 14px 32px -10px rgba(58,50,54,0.15);
  }

  /* ── MIDNIGHT MODE ────────────────────────────────────────────────────────
     Not gray, not slate, not black: every surface is deep brand indigo, so
     the app still reads unmistakably NewCo with the lights off.
     In production these values are a "Midnight" mode on the Figma variable
     collection, sync-tokens emits --semantic-color-midnight-mode-* (same
     mechanism as the 452 dark-mode vars already in tokens.css) and the theme
     switch re-points the aliases. Same names, third value set, zero
     component changes. */
  html[data-spd-mode="midnight"] {
    /* Desaturated throughout, surfaces sit around 20–30% saturation, like a
       grainy long-exposure photo of a summer night sky. Brand hue is felt,
       never loud. */
    /* Midnight, desaturated PURPLE-charcoal paper (brand hue felt, not a warm
       black and not neon indigo). Lifted off pure black so it reads like dark
       paper. B stays highest = the same purple lean as light mode. */
    --semantic-color-light-mode-surface-canvas-light: #29252F;
    --semantic-color-light-mode-surface-nav-light: #29252F;
    --semantic-color-light-mode-surface-sheet-base: #322E3C;
    --spd-search-fill: color-mix(in oklch, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 30%, var(--semantic-color-light-mode-surface-nav-light));
    /* Warm-neutral (never purple) light slate on the dark paper. */
    --spd-navink-idle: #B7B3AB;
    --spd-navink-strong: #F1EFE9;
    --semantic-color-light-mode-surface-widget-header: #443F52;
    --semantic-color-light-mode-surface-widget-base: #3A3645;
    --semantic-color-light-mode-fill-static-neutral-light: #332E45;
    --semantic-color-light-mode-fill-static-neutral-subtle: rgba(170,166,200,0.08);
    --semantic-color-light-mode-fill-static-brand-light: rgba(170,166,200,0.12);
    --semantic-color-light-mode-text-static-primary-base: #ECEAF3;
    --semantic-color-light-mode-text-static-secondary-base: #B5B1C6;
    --semantic-color-light-mode-text-static-secondary-subtle: #837E96;
    --semantic-color-light-mode-text-static-tertiary-base: #6B6680;
    --semantic-color-light-mode-text-static-positive-base: #4BC495;
    --semantic-color-light-mode-fill-static-positive-light: rgba(75,196,149,0.12);
    --semantic-color-light-mode-stroke-static-neutral-light: rgba(170,166,200,0.13);
    --semantic-color-light-mode-stroke-static-neutral-faint: rgba(170,166,200,0.05);
    --semantic-color-light-mode-stroke-action-secondary-inverse-base: rgba(170,166,200,0.24);
    --semantic-color-light-mode-fill-contextual-navitem-hover: rgba(236, 231, 222, 0.07);
    --semantic-color-light-mode-fill-contextual-navitem-active: rgba(170,166,200,0.12);
    --semantic-color-light-mode-text-contextual-navitem-base: #B5B1C6;
    --semantic-color-light-mode-text-contextual-navitem-active: #FFFFFF;
    --semantic-color-light-mode-icon-contextual-navitem-oncolor: var(--primitive-color-purple-950);
    --semantic-color-light-mode-fill-action-primary-base: #9691F5; /* brand light purple on dark */
    --semantic-color-light-mode-fill-action-primary-hover: #ABA6F8;
    --semantic-color-light-mode-text-action-primary-base: #ABA5EC;
    --semantic-color-light-mode-fill-action-secondary-base: rgba(170,166,200,0.10);
    --semantic-color-light-mode-fill-action-secondary-hover: rgba(170,166,200,0.18);
    --semantic-color-light-mode-fill-action-secondary-pressed: rgba(170,166,200,0.26);
    --semantic-color-light-mode-text-action-secondary-base: #D9D6E8;
    --spd-logo-word: #FFFFFF;
    --spd-badge-plum-bg: rgba(200,150,170,0.14);   --spd-badge-plum-fg: #DFB4CE;
    --spd-badge-navy-bg: rgba(150,165,210,0.14);   --spd-badge-navy-fg: #B6C3E6;
    --spd-badge-orchid-bg: rgba(190,155,210,0.14); --spd-badge-orchid-fg: #D3BAE0;
    --spd-badge-teal-bg: rgba(140,190,200,0.13);   --spd-badge-teal-fg: #AFD2D8;
    --spd-badge-amber-bg: rgba(215,180,140,0.13);  --spd-badge-amber-fg: #DBC2A4;
    --spd-badge-positive-bg: rgba(75,196,149,0.13); --spd-badge-positive-fg: #A9DEC6; --spd-badge-positive-dot: #4BC495;
    --spd-badge-rose-bg: rgba(210,150,170,0.13);   --spd-badge-rose-fg: #E0B7C5;
    --spd-badge-role-bg: rgba(170,166,200,0.10); --spd-badge-role-fg: #D9D5EC; --spd-badge-role-stroke: rgba(170,166,200,0.22); --spd-badge-role-dot: #ABA5EC;
    --semantic-color-light-mode-fill-static-accent-amethyst-base: #8F8AD8;
    --semantic-color-light-mode-fill-static-accent-amethyst-light: rgba(170,166,200,0.12);
    --semantic-color-light-mode-fill-static-accent-jade-base: #2FC6B4;
    --semantic-color-light-mode-fill-static-accent-jade-light: rgba(47,198,180,0.14);
    /* Home amethyst ink, light amethyst so it's visible on the dark nav. */
    --spd-home-glyph: #9691F5;
    --spd-home-ink: #9691F5;
    --spd-home-ink-deep: #C9BEF8;
    --semantic-color-light-mode-fill-static-accent-seabreeze-base: #8A8CEA; /* indigo on dark */
    --semantic-color-light-mode-fill-static-accent-seabreeze-light: rgba(138,140,234,0.15);
    --semantic-color-light-mode-fill-static-accent-amber-light: rgba(246,207,70,0.15);
    --semantic-color-light-mode-fill-static-accent-magenta-base: #E070C0; /* vibrant magenta on dark */
    --semantic-color-light-mode-fill-static-accent-magenta-bold: #E79BD2;
    --semantic-color-light-mode-fill-static-accent-magenta-light: rgba(192,107,171,0.13);
    --semantic-color-light-mode-fill-static-accent-sunrise-base: #D69064;
    --semantic-color-light-mode-fill-static-accent-sunrise-light: rgba(214,154,127,0.13);
    --semantic-color-light-mode-fill-static-accent-sunrise-bold: #CE9679;
    --semantic-color-light-mode-fill-static-accent-teal-base: #6FB3BE;
    --semantic-color-light-mode-fill-static-accent-teal-light: rgba(111,179,190,0.12);
    --semantic-color-light-mode-fill-static-accent-mauve-base: #A98BA9;
    --semantic-color-light-mode-fill-static-accent-taupe-base: #918BA0;
    --semantic-color-light-mode-fill-static-accent-navy-base: #7C97D6;
    --semantic-color-light-mode-fill-static-accent-navy-bold: #849FD9;
    /* Midnight: a warm gold (brown-ochre family), bright enough to read on dark. */
    --semantic-color-light-mode-fill-static-accent-amber-base: #E6B44A;
    --semantic-color-light-mode-fill-static-accent-red-base: #E5786D;
    --semantic-color-light-mode-fill-contextual-avatar-base: rgba(207,197,206,0.18);
    --semantic-color-light-mode-text-contextual-avatar-base: #E6E1E8;

    --spd-elevation-sheet: 0 8px 36px -18px rgba(0,0,0,0.40);
    --spd-elevation-widget: 0 1px 2px rgba(0,0,0,0.15);
    --spd-elevation-lift: 0 8px 20px -10px rgba(0,0,0,0.32);
    --spd-elevation-overlay: 0 20px 48px -16px rgba(0,0,0,0.50);
  }
  html[data-spd-mode="midnight"] .spd-topnav { border-bottom-color: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] .spd-topnav__org { background: rgba(170,166,200,0.07); border-color: rgba(170,166,200,0.13); }
  html[data-spd-mode="midnight"] .spd-topnav__org:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  html[data-spd-mode="midnight"] .spd-topnav__iconbtn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  html[data-spd-mode="midnight"] .spd-modnav__search { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 26%, var(--semantic-color-light-mode-surface-nav-light)); }
  html[data-spd-mode="midnight"] .spd-skeleton { background: rgba(170,166,200,0.08); }
  html[data-spd-mode="midnight"] *:hover::-webkit-scrollbar-thumb { background: rgba(170,166,200,0.26); }

  html, body, #root {
    height: 100%;
    background: var(--semantic-color-light-mode-surface-canvas-light);
    font-family: 'Google Sans Flex', ui-sans-serif, system-ui, sans-serif;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    transition: background var(--motion-duration-5) var(--motion-easing-standard),
                color var(--motion-duration-5) var(--motion-easing-standard);
  }

  /* Scrollbars: 3px whisper on BOTH axes (an unstyled horizontal bar is a
     15px plank), thumb only appears on hover. */
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
  ::-webkit-scrollbar-corner { background: transparent; }
  *:hover::-webkit-scrollbar-thumb { background: rgba(41,39,36,0.16); }

  /* Material Symbols Rounded per pathway-ds CLAUDE.md §12: wght 400, GRAD 0,
     opsz 20. Nav items FILL=1 when active (nav-shell-spec §9.2); top-nav FILL=0. */
  .material-symbols-rounded {
    font-variation-settings: 'wght' 400, 'GRAD' 0, 'opsz' 20, 'FILL' 0;
    user-select: none;
    /* Hide ligature text until the icon font is ready, no flash of raw
       icon names on slow connections. */
    visibility: hidden;
  }
  html.spd-fonts-ready .material-symbols-rounded { visibility: visible; }
  .material-symbols-rounded.is-filled {
    font-variation-settings: 'wght' 400, 'GRAD' 0, 'opsz' 20, 'FILL' 1;
  }

  /* ── NewCo brand motion ──────────────────────────────────────────────── */
  @keyframes spd-shimmer { 0% { transform: translate(-42%, 42%); } 100% { transform: translate(42%, -42%); } }
  .spd-skeleton {
    position: relative; overflow: hidden;
    background: var(--primitive-color-warm-300);
    border-radius: 8px;
  }
  /* Collab "thinking": three little rounded bars (echoing the Spired logo
     pieces) that rise in sequence, the brand's ascent motion in miniature. */
  .spd-thinkbars { display: inline-flex; align-items: flex-end; gap: 4px; height: 16px; }
  .spd-thinkbars i {
    width: 8px; height: 6px; border-radius: 3px; display: block;
    background: var(--semantic-color-light-mode-fill-action-primary-base);
    animation: spd-thinkrise 1.15s var(--motion-easing-inout) infinite;
  }
  .spd-thinkbars i:nth-child(2) { animation-delay: 0.14s; }
  .spd-thinkbars i:nth-child(3) { animation-delay: 0.28s; }
  @keyframes spd-thinkrise { 0%, 100% { transform: translateY(0); opacity: 0.45; } 45% { transform: translateY(-7px); opacity: 1; } }
  /* A gentle spin for the mono / two-tone mark used as a loader. */
  .spd-collabspin { transform-box: fill-box; transform-origin: center; animation: spd-halo-cw 3s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spd-thinkbars i, .spd-collabspin { animation: none; } }
  /* Shimmer: a lavender-into-gray light travelling diagonally from bottom-left
     up to top-right. The band is oriented at 45° (perpendicular to its travel)
     so it reads as a diagonal sweep rising, not a vertical wipe. */
  .spd-skeleton::after {
    content: ""; position: absolute; inset: -80%;
    background: linear-gradient(45deg, transparent 40%, rgba(150,145,245,0.22) 47%, rgba(148,144,138,0.14) 53%, transparent 60%);
    animation: spd-shimmer 3.8s var(--motion-easing-breath) infinite;
    animation-delay: -1.6s;
  }

  /* The loading glyph is a little chain of ascending steps. Each bar rises
     with a soft overshoot, as if bumped up by the one below, settles, and
     hangs for a breath at the top. Then the bottom drops first and pulls the
     middle down, the middle the top. Each step up the stack lifts a touch
     higher (--rise), so it reads as steps climbing: a gentle burst of
     inspiration. Subtle throughout. */
  @keyframes spd-drift {
    0%   { transform: translateY(0);                        opacity: 0.3; }
    24%  { transform: translateY(calc(var(--rise) * 1.35)); opacity: 1; }   /* PULLED up past the step (as if from above) */
    38%  { transform: translateY(calc(var(--rise) * 0.86)); opacity: 1; }   /* springs back under, the bounce */
    50%  { transform: translateY(var(--rise));              opacity: 1; }   /* settles onto the step */
    62%  { transform: translateY(var(--rise));              opacity: 1; }   /* holds a breath at the top */
    100% { transform: translateY(0);                        opacity: 0.3; } /* dropped GENTLY back down */
  }
  /* overflow visible so the bars' upward rise isn't clipped by the SVG's
     own viewBox edge */
  .spd-markloader__base { display: block; overflow: visible; }
  .spd-drawbar {
    /* The SAME ascent-and-pull feel as the boot/logo-hover: a smooth sine
       (breath) that lets the keyframe's overshoot read as a soft spring — each
       bar pulled up, bouncing, then dropped gently. NOT the abrupt emphasized. */
    animation: spd-drift 2.3s var(--motion-easing-breath) infinite both;
    will-change: transform, opacity;
  }
  @media (prefers-reduced-motion: reduce) {
    .spd-drawbar { animation: none; transform: none; opacity: 1; }
  }

  /* Ring loader, the mark's DNA (one long, one medium, one short pill)
     arranged in a ring, turning steadily. For buttons and tight spots. */
  .spd-ring { animation: spd-spin 1.4s linear infinite; }

  /* Loading (gradient shimmer) button, the fill itself breathes light. */
  @keyframes spd-btn-shimmer { 0% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
  .spd-btn--shimmering {
    background: linear-gradient(105deg, #6E64BE 0%, #8A80D6 45%, #6E64BE 90%);
    background-size: 220% 100%;
    animation: spd-btn-shimmer 1.9s var(--motion-easing-breath) infinite;
    border: none; color: #FFFFFF;
  }

  /* Press, everything pressable settles slightly while held and eases back
     on release. Quiet, elegant, no theatrics. */
  .spd-pressmark { position: relative; border: none; background: transparent; cursor: pointer; }
  .spd-pressmark__mark { display: inline-flex; transition: transform var(--motion-duration-4) var(--motion-easing-spring-soft); }
  .spd-pressmark:active .spd-pressmark__mark { transform: scale(0.94); transition-duration: var(--motion-duration-1); }
  .spd-topnav__iconbtn:active, .spd-widget__iconbtn:active { transform: scale(0.92); }
  .spd-navitem:active { transform: scale(0.99); }
  .spd-btn:active { transform: scale(0.98); }

  /* Canonical entrance, the gentlest "woop": rises up, drifts a hair past
     its resting spot, then settles. The overshoot lives in the keyframe (like
     the loader's bump) since an easing curve alone barely moves; a smooth
     sine (breath) carries it so it never snaps. Used for every reveal. */
  /* Everything rises in with a WHISPER of buoyancy, a smooth ease-in-out rise
     that barely overshoots and lands with no visible rebound. Felt, not seen. */
  @keyframes spd-fade-up {
    0%   { opacity: 0; transform: translateY(11px); }
    74%  { opacity: 1; transform: translateY(-1.5px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes spd-fade { from { opacity: 0; } to { opacity: 1; } }
  .spd-fade-in { animation: spd-fade-up var(--motion-duration-6) var(--motion-easing-breath) both; }
  .spd-stagger > * { animation: spd-fade-up var(--motion-duration-6) var(--motion-easing-breath) both; }
  .spd-stagger > *:nth-child(1) { animation-delay: 0ms; }
  .spd-stagger > *:nth-child(2) { animation-delay: 40ms; }
  .spd-stagger > *:nth-child(3) { animation-delay: 80ms; }
  .spd-stagger > *:nth-child(4) { animation-delay: 120ms; }
  .spd-stagger > *:nth-child(5) { animation-delay: 160ms; }
  .spd-stagger > *:nth-child(6) { animation-delay: 200ms; }
  .spd-stagger > *:nth-child(7) { animation-delay: 240ms; }
  /* Table rows can't take a transform cleanly (table layout glitches on
     translate), so staggered rows fade only, no rise, no overshoot. */
  .spd-stagger > tr { animation-name: spd-fade; }

  @media (prefers-reduced-motion: reduce) {
    .spd-fade-in, .spd-stagger > *, .spd-loader-bar { animation: none !important; }
    .spd-skeleton::after { animation: none !important; }
  }

  /* ── Boot logo, bespoke full-app load animation (a little story) ──────── */
  .spd-boot {
    height: 100%; display: flex; align-items: center; justify-content: center;
    /* Let the mark assemble, land, and take one calm breath before it fades. */
    animation: spd-boot-out 0.6s var(--motion-easing-standard) 3.1s both;
  }
  /* Settled logo breathes softly (kicks in once the mark AND word have landed). */
  .spd-boot__svg { transform-origin: center; animation: spd-boot-breath 4.2s var(--motion-easing-breath) 2.55s infinite; }
  /* Each stroke rises and stacks into place with a gentle, unhurried woop. */
  .spd-boot-bar {
    opacity: 0;
    animation: spd-boot-rise 1.05s var(--motion-easing-burst) both;
  }
  /* The wordmark whispers in beside the mark ONLY AFTER the full ascent has
     landed (last bar settles ~1.65s), so it reads as two beats: rise, then brand. */
  .spd-boot-word {
    opacity: 0;
    animation: spd-boot-word 0.85s var(--motion-easing-breath) 1.75s both;
  }
  @keyframes spd-boot-rise {
    0%   { opacity: 0; transform: translateY(20px); }
    55%  { opacity: 1; transform: translateY(-4px); }
    78%  { transform: translateY(1.5px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes spd-boot-word {
    0%   { opacity: 0; transform: translateX(9px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes spd-boot-breath {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }
  @keyframes spd-boot-out { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .spd-boot { animation: none; }
    .spd-boot__svg { animation: none; }
    .spd-boot-bar, .spd-boot-word { animation: none; opacity: 1; }
  }

  /* ── Shell ────────────────────────────────────────────────────────────── */
  .spd-shell { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  .spd-topnav {
    height: 60px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 0 30px;
    background: var(--semantic-color-light-mode-surface-nav-light);
    transition: background var(--motion-duration-5) var(--motion-easing-standard),
                padding-left var(--motion-duration-5) var(--motion-easing-inout);
  }
  /* When the module rail is pinned, the logo must crown the RAIL icons (centre
     x≈32) rather than the side-nav glyphs (x≈48); pad-left 14 → logo centre 32.
     Unpinned, it keeps 30 so it still sits over the side-nav glyph. */
  .spd-shell:has(.spd-mrail:not(.is-collapsed)) .spd-topnav { padding-left: 14px; }
  /* Left cluster aligns over the side-nav column: logo + tight waffle/label. */
  /* ── Brand block = ONE control ─────────────────────────────────────────
     The logo, the divider, the module icon, the module name and the chevron
     are a single button: one hover tint across the whole area, one touch
     target, one click that opens the module switcher. The negative margin
     offsets the new padding so the logo stays optically where it was. */
  .spd-topnav__lead {
    display: flex; align-items: center; gap: 3px; min-width: 0;
    appearance: none; -webkit-appearance: none; border: 0;
    font: inherit; color: inherit; text-align: left;
    margin: 0 0 0 -4px; padding: 0 8px 0 4px;
    border-radius: 12px; cursor: pointer; background: transparent;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-topnav__lead:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-topnav__lead.is-active { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-action-primary-base) 14%, transparent); }
  .spd-topnav__lead:focus-visible { outline: 2px solid var(--semantic-color-light-mode-fill-action-primary-base); outline-offset: 2px; }
  /* One tint, not two: the logo keeps its own :hover rule for the standalone
     showcase mark, but must not paint a second box inside the lead. */
  .spd-topnav__lead .spd-topnav__logo:hover { background: transparent; }
  /* Chevron: sits tight against the module name and inherits the module's own
     colour (set inline), so the switcher affordance reads as part of the name
     rather than as separate grey chrome. Flips while the switcher is open. */
  .spd-topnav__leadchev {
    display: inline-flex; align-items: center; flex-shrink: 0; margin-left: -2px;
    transition: transform var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-topnav__lead.is-active .spd-topnav__leadchev { transform: rotate(180deg); }
  /* Pinned to rail: the block keeps its exact appearance but stops behaving
     like a control, because the rail is already the module switcher. */
  .spd-topnav__lead.is-static { cursor: default; }
  /* Toggle + brand block sit together on the left. The group keeps the header
     at two flex children, so space-between still pins the globals right. */
  .spd-topnav__leadgroup { display: flex; align-items: center; gap: 2px; min-width: 0; }
  /* Mobile only: reveal/hide the MODULE'S OWN side nav. Deliberately separate
     from the brand block, which is the module switcher: two components, two
     controls. Hidden on desktop, where the rail collapse does this job. */
  .spd-topnav__navtoggle {
    display: none;
    appearance: none; -webkit-appearance: none; border: 0; margin: 0; padding: 0;
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px;
    align-items: center; justify-content: center;
    background: transparent; cursor: pointer;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-topnav__navtoggle:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-topnav__navtoggle:focus-visible { outline: 2px solid var(--semantic-color-light-mode-fill-action-primary-base); outline-offset: 2px; }
  .spd-topnav__lead.is-static:hover { background: transparent; }
  .spd-topnav__lead.is-static:hover .spd-logobar { animation: none; }
  /* Home: mark + "spired" wordmark tight, so they read as the one Spired logo. */
  .spd-topnav__lead--brand { gap: 4px; }
  .spd-topnav__org {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    border-radius: 12px; background: rgba(255,255,255,0.65);
    border: 0.5px solid rgba(41,39,36,0.12);
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-topnav__org:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-topnav__iconbtn {
    position: relative; width: 34px; height: 34px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard),
                transform var(--motion-duration-3) var(--motion-easing-spring);
  }
  .spd-topnav__iconbtn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-topnav__iconbtn .material-symbols-rounded { font-size: 20px; }

  .spd-body { flex: 1; display: flex; overflow: hidden; padding-top: 16px; }

  /* SideNav: expanded 256px ↔ collapsed 84px rail. A pinned header holds the
     collapse toggle; the nav list scrolls beneath it with an invisible
     (overlay) scrollbar. In the rail, each item stacks its icon over a small
     centred label, the industry-standard rail pattern. */
  .spd-sidenav {
    width: 256px; flex-shrink: 0;
    display: flex; flex-direction: column; overflow: hidden;
    transition: width var(--motion-duration-6) var(--motion-easing-emphasized);
  }
  .spd-sidenav.is-collapsed { width: 84px; }
  .spd-sidenav__header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 6px 20px; gap: 8px;
  }
  .spd-sidenav.is-collapsed .spd-sidenav__header { justify-content: center; padding-left: 14px; padding-right: 14px; }
  .spd-sidenav__module { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .spd-sidenav__module-name {
    font-size: 14px; font-weight: 600; letter-spacing: -0.1px;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spd-sidenav__collapse { flex-shrink: 0; }
  .spd-sidenav__scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 2px 12px 20px 20px;
    scrollbar-width: none; -ms-overflow-style: none;
    transition: padding var(--motion-duration-6) var(--motion-easing-emphasized);
  }
  .spd-sidenav__scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
  .spd-sidenav.is-collapsed .spd-sidenav__scroll { padding-left: 12px; padding-right: 12px; }
  /* Rail item, icon over a small centred label. */
  .spd-sidenav.is-collapsed .spd-navitem { flex-direction: column; height: auto; gap: 5px; padding: 8px 2px; justify-content: center; }
  .spd-sidenav.is-collapsed .spd-navitem__indicator { display: none; }
  .spd-sidenav.is-collapsed .spd-navitem__label {
    flex: none; width: 100%; opacity: 1; font-size: 10px; line-height: 1.15;
    text-align: center; white-space: normal;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .spd-sidenav.is-collapsed .spd-sidenav__section-label { opacity: 0; height: 10px; padding: 8px 0 0; }
  .spd-sidenav__section-label {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    padding: 16px 16px 8px; white-space: nowrap; overflow: hidden;
    transition: opacity var(--motion-duration-4) var(--motion-easing-standard),
                padding var(--motion-duration-6) var(--motion-easing-inout),
                height var(--motion-duration-6) var(--motion-easing-inout);
  }
  .spd-navitem {
    position: relative; width: 100%; display: flex; align-items: center; gap: 11px;
    padding: 7px 10px 7px 14px; height: 42px; border-radius: 999px; /* MD3 pill */
    background: transparent; border: none; cursor: pointer; text-align: left;
    font-family: inherit;
    --spd-navink: var(--spd-navink-idle); /* icon + label ink, darkens on state */
    transition: background var(--motion-duration-2) var(--motion-easing-standard),
                transform var(--motion-duration-3) var(--motion-easing-spring),
                padding var(--motion-duration-5) var(--motion-easing-inout),
                gap var(--motion-duration-5) var(--motion-easing-inout);
  }
  /* Hover = a visible tint of the module/primary colour (the FILL carries the
     colour); the ink itself just steps to the stronger slate, never coloured. */
  /* The fill is mixed with WHITE (not tinted through the warm beige) so the
     colour stays CLEAN and vibrant, a warm beige + a transparent purple would
     mix toward mud/grey (complements), which is why the purple read flat. */
  /* Hover = a plain WARM-NEUTRAL step (never the module tint, on Home the purple
     tint read cool/blue). The active state is what carries colour. */
  .spd-navitem:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); --spd-navink: var(--spd-navink-strong); }
  /* Active = a light BUT vibrant tonal chip. Mixed in OKLCH (not sRGB) so it stays
     chromatic/poppy as it lightens, an sRGB white-mix washes out to grey. Sits
     clearly on the surface + coloured stripe; icon + label are near-black. */
  .spd-navitem.is-active { background: color-mix(in oklch, var(--sel) 20%, #FFFFFF); --spd-navink: var(--spd-navink-strong); }
  /* Midnight: mix over the SOLID surface (not transparent), a transparent tint
     let the dark show through and desaturated the colour to grey. Higher ratios
     over the purple-charcoal paper keep the chip clearly coloured, never grey. */
  html[data-spd-mode="midnight"] .spd-navitem:hover { background: color-mix(in srgb, #FFFFFF 8%, var(--semantic-color-light-mode-surface-nav-light)); }
  html[data-spd-mode="midnight"] .spd-navitem.is-active { background: color-mix(in oklch, var(--sel) 48%, var(--semantic-color-light-mode-surface-nav-light)); }
  .spd-navitem.is-locked { opacity: 0.65; }
  /* Stripe breaks out of the 12px content inset to sit flush at the screen's
     left edge (x=0); the item's own rounded container stays inset. -12px lands
     exactly on the list's overflow clip edge, so it shows without being cut. */
  .spd-navitem__indicator {
    position: absolute; left: -20px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 24px; border-radius: 0 5px 5px 0;
    background: var(--sel);
  }
  .spd-navitem__glyph {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
  }
  .spd-navitem__glyph--ring { border-radius: 8px; }
  .spd-navitem__glyph .material-symbols-rounded { font-size: 19px; }
  /* Still used by the Component-States showcase + a couple of icon tiles. */
  .spd-navitem__chip {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .spd-navitem__chip .material-symbols-rounded { font-size: 16px; }
  .spd-navitem__label {
    flex: 1; font-size: 12px; font-weight: 500;
    color: var(--spd-navink); /* slate, steps to strong slate on hover/active */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--motion-duration-2) var(--motion-easing-standard),
                opacity var(--motion-duration-3) var(--motion-easing-standard),
                flex var(--motion-duration-6) var(--motion-easing-inout);
  }
  /* Active label = the strong slate + heavier weight → clearly the most
     prominent row, without the text ever taking the module colour. */
  .spd-navitem.is-active .spd-navitem__label { font-weight: 600; }

  /* ── Logo = hide/reveal the side nav. On hover the three bars replay their
        assembling motion (bottom→top, the loading bump), NOT a scale. ───── */
  .spd-topnav__logo {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 10px; padding: 0; flex-shrink: 0;
    background: transparent; border: none; cursor: pointer;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  /* Thin divider separating the logo from the module switcher. */
  .spd-topnav__leadsep {
    width: 1px; height: 20px; flex-shrink: 0; margin: 0 2px;
    background: var(--semantic-color-light-mode-stroke-static-neutral-light);
  }
  .spd-topnav__logo:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-topnav__logo-mark { display: inline-flex; align-items: center; justify-content: center; }
  /* LOGO_MARK_PATHS order is bottom, middle, top, so nth-child(1) rises first. */
  .spd-topnav__logo:hover .spd-logobar { animation: spd-boot-rise 0.58s cubic-bezier(0.22, 0.85, 0.3, 1) both; }
  .spd-topnav__logo:hover .spd-logobar:nth-child(1) { animation-delay: 0s; }
  .spd-topnav__logo:hover .spd-logobar:nth-child(2) { animation-delay: 0.085s; }
  .spd-topnav__logo:hover .spd-logobar:nth-child(3) { animation-delay: 0.17s; }
  /* Same ascent, triggered from anywhere in the unified brand block. */
  .spd-topnav__lead:hover .spd-logobar { animation: spd-boot-rise 0.58s cubic-bezier(0.22, 0.85, 0.3, 1) both; }
  .spd-topnav__lead:hover .spd-logobar:nth-child(1) { animation-delay: 0s; }
  .spd-topnav__lead:hover .spd-logobar:nth-child(2) { animation-delay: 0.085s; }
  .spd-topnav__lead:hover .spd-logobar:nth-child(3) { animation-delay: 0.17s; }
  @media (prefers-reduced-motion: reduce) { .spd-topnav__logo:hover .spd-logobar { animation: none; } }
  @media (prefers-reduced-motion: reduce) { .spd-topnav__lead:hover .spd-logobar { animation: none; } }

  /* ── Module section nav, the single side nav (current module's own). The
     header + footer are fixed; the list between them scrolls. ───────────── */
  .spd-modnav {
    width: 264px; flex-shrink: 0; display: flex; flex-direction: column;
    padding: 20px 20px 16px 0; overflow: hidden;
    /* Panel left padding stays 0 so ONLY the active stripe can reach the screen
       edge; the item/group/footer CONTENT is inset 20px by their own padding. */
    transition: width var(--motion-duration-6) var(--motion-easing-inout),
                opacity var(--motion-duration-4) var(--motion-easing-standard);
  }
  .spd-modnav__list {
    display: flex; flex-direction: column; gap: 5px;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding-left: 20px; /* insets the items; the stripe breaks back out to x=0 */
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .spd-modnav__list::-webkit-scrollbar { width: 0; height: 0; display: none; }
  /* Pinned account-settings footer, opaque (canvas) so the list scrolls
     behind it, with a hairline to signal there's more above. */
  .spd-modnav__foot {
    flex-shrink: 0; display: flex; flex-direction: column; gap: 5px;
    margin: 4px -20px 0 0; padding: 6px 20px 0 20px;
    background: var(--semantic-color-light-mode-surface-canvas-light);
    border-top: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-faint);
  }
  .spd-modnav__foot-label { padding-top: 10px; }
  /* Side nav hidden via the logo toggle, animated collapse (not display:none). */
  .spd-body.is-nav-hidden .spd-modnav {
    width: 0; opacity: 0; padding-left: 0; padding-right: 0; pointer-events: none;
  }

  /* Header: search + collapse control. padding-left 29 so the search icon centres
     at the same x (48) as the nav glyphs below it. */
  .spd-modnav__header {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 10px 16px 29px; margin-bottom: 14px;
    border-bottom: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-faint);
  }
  /* Idle: a rounded SQUARE, icon only. On focus it expands into a working field
     (you can type). Shared mauve fill. */
  .spd-modnav__search {
    flex: none; width: 38px; height: 38px; min-width: 0; padding: 0; border-radius: 12px; border: none;
    display: flex; align-items: center; justify-content: center; gap: 0; overflow: hidden;
    background: var(--spd-search-fill); box-shadow: none; cursor: text;
    transition: width var(--motion-duration-4) var(--motion-easing-inout),
                padding var(--motion-duration-4) var(--motion-easing-inout),
                box-shadow var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-modnav__search:hover { background: color-mix(in oklch, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 24%, #FFFFFF); }
  .spd-modnav__search:focus-within {
    width: 178px; justify-content: flex-start; padding: 0 11px; gap: 9px;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 38%, #FFFFFF);
  }
  /* People / in-content table search: a white surface with a hairline neutral
     stroke (the same one the cards use), and a clear focused state (primary
     ring). Midnight resolves the same tokens to its own dark surface. */
  .spd-tablesearch {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 14px; border-radius: 14px;
    background: var(--semantic-color-light-mode-fill-static-neutral-light);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: none;
    transition: box-shadow var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-tablesearch:focus-within {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--semantic-color-light-mode-fill-action-primary-base) 55%, transparent);
  }
  /* Idle the input is collapsed (width 0); it grows in when the square is focused. */
  .spd-modnav__search input {
    width: 0; flex: 0 1 auto; min-width: 0; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13.5px; color: var(--semantic-color-light-mode-text-static-primary-base);
    transition: width var(--motion-duration-4) var(--motion-easing-inout);
  }
  .spd-modnav__search:focus-within input { width: auto; flex: 1; }
  .spd-modnav__search input::placeholder { color: var(--semantic-color-light-mode-text-static-secondary-subtle); }
  .spd-modnav__search-clear {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 6px; border: none; cursor: pointer;
    background: transparent; color: var(--semantic-color-light-mode-text-static-tertiary-base);
  }
  .spd-modnav__search-clear:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }

  /* Accounting-only: a PLAIN little search icon (no fill, not featured) sitting
     to the left of the collapse toggle. Tapping it opens the field. */
  .spd-modnav__searchbtn {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    background: transparent; color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard),
                color var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-modnav__searchbtn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); color: var(--semantic-color-light-mode-text-static-primary-base); }
  /* Open: the field takes over the whole header row (app switcher steps aside),
     with a working input and a close (X) to collapse it back. */
  .spd-modnav__search--fill {
    flex: 1; width: auto; min-width: 0; height: 38px; padding: 0 8px 0 12px; gap: 9px;
    justify-content: flex-start; border-radius: 12px; cursor: text; overflow: hidden;
    background: var(--spd-search-fill);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--semantic-color-light-mode-fill-static-accent-mauve-base) 38%, #FFFFFF);
  }
  .spd-modnav__search--fill input { width: auto; flex: 1; }

  /* Accounting header: app switcher (flex 1) + search + collapse, all inline. */
  .spd-modnav__header--acct { justify-content: flex-start; padding-left: 20px; }
  /* Accounting secondary app switcher — an INLINE header control, NOT a floating
     white card (that's the context bar). Subtle warm fill + hairline, no shadow. */
  .spd-acctapp { position: relative; flex: 1; min-width: 0; }
  .spd-acctapp__btn {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 38px; padding: 0 8px 0 6px;
    border-radius: 11px; border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    background: var(--primitive-color-warm-100); cursor: pointer; font-family: inherit;
    /* Buttons do not inherit colour from their parent, so the chevron would
       fall back to the UA black and vanish on the Midnight surface. */
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-acctapp__btn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-acctapp__glyph { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in oklch, var(--semantic-color-light-mode-fill-static-accent-amber-base) 18%, #FFFFFF); color: var(--semantic-color-light-mode-fill-static-accent-amber-base); }
  .spd-acctapp__name { flex: 1; text-align: left; font-size: 12.5px; font-weight: 600; color: var(--semantic-color-light-mode-text-static-primary-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spd-acctapp__menu, .spd-acctctx__menu { position: absolute; z-index: 40; background: var(--semantic-color-light-mode-surface-widget-base); border-radius: 12px; box-shadow: var(--spd-elevation-overlay); padding: 6px; border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light); }
  .spd-acctapp__menu { top: 46px; left: 0; min-width: 210px; }
  .spd-acctapp__cap { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--semantic-color-light-mode-text-static-tertiary-base); padding: 5px 8px 6px; }
  .spd-acctapp__opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--semantic-color-light-mode-text-static-secondary-base); text-align: left; white-space: nowrap; }
  .spd-acctapp__opt:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-acctapp__opt.is-active { color: var(--semantic-color-light-mode-text-static-primary-base); font-weight: 600; }
  /* ── Midnight: the Accounting app switcher was built on light-only values —
        a warm-100 pill and a chip mixed toward #FFFFFF — so on the dark nav
        surface it rendered as a near-white blob carrying near-white text.
        These mix toward `transparent` rather than a surface token, so they sit
        correctly on whatever dark surface each version resolves. The hover
        rule is repeated here because the mode-scoped base outranks the plain
        `:hover` and would otherwise swallow it. Light mode is unchanged. ── */
  html[data-spd-mode="midnight"] .spd-acctapp__btn { background: color-mix(in srgb, #FFFFFF 7%, transparent); }
  html[data-spd-mode="midnight"] .spd-acctapp__btn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  html[data-spd-mode="midnight"] .spd-acctapp__glyph { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-static-accent-amber-base) 24%, transparent); }

  /* Accounting context toolbar (top-right of the page) — elevated (lift), each
     item a switchable dropdown (company / fiscal period / bank account). */
  .spd-acctctx { display: inline-flex; align-items: center; height: 48px; padding: 0 4px; border-radius: 13px; background: var(--semantic-color-light-mode-surface-widget-base); box-shadow: var(--spd-elevation-lift); border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light); }
  .spd-acctctx__item { position: relative; }
  .spd-acctctx__btn { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 9px; border: none; background: transparent; cursor: pointer; font-family: inherit; color: var(--semantic-color-light-mode-text-static-secondary-base); transition: background var(--motion-duration-2) var(--motion-easing-standard); }
  .spd-acctctx__btn:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-acctctx__stack { display: flex; flex-direction: column; gap: 1px; text-align: left; }
  .spd-acctctx__lbl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; color: var(--semantic-color-light-mode-text-static-tertiary-base); }
  .spd-acctctx__val { font-size: 12.5px; font-weight: 500; color: var(--semantic-color-light-mode-text-static-secondary-base); white-space: nowrap; }
  .spd-acctctx__val.is-co { font-size: 13px; font-weight: 600; color: var(--semantic-color-light-mode-text-static-primary-base); }
  .spd-acctctx__sep { width: 1px; height: 26px; background: var(--semantic-color-light-mode-stroke-static-neutral-light); margin: 0 2px; flex-shrink: 0; }
  .spd-acctctx__menu { top: 46px; min-width: 220px; }
  .spd-acctctx__item:last-child .spd-acctctx__menu { right: 0; left: auto; }
  .spd-modnav__empty {
    font-size: 12.5px; color: var(--semantic-color-light-mode-text-static-tertiary-base);
    padding: 10px 14px;
  }
  .spd-modnav__collapse {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 10px;
    background: transparent; border: none; cursor: pointer;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-modnav__collapse:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }

  /* ── Rail state, icon over a small centred label (not icon-only) ── */
  .spd-modnav.is-rail { width: 82px; padding-left: 8px; padding-right: 8px; }
  .spd-modnav.is-rail .spd-modnav__list { padding-left: 0; }
  .spd-modnav.is-rail .spd-modnav__header { justify-content: center; padding-left: 4px; }
  .spd-modnav.is-rail .spd-navitem { flex-direction: column; height: auto; gap: 5px; padding: 9px 2px; justify-content: center; text-align: center; }
  /* Keep the selection stripe in rail mode too (Jo), at the panel's left edge. */
  .spd-modnav.is-rail .spd-navitem__indicator { display: block; left: -8px; }
  /* Railed side nav = the same MD3 icon-rail model as the module rail: the fill
     lives on the ICON as a fully-rounded rectangle (stadium), never the whole
     column (which would render as a circle). */
  .spd-modnav.is-rail .spd-navitem:hover,
  .spd-modnav.is-rail .spd-navitem.is-active { background: transparent; }
  .spd-modnav.is-rail .spd-navitem__glyph {
    width: 44px; height: 32px; border-radius: 999px;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-modnav.is-rail .spd-navitem:hover .spd-navitem__glyph { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-modnav.is-rail .spd-navitem.is-active .spd-navitem__glyph { background: color-mix(in oklch, var(--sel) 20%, #FFFFFF); }
  html[data-spd-mode="midnight"] .spd-modnav.is-rail .spd-navitem:hover .spd-navitem__glyph { background: color-mix(in srgb, #FFFFFF 8%, var(--semantic-color-light-mode-surface-nav-light)); }
  html[data-spd-mode="midnight"] .spd-modnav.is-rail .spd-navitem.is-active .spd-navitem__glyph { background: color-mix(in oklch, var(--sel) 48%, var(--semantic-color-light-mode-surface-nav-light)); }
  .spd-modnav.is-rail .spd-navitem__label {
    flex: none; width: 100%; opacity: 1; font-size: 11px; line-height: 1.2; text-align: center;
    white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .spd-modnav.is-rail .spd-navitem > .material-symbols-rounded { display: none; } /* trailing → (direct child only, not the chip icon) */
  .spd-modnav.is-rail .spd-modnav__group { height: 8px; padding: 12px 0 0; overflow: hidden; color: transparent; }
  .spd-modnav.is-rail .spd-modnav__foot { margin-left: -8px; margin-right: -8px; padding-left: 8px; padding-right: 8px; }
  .spd-modnav__group {
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    padding: 18px 12px 6px 14px;
  }
  .spd-modnav__group:first-child { padding-top: 4px; }

  /* ── Module switcher, the module logo + name IS the trigger (opens the
        module menu). No separate waffle. ─────────────────────────────────── */
  .spd-tms { position: relative; display: flex; align-items: center; }
  .spd-tms__trigger {
    display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px 0 6px;
    border-radius: 10px; background: transparent; border: none; cursor: pointer;
    font-family: inherit; max-width: 240px;
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-tms__trigger:hover, .spd-tms__trigger.is-open { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  /* Current-module label. Part of the unified brand-block button above, so
     it carries no hover or cursor of its own. */
  .spd-tms__current {
    display: flex; align-items: center; gap: 5px; height: 38px; padding: 0 10px 0 2px;
    max-width: 240px; user-select: none;
  }
  /* Module app-tile, light tint fill + solid colour glyph. Squared. */
  .spd-tms__badge {
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .spd-tms__chip {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .spd-tms__chip {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .spd-tms__name {
    font-size: 15px; font-weight: 600; letter-spacing: -0.1px;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spd-tms__menu {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 60;
    width: 268px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-tms__menuhead {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base);
    padding: 8px 10px 6px;
  }
  .spd-tms__opt {
    width: 100%; display: flex; align-items: center; gap: 11px; padding: 8px 10px;
    border-radius: 11px; background: transparent; border: none; cursor: pointer;
    text-align: left; font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--semantic-color-light-mode-text-static-primary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-tms__opt:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-tms__opt.is-current { background: var(--semantic-color-light-mode-fill-contextual-navitem-active); }
  .spd-tms__tag {
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 6px; margin-left: 8px;
    /* DARK brand gradient (amethyst → magenta) with white text, readable in
       both modes, still a little pop. */
    background: linear-gradient(116deg, #5E54AC 0%, #93276F 100%);
    color: #FFFFFF;
  }

  /* Logo active (switcher popover open, or pinned rail shown) */
  .spd-topnav__logo.is-active { background: color-mix(in srgb, var(--semantic-color-light-mode-fill-action-primary-base) 14%, transparent); }

  /* ── Switcher popover (opened from the logo, unpinned) ── */
  .spd-swpop {
    position: fixed; top: 56px; left: 14px; z-index: 65;
    width: 284px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-swpop__head { display: flex; align-items: center; justify-content: space-between; padding: 5px 5px 7px 10px; }
  .spd-swpop__title {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base);
  }
  .spd-swpop__pin {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 9px;
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 600; color: var(--semantic-color-light-mode-fill-action-primary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-swpop__pin:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-swpop__pin.is-unpin { color: var(--semantic-color-light-mode-text-static-secondary-base); }
  .spd-swpop__pin.is-unpin:hover { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-swpop__list { display: flex; flex-direction: column; gap: 1px; }

  /* ── Pinned module rail (far left). Collapsed = icon rail; hover expands it
       as an overlay to reveal labels, no layout shift. ── */
  .spd-mrail {
    position: relative; flex: 0 0 64px; width: 64px; z-index: 30;
    /* Pin/unpin (and reveal/hide) animate: the slot opens/closes and the panel
       slides in/out with it, never an instant pop. */
    transition: flex-basis var(--motion-duration-5) var(--motion-easing-inout),
                width var(--motion-duration-5) var(--motion-easing-inout);
  }
  .spd-mrail.is-collapsed { flex-basis: 0; width: 0; pointer-events: none; }
  .spd-mrail__inner {
    position: absolute; top: 0; left: 0; bottom: 0; width: 64px;
    display: flex; flex-direction: column; padding: 6px 8px 10px 0;
    background: var(--semantic-color-light-mode-surface-nav-light);
    /* A distinct surface from the section nav beside it: a divider + a slight
       right-edge elevation so the rail reads as its own raised layer. */
    border-right: 1px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: 3px 0 10px -7px rgba(41, 39, 36, 0.16);
    overflow: hidden;
    transition: width var(--motion-duration-5) var(--motion-easing-inout),
                box-shadow var(--motion-duration-4) var(--motion-easing-standard),
                transform var(--motion-duration-5) var(--motion-easing-inout),
                opacity var(--motion-duration-4) var(--motion-easing-standard);
  }
  .spd-mrail.is-collapsed .spd-mrail__inner { transform: translateX(-100%); opacity: 0; }
  html[data-spd-mode="midnight"] .spd-mrail__inner { box-shadow: 3px 0 12px -6px rgba(0, 0, 0, 0.45); }
  /* Expand is driven by JS state (is-expanded), NOT CSS :hover/:focus-within,      deterministic so it always collapses after a pick or on mouse-out. */
  .spd-mrail.is-expanded .spd-mrail__inner {
    width: 244px; box-shadow: var(--spd-elevation-sheet); /* wide enough for the longest name + Demo tag (no clip) */
  }
  .spd-mrail__scroll { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; padding-left: 8px; }
  .spd-mrail__item, .spd-mrail__unpin {
    position: relative; display: flex; align-items: center; gap: 11px; height: 44px;
    padding: 0 8px 0 2px; background: transparent; border: none;
    cursor: pointer; font-family: inherit; text-align: left; flex-shrink: 0;
  }
  /* MD3 nav-rail model: the fill/hover live on the ICON as a fully-rounded-corner
     RECTANGLE (a stadium, wider than tall, never a circle, never the whole row).
     Colour mixed with WHITE so it stays clean, never grey. */
  .spd-mrail__item:hover .spd-mrail__badge { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  .spd-mrail__unpin:hover .spd-mrail__badge { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  html[data-spd-mode="midnight"] .spd-mrail__item:hover .spd-mrail__badge { background: color-mix(in srgb, #FFFFFF 7%, transparent); }
  html[data-spd-mode="midnight"] .spd-mrail__unpin:hover .spd-mrail__badge { background: var(--semantic-color-light-mode-fill-contextual-navitem-hover); }
  /* No tile, a transparent slot that just centres the module glyph (sized to
     match the top-nav module glyph). */
  /* Stadium (44×32, fully-rounded corners = rectangle wider than tall, MD3). */
  .spd-mrail__badge {
    width: 44px; height: 32px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    transition: background var(--motion-duration-2) var(--motion-easing-standard);
  }
  .spd-mrail__label {
    font-size: 12.5px; font-weight: 500; letter-spacing: -0.05px; white-space: nowrap;
    color: var(--semantic-color-light-mode-text-static-secondary-base);
    /* Labels fade in just after the panel begins widening, so it reads as one
       sequenced gesture rather than everything moving at once. */
    opacity: 0; transition: opacity var(--motion-duration-3) var(--motion-easing-standard) 70ms;
  }
  .spd-mrail.is-expanded .spd-mrail__label { opacity: 1; }
  /* Active = the clean tonal stadium behind the icon + the stripe. Only the icon
     carries the fill (never the whole row), so it stays a rounded rectangle. */
  .spd-mrail__item.is-active .spd-mrail__badge { background: color-mix(in oklch, var(--sel) 20%, #FFFFFF); }
  html[data-spd-mode="midnight"] .spd-mrail__item.is-active .spd-mrail__badge { background: color-mix(in oklch, var(--sel) 48%, var(--semantic-color-light-mode-surface-nav-light)); }
  .spd-mrail__item.is-active .spd-mrail__label { color: color-mix(in srgb, var(--sel) 58%, var(--semantic-color-light-mode-text-static-primary-base)); font-weight: 600; }
  /* Selection stripe = the MODULE's own colour (matches its glyph, never a
     mismatched purple), flush to the rail's left edge. The -8px breakout lands
     on the scroll's clip edge so it shows without clipping. */
  .spd-mrail__indicator {
    position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
    width: 5px; height: 24px; border-radius: 0 5px 5px 0;
    background: var(--sel);
  }
  .spd-mrail__unpin { margin: 4px 0 0 8px; }
  .spd-mrail__unpin .spd-mrail__badge { color: var(--semantic-color-light-mode-text-static-tertiary-base); }
  .spd-mrail__unpin .spd-mrail__label { color: var(--semantic-color-light-mode-text-static-secondary-base); }
  @media (max-width: 768px) { .spd-mrail { display: none; } }

  .spd-topnav__brandsep {
    width: 1px; height: 22px; flex-shrink: 0;
    background: var(--semantic-color-light-mode-stroke-static-neutral-light);
  }
  .spd-topnav__orgname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .spd-topnav__hamburger { display: none; }

  /* ── Account menu, NewCo-level settings/admin live here (not the side nav) */
  .spd-acct { position: relative; margin-left: 6px; }
  .spd-acct__avatar {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 11px; font-weight: 600;
    background: var(--semantic-color-light-mode-fill-contextual-avatar-base);
    color: var(--semantic-color-light-mode-text-contextual-avatar-base);
    transition: transform var(--motion-duration-3) var(--motion-easing-spring);
  }
  .spd-acct__avatar:active { transform: scale(0.94); }
  .spd-acct__avatar--lg { width: 38px; height: 38px; font-size: 13px; }
  .spd-acct__menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
    width: 256px; padding: 7px; border-radius: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    box-shadow: var(--spd-elevation-sheet);
  }
  .spd-acct__id { display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px; }
  .spd-acct__name { display: block; font-size: 13.5px; font-weight: 600; color: var(--semantic-color-light-mode-text-static-primary-base); }
  .spd-acct__sub { display: block; font-size: 12px; color: var(--semantic-color-light-mode-text-static-tertiary-base); margin-top: 1px; }
  .spd-acct__sep { height: 0.5px; background: var(--semantic-color-light-mode-stroke-static-neutral-light); margin: 6px 4px; }
  .spd-acct__cap {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--semantic-color-light-mode-text-static-tertiary-base); padding: 4px 10px 4px;
  }

  /* Mobile drawer, modules + current sections in one sheet. */
  .spd-drawer {
    position: fixed; top: 60px; left: 0; bottom: 0; z-index: 50; width: 280px;
    display: flex; flex-direction: column; gap: 4px; padding: 16px 12px 20px;
    overflow-y: auto; background: var(--semantic-color-light-mode-surface-nav-light);
    border-right: 0.5px solid var(--semantic-color-light-mode-stroke-static-neutral-light);
    transform: translateX(-102%);
    transition: transform var(--motion-duration-6) var(--motion-easing-emphasized);
  }
  .spd-drawer.is-open { transform: translateX(0); box-shadow: 0 24px 60px -20px rgba(20,18,30,0.4); }

  /* Giving Overview stat row. */
  .spd-giving-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  /* Mobile drawer scrim (hidden until the rail opens on small screens).
     NOTE: distinct class from the dialog backdrop .spd-scrim, reusing that
     name pulled in its fade-to-opacity:1 animation and veiled the whole app. */
  /* Starts BELOW the 60px top bar (same edge as the drawer) so the bar is
     never dimmed: the sidebar toggle stays lit and tappable, and is the
     obvious way to close the nav again. */
  .spd-navscrim {
    position: fixed; top: 60px; right: 0; bottom: 0; left: 0; z-index: 40; background: rgba(20,18,30,0.34);
    opacity: 0; pointer-events: none;
    transition: opacity var(--motion-duration-4) var(--motion-easing-standard);
  }
  .spd-navscrim.is-open { opacity: 1; pointer-events: auto; }

  /* The content sheet, rounded top corners, flush right/bottom (Figma
     40006833-27620). Depth from one luminance step + soft ambient shadow. */
  .spd-sheet {
    flex: 1; display: flex; overflow: hidden; position: relative; margin-right: 16px;
    background: var(--semantic-color-light-mode-surface-sheet-base);
    border-radius: var(--semantic-layout-units-contextual-sheet-cornerradius) var(--semantic-layout-units-contextual-sheet-cornerradius) 0 0;
    box-shadow: var(--spd-elevation-sheet);
    transition: background var(--motion-duration-5) var(--motion-easing-standard);
  }
  .spd-modload { flex: 1; display: flex; align-items: center; justify-content: center; }
  .spd-page { flex: 1; overflow: auto; }
  .spd-page__inner {
    padding: var(--semantic-layout-units-contextual-page-padding-top)
             var(--semantic-layout-units-contextual-page-padding-horizontal)
             var(--semantic-layout-units-contextual-page-padding-bottom);
    max-width: 1720px; margin: 0 auto;
  }

  /* Responsive safety net: this is a desktop-product concept. Rather than let
     a narrow preview panel crush the sheet to a sliver, keep a sensible
     minimum and scroll horizontally below it. */
  .spd-body { min-width: 0; }
  .spd-sheet { min-width: 560px; }

  /* ── Mobile: the logo opens a drawer; side nav + switcher fold away ────── */
  @media (max-width: 768px) {
    .spd-topnav { padding: 0 14px; }
    /* Keep the bar breathable: the two least-essential globals fold away. */
    .spd-topnav [aria-label="Search"], .spd-topnav [aria-label="Help"] { display: none; }
    .spd-topnav__orgname { max-width: 150px; }

    /* Side nav + top-bar switcher give way to the drawer. */
    .spd-modnav, .spd-tms, .spd-topnav__brandsep { display: none; }
    /* The side nav moves into the drawer, so its toggle appears in the bar. */
