// ─── QB LIVE FILTERING ───────────────────────────────────────────────────────
// Maps QB field IDs to column indices in FA_REPORT_RESULTS["fa-custom-query"]
const QB_FIELD_COL_MAP = { tag: 0, name: 1, class: 2, building: 3, room: 4, capValue: 5, bookNet: 6 };

function evalQbCriterion(row, cr) {
  const colIdx = QB_FIELD_COL_MAP[cr.fieldId];
  if (colIdx === undefined) return true; // unmapped field — treat as always passing
  const raw = (row[colIdx] || '').toString();
  const cell = raw.toLowerCase();
  const val = (cr.value || '').toString().toLowerCase().trim();
  if (cr.type === 'boolean') return cr.value === 'Yes'; // all preview rows are active assets
  if (cr.type === 'select') return !val || val === 'all' || cell.includes(val);
  if (cr.type === 'number') {
    const n = parseFloat(raw.replace(/[$,]/g, '')), v = parseFloat(val.replace(/[$,]/g, ''));
    if (isNaN(n) || isNaN(v)) return true;
    if (cr.op === 'equals') return n === v;
    if (cr.op === 'greater than') return n > v;
    if (cr.op === 'less than') return n < v;
    return true;
  }
  if (!val) return true; // empty text filter — match everything
  if (cr.op === 'equals') return cell === val;
  if (cr.op === 'starts with') return cell.startsWith(val);
  if (cr.op === 'is empty') return cell === '';
  return cell.includes(val); // default: contains
}

function applyQbFilters(rows, criteria, logicOps, groups, groupLogics) {
  if (!criteria || criteria.length === 0) return rows;
  const activeGroups = groups.filter(g => criteria.some(cr => cr.groupId === g.id));
  if (activeGroups.length === 0) return rows;
  return rows.filter(row => {
    const groupPasses = activeGroups.map(grp => {
      const gCrit = criteria.filter(cr => cr.groupId === grp.id);
      let res = null;
      for (let i = 0; i < gCrit.length; i++) {
        const cr = gCrit[i];
        const match = evalQbCriterion(row, cr);
        if (res === null) res = match;
        else { const op = logicOps[cr.id] || 'and'; res = op === 'and' ? res && match : res || match; }
      }
      return res ?? true;
    });
    if (groupPasses.length === 0) return true;
    let final = groupPasses[0];
    activeGroups.forEach((grp, gi) => { if (gi === 0) return; const op = groupLogics[grp.id] || 'and'; final = op === 'and' ? final && groupPasses[gi] : final || groupPasses[gi]; });
    return final;
  });
}

            <div style={{ background: c.white, borderRadius: 12, padding: 24, maxWidth: 400, width: "90%", boxShadow: "0 8px 32px rgba(0,0,0,0.15)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <div style={{ width: 36, height: 36, borderRadius: 8, background: c.amberLight, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><AlertIcon size={18} style={{ color: c.amber }} /></div>
                <div style={{ fontSize: 15, fontWeight: 700, color: c.text }}>You haven't shared this report</div>
              </div>
              <div style={{ fontSize: 13, color: c.textSec, marginBottom: 20, lineHeight: 1.6 }}>
                This report hasn't been downloaded or emailed yet. If you leave now, the results will be lost and you'll need to run it again.
              </div>
              <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
                <Btn variant="secondary" size="sm" onClick={() => setShowUnsavedReportWarning(false)}>Go back</Btn>
                <Btn size="sm" style={{ background: c.red, color: "#fff" }} onClick={confirmUnsavedAction}>Leave anyway</Btn>
              </div>
            </div>
          </div>
        )}

        {/* Modal header — hidden when viewing/editing a query one level deep */}
        {!queryBuilderOpen && <div style={{ background: c.white, borderBottom: `1px solid ${c.border}`, padding: "0 20px", height: 52, display: "flex", alignItems: "center", gap: 14, flexShrink: 0 }}>
          <button onClick={handleClose} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: c.textSec, cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: 500, padding: "6px 0" }}><XIcon size={16} /> Close</button>
          {reportRan && !isHistoryCompleted && (<>
            <div style={{ width: 1, height: 24, background: c.border }} />
            <button onClick={handleEditConfig} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: `1px solid ${c.border}`, borderRadius: 6, color: c.textSec, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 500, padding: "5px 10px" }}><ArrowLeft size={13} /> Edit Configuration</button>
          </>)}
          <div style={{ width: 1, height: 24, background: c.border }} />
          <div style={{ fontSize: 15, fontWeight: 700, color: c.text }}>{savedConfigName || reportObj.name}</div>
          {savedConfigName && <Tag color="purple" style={{ fontSize: 11 }}><FileTextIcon size={10} style={{ marginRight: 2 }} />{reportObj.name}</Tag>}
          {isSelectionReport && slSelectedConfigs.size > 0 && <Tag color="default" style={{ fontSize: 11 }}>{slSelectedConfigs.size} quer{slSelectedConfigs.size === 1 ? "y" : "ies"} selected</Tag>}
          <div style={{ marginLeft: "auto", display: "flex", gap: 6, alignItems: "center" }}>
            {isHistoryProcessing ? (<>
              {/* History: processing — show animated badge + cancel */}
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 500, background: c.amberLight, color: c.amber, border: `1px solid ${c.amberBorder}` }}><Spinner size={12} color={c.amber} />Processing…</span>
              <button onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: c.red, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 500, padding: "5px 8px" }}><XIcon size={12} /> Cancel</button>
            </>) : isHistoryFailed ? (<>
              {/* History: failed — show error badge + retry */}
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 500, background: c.redLight, color: c.red, border: `1px solid #fca5a5` }}><AlertIcon size={12} />Failed</span>
              <Btn variant="secondary" size="sm" onClick={handleRunReport} icon={<RefreshIcon size={12} />}>Retry</Btn>
            </>) : isHistoryCompleted || reportRan ? (<>
              {/* Completed report (from history or just ran): Share & Export is the primary CTA */}
              <div style={{ position: "relative" }}>
                <Btn size="sm" onClick={() => { setShareMenuOpen(!shareMenuOpen); setMoreMenuOpen(false); }} icon={<ShareIcon size={13} />}>Share & Export</Btn>
                {shareMenuOpen && (
                  <div style={{ position: "absolute", right: 0, top: "calc(100% + 4px)", background: c.white, border: `1px solid ${c.border}`, borderRadius: 8, boxShadow: "0 4px 16px rgba(0,0,0,0.1)", zIndex: 10, minWidth: 220, overflow: "hidden" }}>
                    {[
                      !isHistoryCompleted && { label: "Save configuration", icon: <BookmarkIcon size={13} />, action: () => { setShareMenuOpen(false); if (!saveConfigName) setSaveConfigName(reportTitle); togglePanel("saveConfig"); } },
                      !isHistoryCompleted && { label: "Schedule report", icon: <ClockIcon size={13} />, action: () => { setShareMenuOpen(false); setMoreMenuOpen(false); togglePanel("schedule"); } },
                      !isHistoryCompleted && { divider: true },
                      { label: "Email report", icon: <MailIcon size={13} />, action: () => { setShareMenuOpen(false); setExportFormat("PDF"); setExportDone(true); } },
                      { divider: true },
                      { label: "Download as PDF", icon: <DownloadIcon size={13} />, action: () => { setExportFormat("PDF"); setShareMenuOpen(false); setExportDone(true); } },
                      { label: "Download as Excel", icon: <DownloadIcon size={13} />, action: () => { setExportFormat("Excel"); setShareMenuOpen(false); setExportDone(true); } },
                      { label: "Download as CSV", icon: <DownloadIcon size={13} />, action: () => { setExportFormat("CSV"); setShareMenuOpen(false); setExportDone(true); } },
                      { divider: true },
                      { label: "Print", icon: <PrinterIcon size={13} />, action: () => { setShareMenuOpen(false); } },
                    ].filter(Boolean).map((item, i) => item.divider
                      ? <div key={`d${i}`} style={{ height: 1, background: c.borderLight, margin: "4px 0" }} />
                      : <button key={item.label} onClick={item.action} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "9px 14px", border: "none", background: "none", textAlign: "left", fontSize: 13, cursor: "pointer", fontFamily: "inherit", color: c.text }}
                          onMouseEnter={e => e.currentTarget.style.background = c.bg} onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                        >{item.icon}{item.label}</button>
                    )}
                  </div>
                )}
              </div>
            </>) : isRunning ? (<>
              {/* Running state: show spinner + elapsed, everything else disabled */}
              <span style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 500, background: c.amberLight, color: c.amber, border: `1px solid ${c.amberBorder}` }}><Spinner size={12} color={c.amber} />Generating… {runElapsed > 0 ? `${runElapsed}s` : ""}</span>
            </>) : (<>
              {/* Pre-run: Save configuration | Schedule | Run Report */}
              <button onClick={() => { setMoreMenuOpen(false); if (!saveConfigName) setSaveConfigName(reportTitle); togglePanel("saveConfig"); }} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: c.textSec, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 500, padding: "6px 8px" }}><BookmarkIcon size={13} /> Save configuration</button>
              <Btn variant="secondary" size="sm" onClick={() => { togglePanel("schedule"); }} icon={<ClockIcon size={13} />}>Schedule</Btn>
              <Btn size="sm" onClick={handleRunReport}>Run Report</Btn>
            </>)}
          </div>
        </div>}

      {/* ── LEVEL-DEEP QUERY VIEW / EDITOR (S&L) ── */}
      {queryBuilderOpen && (() => {
        const editName = qbEditSource?.from === "sl-new" ? (qbNewQueryName || "New Query") : (qbEditSource?.name || "Custom Query");
        const isEditing = qbEditMode;
        const isNew = qbEditSource?.from === "sl-new";
        const editCfg = qbEditSource ? ((_STD === FA_STANDARD_REPORTS ? FA_SAVED_CONFIGS : SAVED_CONFIGS).find(s => s.id === qbEditSource.id)) : null;
        const editDetails = editCfg?.queryDetails || { filtersList: [], columnsList: [], format: "Detail" };
        const savedQueryList = _STD === FA_STANDARD_REPORTS ? FA_SAVED_CONFIGS : SAVED_CONFIGS;
        const CAT_COLORS = {
          basic:        { bg: "#eff6ff", border: "#bfdbfe", text: "#1d4ed8" },
          depreciation: { bg: "#fffbeb", border: "#fde68a", text: "#b45309" },
          gl:           { bg: "#f0fdfa", border: "#99f6e4", text: "#0f766e" },
          warranty:     { bg: "#ecfdf5", border: "#a7f3d0", text: "#047857" },
        };
        return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

          {/* ── TOP NAV with CTAs at top ── */}
          <div style={{ padding: "9px 16px", borderBottom: `1px solid ${c.border}`, background: c.white, display: "flex", alignItems: "center", gap: 10, flexShrink: 0, minHeight: 48 }}>
            {/* View mode: ← Edit query; New query edit: ← Reports Library / ← Back */}
            {!isEditing && (
              <button
                onClick={() => setQbEditMode(true)}
                style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: c.textSec, cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: 500, padding: "4px 0", flexShrink: 0 }}>
                <ArrowLeft size={14} /> Edit query
              </button>
            )}
            {isEditing && isNew && (
              <button
                onClick={() => { if (initialPanel === "queryBuilder") { onBack(); } else { setQueryBuilderOpen(false); } }}
                style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: c.textSec, cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: 500, padding: "4px 0", flexShrink: 0 }}>
                <ArrowLeft size={14} /> {initialPanel === "queryBuilder" ? "Reports Library" : "Back"}
              </button>
            )}
            <div style={{ width: 1, height: 16, background: c.borderLight, flexShrink: 0 }} />
            {isNew && isEditing ? (
              <input
                type="text" value={qbNewQueryName} onChange={e => setQbNewQueryName(e.target.value)}
                placeholder="Name your query…"
                style={{ flex: "0 1 260px", padding: "5px 9px", border: `1px solid ${c.pri}`, borderRadius: 6, fontSize: 14, fontWeight: 600, outline: "none", fontFamily: "inherit", color: c.text }} />
            ) : (
              <span style={{ fontSize: 14, fontWeight: 700, color: c.text, whiteSpace: "nowrap" }}>{editName}</span>
            )}
            {!isEditing && <span style={{ fontSize: 12, color: c.textTer, fontWeight: 400 }}>— custom query</span>}
            <div style={{ flex: 1 }} />
            {isEditing ? (<>
              <button
                onClick={() => { setQbCriteria([]); setQbLogicOps({}); resetQbCols(); setQbOutputFormat("detail"); setQbGroups([{ id: 1, name: "Group 1" }]); setQbGroupLogics({}); setActiveGroupId(1); setQbSelectedOtherQueries(new Set()); setQbOtherQuerySearch(""); }}
                style={{ background: "none", border: "none", color: c.textSec, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 500, padding: "5px 8px", whiteSpace: "nowrap" }}>
                Reset all
              </button>
              <Btn variant="secondary" size="sm" onClick={() => { if (!saveConfigName) setSaveConfigName(editName); togglePanel("saveConfig"); }} icon={<BookmarkIcon size={12} />}>Save query</Btn>
              <Btn size="sm" onClick={() => {
                if (isNew) {
                  // Save & run: close QB and trigger run
                  setQueryBuilderOpen(false);
                  setTimeout(() => handleRunReport(), 50);
                } else {
                  // Apply: go to view mode (user can then Run report)
                  setQbEditMode(false);
                }
              }}>
                {isNew ? "Save & run" : "Apply"}
              </Btn>
              {/* Close icon — in edit mode only */}
              <button
                onClick={() => { if (!isNew) { setQbEditMode(false); } else { setQueryBuilderOpen(false); } }}
                title="Close"
                style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 28, height: 28, borderRadius: 6, background: "none", border: `1px solid ${c.borderLight}`, cursor: "pointer", color: c.textTer, flexShrink: 0 }}
                onMouseEnter={e => { e.currentTarget.style.background = c.bg; e.currentTarget.style.color = c.textSec; }}
                onMouseLeave={e => { e.currentTarget.style.background = "none"; e.currentTarget.style.color = c.textTer; }}>
                <XIcon size={14} />
              </button>
            </>) : (<>
              <Btn variant="secondary" size="sm" onClick={() => { if (!saveConfigName) setSaveConfigName(editName); setQueryBuilderOpen(false); setTimeout(() => togglePanel("saveConfig"), 50); }} icon={<BookmarkIcon size={12} />}>Save query</Btn>
              <Btn size="sm" onClick={() => { setQueryBuilderOpen(false); setTimeout(() => handleRunReport(), 50); }}>Run report</Btn>
            </>)}
          </div>

          {/* Applied / saved toast */}
          {showEditAppliedToast && (
            <div style={{ padding: "8px 16px", background: c.greenLight, borderBottom: `1px solid ${c.greenBorder}`, display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <CheckIcon size={14} style={{ color: c.green, flexShrink: 0 }} />
              <span style={{ fontSize: 12, fontWeight: 500, color: c.green, flex: 1 }}>
                {isNew ? `Query "${qbNewQueryName || "Untitled"}" saved.` : `Changes applied to "${editName}".`}
              </span>
              <button onClick={() => setShowEditAppliedToast(false)} style={{ background: "none", border: "none", cursor: "pointer", color: c.green, padding: 2 }}><XIcon size={12} /></button>
            </div>
          )}

          {/* ── VIEW MODE: read-only query summary ── */}
          {!isEditing && (
            <div style={{ flex: 1, overflowY: "auto", padding: "24px 28px" }}>
              <div style={{ maxWidth: 640 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Criteria</div>
                {editDetails.filtersList.length === 0 ? (
                  <div style={{ fontSize: 13, color: c.textTer, fontStyle: "italic", marginBottom: 20 }}>No criteria — all assets included</div>
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 20 }}>
                    {editDetails.filtersList.map((f, i) => (
                      <div key={i} style={{ padding: "7px 12px", background: c.bg, borderRadius: 6, border: `1px solid ${c.borderLight}`, position: "relative" }}>
                        <span style={{ fontWeight: 600, color: c.text }}>{f.label}</span>
                        <span style={{ color: c.textSec, margin: "0 6px", fontSize: 12 }}>{f.op}</span>
                        <span style={{ fontWeight: 500, color: c.text }}>{f.value}</span>
                        {i > 0 && <div style={{ position: "absolute", top: -9, left: 10, fontSize: 9, fontWeight: 700, color: c.textTer, background: c.bg, padding: "0 3px", textTransform: "uppercase" }}>AND</div>}
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ fontSize: 11, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>Columns</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 20 }}>
                  {editDetails.columnsList.map((col, i) => (
                    <span key={i} style={{ padding: "4px 9px", borderRadius: 5, background: c.tagBg, border: `1px solid ${c.borderLight}`, fontSize: 12, color: c.tagText, fontWeight: 500 }}>{col}</span>
                  ))}
                </div>
                <div style={{ fontSize: 11, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 6 }}>Output format</div>
                <div style={{ fontSize: 13, color: c.text }}>{editDetails.format}</div>
              </div>
            </div>
          )}

          {/* ── EDIT MODE: two-panel builder ── */}
          {isEditing && (
            <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>

              {/* ═══ LEFT PANEL: Tabbed ═══ */}
              <div style={{ width: 360, minWidth: 320, borderRight: `1px solid ${c.border}`, display: "flex", flexDirection: "column", background: c.bg, flexShrink: 0, overflow: "hidden" }}>

                {/* Tab bar */}
                <div style={{ display: "flex", borderBottom: `1px solid ${c.border}`, background: c.white, flexShrink: 0 }}>
                  {[{ key: "filters", label: "Filters" }, { key: "columns", label: "Columns" }].map(tab => (
                    <button key={tab.key} onClick={() => setQbLeftTab(tab.key)}
                      style={{ flex: 1, padding: "9px 12px", fontSize: 12, fontWeight: 500, cursor: "pointer", fontFamily: "inherit", background: "none", border: "none", borderBottom: `2px solid ${qbLeftTab === tab.key ? c.pri : "transparent"}`, color: qbLeftTab === tab.key ? c.text : c.textTer, display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                      {tab.label}
                      {tab.key === "filters" && qbCriteria.length > 0 && (
                        <span style={{ fontSize: 10, fontWeight: 700, color: c.pri, background: "#eff4ff", borderRadius: 8, padding: "1px 6px" }}>{qbCriteria.length}</span>
                      )}
                      {tab.key === "columns" && (
                        <span style={{ fontSize: 10, color: qbLeftTab === "columns" ? c.pri : c.textTer, background: qbLeftTab === "columns" ? "#eff4ff" : c.bg, borderRadius: 8, padding: "1px 6px" }}>{qbSelectedCols.length}</span>
                      )}
                    </button>
                  ))}
                </div>

                {/* ── FILTERS TAB ── */}
                {qbLeftTab === "filters" && <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column" }}>

                {/* ── Section: Add Categories ── */}
                <div style={{ borderBottom: `1px solid ${c.border}` }}>
                  <div style={{ padding: "9px 12px 5px", fontSize: 10, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.6px" }}>Add Categories</div>
                  {QB_CRITERIA_CATEGORIES.map(cat => {
                    const cc = CAT_COLORS[cat.key] || CAT_COLORS.basic;
                    const catCount = qbCriteria.filter(cr => cr.catKey === cat.key).length;
                    const isExpanded = qbExpandedCats.includes(cat.key);
                    return (
                      <div key={cat.key}>
                        <button onClick={() => toggleQbCat(cat.key)}
                          style={{ width: "100%", display: "flex", alignItems: "center", gap: 6, padding: "7px 12px", background: isExpanded ? c.white : "none", border: "none", borderTop: `1px solid ${c.borderLight}`, cursor: "pointer", fontFamily: "inherit", textAlign: "left" }}>
                          <span style={{ fontSize: 12, fontWeight: 600, color: c.text, flex: 1 }}>{cat.label}</span>
                          {catCount > 0 && (
                            <span style={{ minWidth: 16, height: 16, borderRadius: 8, background: cc.text, color: "#fff", fontSize: 9, fontWeight: 700, display: "inline-flex", alignItems: "center", justifyContent: "center", padding: "0 3px", flexShrink: 0 }}>{catCount}</span>
                          )}
                          <span style={{ color: c.textTer, fontSize: 10, flexShrink: 0 }}>{isExpanded ? "▲" : "▼"}</span>
                        </button>
                        {isExpanded && (
                          <div style={{ padding: "3px 8px 8px 10px", background: c.white }}>
                            {cat.fields.map(field => {
                              const alreadyAdded = qbCriteria.some(cr => cr.fieldId === field.id);
                              return (
                                <div key={field.id}
                                  onClick={() => { if (!alreadyAdded) addQbCriterion(field, cat.key); }}
                                  title={alreadyAdded ? "Already in criteria" : `Add "${field.label}" to ${qbGroups.find(g => g.id === activeGroupId)?.name || "group"}`}
                                  style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 6px", borderRadius: 4, cursor: alreadyAdded ? "default" : "pointer", fontSize: 12, color: alreadyAdded ? cc.text : c.textSec, fontWeight: alreadyAdded ? 600 : 400, background: alreadyAdded ? cc.bg : "none", marginBottom: 1 }}
                                  onMouseEnter={e => { if (!alreadyAdded) e.currentTarget.style.background = c.bg; }}
                                  onMouseLeave={e => { if (!alreadyAdded) e.currentTarget.style.background = "none"; }}>
                                  <span style={{ color: alreadyAdded ? cc.text : c.textTer, fontSize: 12, width: 12, flexShrink: 0, textAlign: "center" }}>{alreadyAdded ? "✓" : "+"}</span>
                                  {field.label}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* ── Section: Other Queries ── */}
                <div style={{ borderBottom: `1px solid ${c.border}` }}>
                  <div style={{ padding: "9px 12px 5px", fontSize: 10, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.6px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <span>Other Queries</span>
                    {qbSelectedOtherQueries.size > 0 && <span style={{ fontSize: 9, fontWeight: 700, color: "#475569", background: "#e2e8f0", borderRadius: 8, padding: "1px 5px" }}>{qbSelectedOtherQueries.size}</span>}
                  </div>
                  <div style={{ maxHeight: 200, overflowY: "auto", padding: "0 8px 8px" }}>
                    {savedQueryList.map(cfg => {
                      const isSel = qbSelectedOtherQueries.has(cfg.id);
                      return (
                        <label key={cfg.id}
                          style={{ display: "flex", alignItems: "flex-start", gap: 7, padding: "5px 5px", cursor: "pointer", borderRadius: 4, fontSize: 12, background: isSel ? "#f0f4ff" : "none" }}
                          onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = c.bg; }}
                          onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = "none"; }}>
                          <input type="checkbox" checked={isSel}
                            onChange={() => setQbSelectedOtherQueries(prev => { const n = new Set(prev); if (n.has(cfg.id)) n.delete(cfg.id); else n.add(cfg.id); return n; })}
                            style={{ marginTop: 2, flexShrink: 0 }} />
                          <span style={{ color: isSel ? c.pri : c.textSec, fontWeight: isSel ? 500 : 400, lineHeight: 1.4 }}>{cfg.name}</span>
                        </label>
                      );
                    })}
                  </div>
                </div>

                </div>{/* end Filters tab */}}

                {/* ── COLUMNS TAB ── */}
                {qbLeftTab === "columns" && <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column" }}>
                  <div style={{ padding: "10px 12px 6px", fontSize: 10, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.6px" }}>Available Columns</div>
                  <div style={{ padding: "0 8px 6px", position: "relative" }}>
                    <input type="text" value={qbColSearch} onChange={e => setQbColSearch(e.target.value)} placeholder="Search columns…"
                      style={{ width: "100%", padding: "5px 8px 5px 26px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 11, fontFamily: "inherit", outline: "none", boxSizing: "border-box", color: c.text }} />
                    <SearchIcon size={11} style={{ position: "absolute", left: 15, top: 7, color: c.textTer, pointerEvents: "none" }} />
                  </div>
                  <div style={{ padding: "0 8px 16px" }}>
                    {QB_AVAILABLE_COLUMNS.filter(col => !qbColSearch || col.label.toLowerCase().includes(qbColSearch.toLowerCase())).map((col) => {
                      const isSel = qbSelectedCols.includes(col.id);
                      return (
                        <div key={col.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 6px", borderRadius: 5, fontSize: 12, cursor: "pointer", background: isSel ? "#eff4ff" : "none", borderBottom: `1px solid ${c.borderLight}` }}
                          onClick={() => toggleQbCol(col.id)}
                          onMouseEnter={e => e.currentTarget.style.background = isSel ? "#eff4ff" : c.bg}
                          onMouseLeave={e => e.currentTarget.style.background = isSel ? "#eff4ff" : "none"}>
                          <input type="checkbox" checked={isSel} onChange={() => toggleQbCol(col.id)} onClick={e => e.stopPropagation()} style={{ flexShrink: 0 }} />
                          <span style={{ flex: 1, color: isSel ? c.text : c.textSec, fontWeight: isSel ? 500 : 400 }}>{col.label}</span>
                          {isSel && <span style={{ fontSize: 10, color: c.textTer }}>#{qbSelectedCols.indexOf(col.id) + 1}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>}{/* end Columns tab */}

              </div>{/* end LEFT PANEL */}

              {/* ═══ RIGHT PANEL: switches based on active left tab ═══ */}
              <div style={{ flex: 1, overflowY: "auto", padding: "14px 16px", background: c.white }}>

                {/* ── FILTERS TAB RIGHT PANEL ── */}
                {qbLeftTab === "filters" && (<>

                  {/* Live match status — only shown once filters are active */}
                  {(qbCriteria.length > 0 || qbSelectedOtherQueries.size > 0) && (
                    <div style={{ padding: "6px 12px", background: qbLevelDeepTotal === 0 ? "#fef2f2" : "#f0f4ff", border: `1px solid ${qbLevelDeepTotal === 0 ? "#fecaca" : "#c7d7f7"}`, borderRadius: 6, marginBottom: 12, fontSize: 12, color: c.textSec, display: "flex", alignItems: "center", gap: 7 }}>
                      <span style={{ fontWeight: 700, color: qbLevelDeepTotal === 0 ? c.red : c.text }}>~{qbLevelDeepTotal.toLocaleString()}</span>
                      <span>of {TOTAL_ROW_COUNT.toLocaleString()} assets match</span>
                      {qbLevelDeepTotal === 0 && <span style={{ color: c.red, fontSize: 11 }}>— no matches, adjust filters</span>}
                      {qbLevelDeepTotal === TOTAL_ROW_COUNT && qbLevelDeepTotal > 0 && <span style={{ color: c.textTer, fontSize: 11 }}>— set filter values to narrow results</span>}
                    </div>
                  )}

                  {/* Empty state — shown only when no categories added */}
                  {qbCriteria.length === 0 && qbSelectedOtherQueries.size === 0 && (
                    <div style={{ padding: "40px 24px", textAlign: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: c.textSec, marginBottom: 6 }}>No Categories Added Yet</div>
                      <div style={{ fontSize: 12, color: c.textTer, lineHeight: 1.6 }}>Select a category from the left to start.</div>
                    </div>
                  )}

                  {/* Filter group targeting hint — only when multiple groups */}
                  {(qbCriteria.length > 0 || qbSelectedOtherQueries.size > 0) && qbGroups.length > 1 && (
                    <div style={{ fontSize: 11, color: c.textTer, marginBottom: 8 }}>Click a filter group to make it active, then add fields from the left.</div>
                  )}

                  {/* Groups — only shown once at least one field is added */}
                  {(qbCriteria.length > 0 || qbSelectedOtherQueries.size > 0) && qbGroups.map((grp, gi) => {
                    const groupCriteria = qbCriteria.filter(cr => cr.groupId === grp.id);
                    return (
                      <React.Fragment key={grp.id}>
                        {/* Between-group And/Or toggle */}
                        {gi > 0 && (
                          <div style={{ display: "flex", justifyContent: "center", padding: "3px 0" }}>
                            <button onClick={() => toggleQbGroupLogic(grp.id)}
                              style={{ padding: "2px 12px", borderRadius: 4, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: `1px solid ${c.border}`, background: c.bg, color: c.textSec, textTransform: "uppercase" }}
                              onMouseEnter={e => { e.currentTarget.style.background = "#eff4ff"; e.currentTarget.style.borderColor = c.pri; e.currentTarget.style.color = c.pri; }}
                              onMouseLeave={e => { e.currentTarget.style.background = c.bg; e.currentTarget.style.borderColor = c.border; e.currentTarget.style.color = c.textSec; }}>
                              {qbGroupLogics[grp.id] || "and"}
                            </button>
                          </div>
                        )}

                        {/* Group box — active left-border indicator only when multiple groups */}
                        <div style={{ border: `1px solid ${c.border}`, borderLeft: qbGroups.length > 1 && activeGroupId === grp.id ? `4px solid ${c.pri}` : `1px solid ${c.border}`, borderRadius: 8, marginBottom: 8, overflow: "hidden" }}>
                          {/* Group header — clicking anywhere expands/collapses; clicking name renames */}
                          <div
                            onClick={() => {
                              if (qbGroupEditingId === grp.id) return;
                              setQbCollapsedGroups(prev => { const n = new Set(prev); n.has(grp.id) ? n.delete(grp.id) : n.add(grp.id); return n; });
                              if (qbGroups.length > 1) setActiveGroupId(grp.id);
                            }}
                            style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 10px", background: qbGroups.length > 1 && activeGroupId === grp.id ? "#f8fafc" : c.bg, borderBottom: groupCriteria.length > 0 && !qbCollapsedGroups.has(grp.id) ? `1px solid ${c.borderLight}` : "none", cursor: "pointer", userSelect: "none" }}>
                            <span style={{ fontSize: 9, color: c.textTer, flexShrink: 0, width: 10, textAlign: "center" }}>
                              {qbCollapsedGroups.has(grp.id) ? "▶" : "▼"}
                            </span>
                            {qbGroupEditingId === grp.id ? (
                              <input type="text" value={qbGroupEditingName} onChange={e => setQbGroupEditingName(e.target.value)} autoFocus
                                onClick={e => e.stopPropagation()}
                                onBlur={() => { renameQbGroup(grp.id, qbGroupEditingName || grp.name); setQbGroupEditingId(null); }}
                                onKeyDown={e => { if (e.key === "Enter") { renameQbGroup(grp.id, qbGroupEditingName || grp.name); setQbGroupEditingId(null); } else if (e.key === "Escape") setQbGroupEditingId(null); }}
                                style={{ flex: 1, padding: "2px 6px", border: `1px solid ${c.pri}`, borderRadius: 4, fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                            ) : (
                              <span
                                onClick={e => { e.stopPropagation(); setQbGroupEditingId(grp.id); setQbGroupEditingName(grp.name); }}
                                title="Click to rename"
                                style={{ flex: 1, fontSize: 12, fontWeight: 600, color: c.textSec, cursor: "text" }}
                                onMouseEnter={e => e.currentTarget.style.textDecoration = "underline"}
                                onMouseLeave={e => e.currentTarget.style.textDecoration = "none"}>
                                {grp.name}
                              </span>
                            )}
                            <button onClick={e => { e.stopPropagation(); removeQbGroup(grp.id); }} title="Remove this filter group"
                              style={{ background: "none", border: "none", cursor: "pointer", color: c.textTer, padding: "2px 4px", display: "flex", alignItems: "center", flexShrink: 0 }}
                              onMouseEnter={e => e.currentTarget.style.color = c.red}
                              onMouseLeave={e => e.currentTarget.style.color = c.textTer}><TrashIcon size={13} /></button>
                          </div>

                          {/* Criteria list — hidden when collapsed */}
                          {!qbCollapsedGroups.has(grp.id) && (groupCriteria.length === 0 ? (
                            <div style={{ padding: "10px 14px", fontSize: 12, color: c.textTer, fontStyle: "italic", background: c.white }}>
                              {qbGroups.length > 1 && activeGroupId !== grp.id ? "Click this filter group to make it active, then add fields from the left." : "Open a category on the left and click a field to add it here."}
                            </div>
                          ) : (
                            <div style={{ padding: "8px 10px", display: "flex", flexDirection: "column", gap: 0, background: c.white }}>
                              {groupCriteria.map((cr, idx) => {
                                const bc = CAT_COLORS[cr.catKey] || CAT_COLORS.basic;
                                return (
                                  <React.Fragment key={cr.id}>
                                    {/* And/Or between criteria */}
                                    {idx > 0 && (
                                      <div style={{ padding: "2px 4px" }}>
                                        <button onClick={() => toggleQbLogic(cr.id)}
                                          style={{ padding: "2px 8px", borderRadius: 4, fontSize: 10, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", border: `1px solid ${c.border}`, background: c.bg, color: c.textSec, textTransform: "uppercase" }}
                                          onMouseEnter={e => { e.currentTarget.style.background = "#eff4ff"; e.currentTarget.style.borderColor = c.pri; e.currentTarget.style.color = c.pri; }}
                                          onMouseLeave={e => { e.currentTarget.style.background = c.bg; e.currentTarget.style.borderColor = c.border; e.currentTarget.style.color = c.textSec; }}>
                                          {qbLogicOps[cr.id] || "and"}
                                        </button>
                                      </div>
                                    )}

                                    {/* Criterion row — list-item style with trash on far right */}
                                    <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 8px", background: "#fafbfc", borderRadius: 6, border: `1px solid ${c.borderLight}` }}>
                                      {/* Field badge */}
                                      <span style={{ display: "inline-flex", alignItems: "center", padding: "3px 8px", borderRadius: 10, background: bc.bg, border: `1px solid ${bc.border}`, color: bc.text, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", flexShrink: 0, marginTop: 2 }}>
                                        {cr.label}
                                      </span>

                                      {/* Controls (type-specific) */}
                                      <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 4, minWidth: 0, alignItems: "flex-start" }}>
                                        {cr.type === "boolean" && (
                                          <div style={{ display: "flex", gap: 4 }}>
                                            {["Yes", "No"].map(v => (
                                              <button key={v} onClick={() => updateQbCriterion(cr.id, { value: v })}
                                                style={{ padding: "4px 14px", borderRadius: 5, fontSize: 12, cursor: "pointer", fontFamily: "inherit", border: `1px solid ${cr.value === v ? c.pri : c.border}`, background: cr.value === v ? "#eff4ff" : c.white, color: cr.value === v ? c.pri : c.textSec, fontWeight: cr.value === v ? 600 : 400 }}>{v}</button>
                                            ))}
                                          </div>
                                        )}

                                        {cr.type === "multiselect" && (() => {
                                          const msSearch = qbMultiselectSearches[cr.id] || "";
                                          const selectedCount = (cr.value || []).length;
                                          const isOpen = !!qbMultiselectDropOpen[cr.id];
                                          const dropRect = qbMultiselectDropRect[cr.id];
                                          const filteredOpts = (cr.options || []).filter(o => !msSearch || o.toLowerCase().includes(msSearch.toLowerCase()));
                                          return (
                                            <div style={{ width: "100%", maxWidth: 320 }}>
                                              {/* Collapsed trigger */}
                                              <button
                                                onFocus={e => {
                                                  const rect = e.currentTarget.getBoundingClientRect();
                                                  setQbMultiselectDropRect(prev => ({ ...prev, [cr.id]: { top: rect.bottom + 2, left: rect.left, width: Math.max(rect.width, 220) } }));
                                                  setQbMultiselectDropOpen(prev => ({ ...prev, [cr.id]: true }));
                                                }}
                                                onBlur={() => setTimeout(() => setQbMultiselectDropOpen(prev => ({ ...prev, [cr.id]: false })), 180)}
                                                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%", padding: "5px 8px", border: `1px solid ${isOpen ? c.pri : c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", background: c.white, cursor: "pointer", color: selectedCount > 0 ? c.text : c.textTer, textAlign: "left" }}>
                                                <span>{selectedCount === 0 ? "Any (no filter)" : `${selectedCount} selected`}</span>
                                                <span style={{ fontSize: 9, color: c.textTer }}>▾</span>
                                              </button>
                                              {/* Selected chips */}
                                              {selectedCount > 0 && (
                                                <div style={{ display: "flex", flexWrap: "wrap", gap: 3, marginTop: 4 }}>
                                                  {(cr.value || []).map(v => (
                                                    <span key={v} style={{ display: "inline-flex", alignItems: "center", gap: 3, padding: "1px 5px 1px 7px", background: "#eff4ff", border: `1px solid #c7d7f7`, borderRadius: 8, fontSize: 10, color: c.pri }}>
                                                      {v}
                                                      <button onMouseDown={e => e.preventDefault()} onClick={() => { const curr = cr.value || []; updateQbCriterion(cr.id, { value: curr.filter(x => x !== v) }); }}
                                                        style={{ background: "none", border: "none", cursor: "pointer", padding: 0, color: c.pri, display: "flex", alignItems: "center" }}><XIcon size={9} /></button>
                                                    </span>
                                                  ))}
                                                </div>
                                              )}
                                              {/* Floating dropdown */}
                                              {isOpen && dropRect && (
                                                <div style={{ position: "fixed", top: dropRect.top, left: dropRect.left, width: dropRect.width, maxHeight: 240, background: c.white, border: `1px solid ${c.border}`, borderRadius: 6, boxShadow: "0 4px 12px rgba(0,0,0,0.12)", zIndex: 3000, display: "flex", flexDirection: "column" }}>
                                                  <div style={{ padding: "6px 8px", borderBottom: `1px solid ${c.borderLight}`, position: "relative" }}>
                                                    <input type="text" value={msSearch}
                                                      onChange={e => setQbMultiselectSearches(prev => ({ ...prev, [cr.id]: e.target.value }))}
                                                      onMouseDown={e => e.stopPropagation()}
                                                      placeholder="Search…"
                                                      autoFocus
                                                      style={{ width: "100%", padding: "4px 8px 4px 24px", border: `1px solid ${c.border}`, borderRadius: 4, fontSize: 11, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
                                                    <SearchIcon size={11} style={{ position: "absolute", left: 15, top: 13, color: c.textTer, pointerEvents: "none" }} />
                                                  </div>
                                                  <div style={{ overflowY: "auto", flex: 1 }}>
                                                    {filteredOpts.length === 0 && <div style={{ padding: "8px 12px", fontSize: 11, color: c.textTer, fontStyle: "italic" }}>No matches</div>}
                                                    {filteredOpts.map(opt => {
                                                      const isChecked = (cr.value || []).includes(opt);
                                                      return (
                                                        <label key={opt} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", cursor: "pointer", fontSize: 12, background: isChecked ? "#f0f4ff" : c.white, borderBottom: `1px solid ${c.borderLight}` }}
                                                          onMouseDown={e => e.preventDefault()}
                                                          onMouseEnter={e => { if (!isChecked) e.currentTarget.style.background = c.bg; }}
                                                          onMouseLeave={e => { e.currentTarget.style.background = isChecked ? "#f0f4ff" : c.white; }}>
                                                          <input type="checkbox" checked={isChecked} onChange={() => {
                                                            const curr = cr.value || [];
                                                            updateQbCriterion(cr.id, { value: curr.includes(opt) ? curr.filter(x => x !== opt) : [...curr, opt] });
                                                          }} />
                                                          <span style={{ color: isChecked ? c.pri : c.text, fontWeight: isChecked ? 500 : 400 }}>{opt}</span>
                                                        </label>
                                                      );
                                                    })}
                                                  </div>
                                                </div>
                                              )}
                                            </div>
                                          );
                                        })()}

                                        {cr.type === "select" && (
                                          <select value={cr.value} onChange={e => updateQbCriterion(cr.id, { value: e.target.value })}
                                            style={{ padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", background: c.white, color: c.text, outline: "none", maxWidth: 280 }}>
                                            {(cr.options || []).map(o => <option key={o} value={o}>{o}</option>)}
                                          </select>
                                        )}

                                        {cr.type === "date" && (
                                          <div style={{ display: "flex", flexDirection: "column", gap: 4, width: "100%", maxWidth: 320 }}>
                                            <select value={cr.op || "Specific"} onChange={e => updateQbCriterion(cr.id, { op: e.target.value, value: "" })}
                                              style={{ padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", background: c.white, color: c.text, outline: "none" }}>
                                              {["Today", "Last 7 Days", "Month to Date", "Year to Date", "Previous Month", "Previous Calendar Year", "Specific", "Less than or equal", "Greater than or equal", "Range", "Has Value", "No Value"].map(o => <option key={o} value={o}>{o}</option>)}
                                            </select>
                                            {["Specific", "Less than or equal", "Greater than or equal"].includes(cr.op || "Specific") && (
                                              <input type="date" value={cr.value || ""} onChange={e => updateQbCriterion(cr.id, { value: e.target.value })}
                                                style={{ padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                                            )}
                                            {(cr.op || "Specific") === "Range" && (
                                              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                                <input type="date" value={cr.value?.start || ""} onChange={e => updateQbCriterion(cr.id, { value: { ...(cr.value || {}), start: e.target.value } })}
                                                  style={{ flex: 1, padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                                                <span style={{ fontSize: 11, color: c.textTer }}>to</span>
                                                <input type="date" value={cr.value?.end || ""} onChange={e => updateQbCriterion(cr.id, { value: { ...(cr.value || {}), end: e.target.value } })}
                                                  style={{ flex: 1, padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                                              </div>
                                            )}
                                          </div>
                                        )}

                                        {(cr.type === "text" || cr.type === "number") && (
                                          <div style={{ display: "flex", gap: 5, width: "100%", maxWidth: 360 }}>
                                            <select value={cr.op || (cr.type === "number" ? "Equal" : "Contains")} onChange={e => updateQbCriterion(cr.id, { op: e.target.value })}
                                              style={{ padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", background: c.white, color: c.text, outline: "none", flexShrink: 0 }}>
                                              {(cr.type === "number"
                                                ? ["Equal", "Greater Than Or Equal", "Less Than Or Equal", "Has Value", "No Value"]
                                                : ["Contains", "Equal", "Starts With", "Does Not Contain", "Does Not Start With", "Has Value", "No Value"]
                                              ).map(o => <option key={o} value={o}>{o}</option>)}
                                            </select>
                                            {!["Has Value", "No Value"].includes(cr.op || (cr.type === "number" ? "Equal" : "Contains")) && (
                                              <input type={cr.type === "number" ? "number" : "text"} value={cr.value || ""} onChange={e => updateQbCriterion(cr.id, { value: e.target.value })} placeholder={cr.type === "number" ? "0" : "Value…"}
                                                style={{ flex: 1, padding: "5px 8px", border: `1px solid ${c.border}`, borderRadius: 5, fontSize: 12, fontFamily: "inherit", outline: "none", minWidth: 0 }} />
                                            )}
                                          </div>
                                        )}
                                      </div>
                                      {/* Subtle divider + trash icon on far right */}
                                      <div style={{ width: 1, background: c.borderLight, alignSelf: "stretch", flexShrink: 0, marginLeft: 2 }} />
                                      <button onClick={() => removeQbCriterion(cr.id)} title="Remove this filter"
                                        style={{ background: "none", border: "none", cursor: "pointer", color: c.textTer, padding: "2px 2px", display: "flex", alignItems: "center", flexShrink: 0, marginTop: 1 }}
                                        onMouseEnter={e => e.currentTarget.style.color = c.red}
                                        onMouseLeave={e => e.currentTarget.style.color = c.textTer}><TrashIcon size={13} /></button>
                                    </div>
                                  </React.Fragment>
                                );
                              })}
                            </div>
                          ))}
                        </div>
                      </React.Fragment>
                    );
                  })}

                  {/* Add group button — only when criteria exist */}
                  {(qbCriteria.length > 0 || qbSelectedOtherQueries.size > 0) && (
                    <button onClick={addQbGroup}
                      style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, padding: "8px 12px", borderRadius: 5, border: `1px dashed ${c.border}`, background: "none", cursor: "pointer", fontFamily: "inherit", marginBottom: 12, width: "100%" }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = c.textSec; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = c.border; }}>
                      <span style={{ fontSize: 12, color: c.textSec, textDecoration: "underline" }}>+ Add filter group</span>
                      <span style={{ fontSize: 11, color: c.textTer, textDecoration: "none" }}>OR logic between filter groups</span>
                    </button>
                  )}

                  {/* Other Queries inclusions indicator */}
                  {qbSelectedOtherQueries.size > 0 && (
                    <div style={{ padding: "8px 12px", background: "#f1f5f9", border: `1px solid #cbd5e1`, borderRadius: 8, marginBottom: 12, fontSize: 12, color: "#475569", lineHeight: 1.6 }}>
                      <span style={{ fontWeight: 600, color: c.text }}>Also includes results from: </span>
                      {[...qbSelectedOtherQueries].map((id, i) => {
                        const cfg = savedQueryList.find(x => x.id === id);
                        return cfg ? <span key={id}>{i > 0 ? ", " : ""}<span style={{ fontWeight: 500 }}>{cfg.name}</span></span> : null;
                      })}
                      <span style={{ color: c.textTer }}> (combined with OR)</span>
                    </div>
                  )}

                </>)}{/* end filters tab right panel */}

                {/* ── COLUMNS TAB RIGHT PANEL ── */}
                {qbLeftTab === "columns" && (<>

                  {/* Section: Column order */}
                  <div style={{ marginBottom: 20 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: c.textTer, textTransform: "uppercase", letterSpacing: "0.6px", marginBottom: 8 }}>Included Columns</div>

                    {qbSelectedCols.length === 0 ? (
                      <div style={{ padding: "20px 16px", textAlign: "center", border: `1px dashed ${c.border}`, borderRadius: 6 }}>
                        <div style={{ fontSize: 12, color: c.textTer }}>No columns selected — use the list on the left to add columns.</div>
                      </div>
                    ) : (
                      <div style={{ border: `1px solid ${c.border}`, borderRadius: 6, overflow: "hidden" }}>
                        {qbSelectedCols.map((colId, idx) => {
                          const col = QB_AVAILABLE_COLUMNS.find(cl => cl.id === colId);
                          if (!col) return null;
                          const isFirst = idx === 0;
                          const isLast = idx === qbSelectedCols.length - 1;
                          return (
                            <div key={colId} style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 10px", background: idx % 2 === 0 ? c.white : c.bg, borderBottom: !isLast ? `1px solid ${c.borderLight}` : "none" }}>
                              {/* Position number */}
                              <span style={{ fontSize: 10, color: c.textTer, fontWeight: 600, minWidth: 16, textAlign: "right", flexShrink: 0 }}>{idx + 1}</span>
                              {/* Column name */}
                              <span style={{ flex: 1, fontSize: 12, color: c.text, fontWeight: 500 }}>{col.label}</span>
                              {/* Reorder: move left (up in order) */}
                              <button onClick={() => {
                                if (isFirst) return;
                                setQbSelectedCols(prev => { const n = [...prev]; [n[idx - 1], n[idx]] = [n[idx], n[idx - 1]]; return n; });
                              }} title="Move left in report" disabled={isFirst}
                                style={{ background: "none", border: "none", cursor: isFirst ? "default" : "pointer", color: isFirst ? c.borderLight : c.textTer, padding: "2px 3px", display: "flex", alignItems: "center", flexShrink: 0 }}
                                onMouseEnter={e => { if (!isFirst) e.currentTarget.style.color = c.textSec; }}
                                onMouseLeave={e => { e.currentTarget.style.color = isFirst ? c.borderLight : c.textTer; }}>
                                ←
                              </button>
                              {/* Reorder: move right (down in order) */}
                              <button onClick={() => {
                                if (isLast) return;
                                setQbSelectedCols(prev => { const n = [...prev]; [n[idx], n[idx + 1]] = [n[idx + 1], n[idx]]; return n; });
                              }} title="Move right in report" disabled={isLast}
                                style={{ background: "none", border: "none", cursor: isLast ? "default" : "pointer", color: isLast ? c.borderLight : c.textTer, padding: "2px 3px", display: "flex", alignItems: "center", flexShrink: 0 }}
                                onMouseEnter={e => { if (!isLast) e.currentTarget.style.color = c.textSec; }}
                                onMouseLeave={e => { e.currentTarget.style.color = isLast ? c.borderLight : c.textTer; }}>
                                →
                              </button>
                              {/* Divider */}
                              <div style={{ width: 1, background: c.borderLight, alignSelf: "stretch", flexShrink: 0, marginLeft: 2 }} />
                              {/* Remove */}
                              <button onClick={() => toggleQbCol(colId)} title="Remove column"
                                style={{ background: "none", border: "none", cursor: "pointer", color: c.textTer, padding: "2px 2px", display: "flex", alignItems: "center", flexShrink: 0 }}
                                onMouseEnter={e => e.currentTarget.style.color = c.red}
                                onMouseLeave={e => e.currentTarget.style.color = c.textTer}><TrashIcon size={13} /></button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  {/* Section: Sort */}
                  <div>
