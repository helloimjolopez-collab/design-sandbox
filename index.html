<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboards Sandbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 48px 24px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #1d1d1f;
    }

    header p {
      margin-top: 8px;
      font-size: 16px;
      color: #6e6e73;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 12px;
      margin-top: 40px;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      border: 1px solid #e5e5e5;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      border-color: #d0d0d0;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #1d1d1f;
    }

    .card-sub {
      font-size: 13px;
      color: #6e6e73;
      margin-top: 2px;
    }

    .arrow {
      color: #c7c7cc;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* colour themes per group */
    .icon-horizon  { background: #e8edf7; }
    .icon-oak      { background: #e8f5ee; }
    .icon-rock     { background: #fdf0e8; }
    .icon-amplify  { background: #f0e8fd; }
    .icon-account  { background: #fdf5e8; }
    .icon-present  { background: #fce8f0; }
    .icon-pathway  { background: #e8f0fd; }
    .icon-newco    { background: #ede8fd; }

    footer {
      margin-top: 64px;
      font-size: 13px;
      color: #aeaeb2;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Dashboards Sandbox</h1>
      <p>Widget and dashboard prototypes. Auto-deployed on save.</p>
    </header>





    <div class="section-label">Pathway</div>
    <div class="grid">
      <a class="card" href="./Widget%20Container%20Demo/" target="_blank">
        <div class="card-left">
          <div class="card-icon icon-pathway">🧩</div>
          <div>
            <div class="card-title">Dashboard + Widget Depth Ladder</div>
            <div class="card-sub">Pathway widget container prototype</div>
          </div>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>




    <footer>helloimjolopez-collab / design-sandbox &nbsp;·&nbsp; Auto-deployed via launchd watchers</footer>
  </div>
</body>
</html>
